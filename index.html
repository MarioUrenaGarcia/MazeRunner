<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maze Runner</title>
<style>
  /* El lienzo 3D ocupa toda la ventana; la interfaz va encima. Colores: rojo, blanco y negro. */
  :root { --rojo: #c62828; --negro: #111114; --dorado: #ffc107; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
               font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; user-select: none; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter .35s; }
  #interfaz { position: fixed; inset: 0; pointer-events: none; }
  #interfaz button { pointer-events: auto; cursor: pointer; font: inherit; }

  /* Barra superior, como en un juego de carreras: nombre, marcador y cronómetro. */
  #barra { position: absolute; top: 0; left: 0; right: 0; height: 64px; background: var(--negro);
           border-bottom: 5px solid var(--rojo); display: flex; align-items: center; padding: 0 22px; gap: 20px; }
  #titulo { font-size: 28px; font-weight: 800; white-space: nowrap; }
  #centro { flex: 1; text-align: center; font-size: 22px; font-weight: 700; white-space: nowrap; }
  #centro b { color: var(--dorado); font-size: 28px; }
  .puesto { display: inline-block; margin: 0 5px; padding: 1px 8px 2px 6px; border-radius: 7px; background: #2a2a30; font-size: 17px; }
  .puesto b { font-size: 21px !important; } .puesto.seguido { outline: 2px solid var(--dorado); }
  #tiempo { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
  i { display: inline-block; width: 12px; height: 18px; border-radius: 3px; border: 2px solid #fff; margin: 0 7px -3px 4px; }

  #mensaje { position: absolute; top: 78px; left: 0; right: 0; text-align: center; font-size: 19px; font-weight: 700;
             text-shadow: 0 2px 4px #000, 0 0 2px #000; }
  .dorado { color: var(--dorado); } .rosa { color: #ffb3b3; }
  #ayuda { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 14px; color: #f0f0f0;
           text-shadow: 0 1px 3px #000, 0 0 2px #000; }

  /* Letreros que flotan sobre la escena. */
  .etiqueta { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; text-shadow: 0 2px 4px #000, 0 0 2px #000; }
  .letrero { font-size: 17px; font-weight: 700; background: rgba(17, 17, 20, .82); padding: 3px 12px 4px 8px; border-radius: 8px; text-shadow: none; }
  .letrero b { font-size: 24px; margin-right: 2px; } .letrero b.primero { color: var(--dorado); }
  .letrero small { font-weight: 400; color: #cfcfcf; margin-left: 10px; font-size: 13px; }
  .nombre { font-size: 15px; font-weight: 700; }
  /* En ventanas angostas los letreros se achican y pierden su texto chico, para no encimarse. */
  @media (max-width: 760px) { .letrero { font-size: 12px; padding: 2px 6px 2px 4px; } .letrero b { font-size: 15px; } .letrero small { display: none; }
                              .letrero i { width: 8px; height: 12px; margin: 0 4px -2px 2px; } }
  .globo { background: #fff; color: #111; font-weight: 900; font-size: 18px; line-height: 12px; padding: 2px 9px 9px;
           border-radius: 14px; border: 2px solid #111; text-shadow: none; }

  /* Cuenta regresiva y avisos, al centro. */
  /* La cuenta regresiva va dentro de la barra, al centro: así no tapa ningún tablero ni letrero. */
  #cuenta { position: absolute; top: 0; left: 0; right: 0; height: 64px; line-height: 60px; text-align: center; font-size: 60px;
            font-weight: 900; color: var(--dorado); -webkit-text-stroke: 2px #000; animation: late .5s ease-out infinite alternate; }
  @keyframes late { from { transform: scale(1); } to { transform: scale(1.18); } }
  #aviso { position: absolute; top: 42%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800;
           color: var(--dorado); background: rgba(0, 0, 0, .72); padding: 14px 0; }
  #cartel { position: absolute; top: 96px; right: 24px; width: 360px; background: rgba(17, 17, 20, .93);
            border: 4px solid var(--rojo); border-radius: 14px; padding: 16px 20px; }
  #cartel h2 { margin: 0 0 10px; font-size: 30px; text-align: center; }
  #cartel table { width: 100%; border-collapse: collapse; font-size: 18px; font-weight: 600; }
  #cartel td { padding: 4px 2px; } #cartel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #cartel tr.yo { color: var(--dorado); }
  #cartel p { margin: 10px 0 0; font-size: 13px; color: #c8c8c8; text-align: center; }

  /* Botones al pie: elegir rival y controles del modo. */
  #rivales, #controles { position: absolute; bottom: 34px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px; }
  #rivales, #controles { flex-wrap: wrap; row-gap: 6px; padding: 0 10px; }
  #rivales span, #controles span { font-size: 15px; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  /* Al solo mirar captura la bandera hay once botones: se compactan para caber en un renglón. */
  #rivales.doble { gap: 5px; } #rivales.doble button { padding: 4px 8px; font-size: 13px; } #rivales.doble span { font-size: 13px; }
  #rivales.doble i { width: 9px; height: 14px; margin: 0 5px -2px 1px; }
  #interfaz button { background: #2a2a30; color: #fff; border: 1px solid #6a6a70; border-radius: 9px; padding: 7px 12px; font-size: 15px; white-space: nowrap; }
  #interfaz button.activo { background: var(--rojo); border-color: #fff; }

  /* El menú. */
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #menu h1 { margin: 0; font-size: min(11vw, 110px); font-weight: 900; -webkit-text-stroke: 3px #000; text-shadow: 0 6px 0 #000; }
  #menu .subtitulo { margin: 0 0 28px; font-size: min(3.4vw, 30px); font-weight: 700; border-top: 7px solid var(--rojo);
                     padding-top: 8px; text-shadow: 0 2px 4px #000; }
  /* Tres columnas: arriba los juegos, debajo de cada uno su versión de mirar y, al final, Aprender a todo lo ancho. */
  #menu .cajas { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); justify-content: center; gap: 14px;
                 width: 100%; max-width: 980px; padding: 0 12px; }
  #menu .cajas button[data-modo="aprender"] { grid-column: 1 / -1; height: 96px; }
  /* Todas las cajas miden lo mismo y su texto se parte en las líneas que haga falta. */
  #menu .cajas button { width: 100%; height: 138px; padding: 12px 16px; border-radius: 16px; background: rgba(24, 24, 28, .9);
                        border: 2px solid #8a8a90; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
                        white-space: normal; overflow: hidden; transition: background .15s, border-color .15s; }
  #menu .cajas button b { font-size: 22px; line-height: 1.15; } #menu .cajas button span { font-size: 15px; line-height: 1.25; color: #e2e2e2; }
  /* La caja elegida (con el cursor o con las flechas) se pinta de rojo, se apachurra y rebota. */
  #menu .cajas button.activo { background: var(--rojo); border-color: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, .35), 0 10px 24px rgba(0, 0, 0, .45);
                               transform: scale(1.05); animation: rebote .5s; }
  #menu .cajas button.activo span { color: #fff; }
  @keyframes rebote { 0% { transform: scale(1, 1); } 25% { transform: scale(1.12, .8); } 50% { transform: scale(.95, 1.12); }
                      75% { transform: scale(1.07, .98); } 100% { transform: scale(1.05); } }
  #menu .pie { font-size: 15px; text-shadow: 0 1px 3px #000; }
  #menu h1.chico { font-size: min(7vw, 64px); margin-bottom: 18px; }
  #menu.yendose { transition: opacity .35s; opacity: 0; }
  /* Las cajas del menú llegan una tras otra, subiendo. */
  #menu .cajas.entrando button { animation: entra .4s both; }
  @keyframes entra { from { opacity: 0; transform: translateY(50px) scale(.9); } to { opacity: 1; transform: none; } }

  /* La portada: el título arriba. Al abrir el menú se barre hacia la izquierda. */
  #portada { position: absolute; top: 6%; left: 0; right: 0; text-align: center; transition: transform .55s cubic-bezier(.6, 0, .9, .4), opacity .55s; }
  #portada.fuera { transform: translateX(-130%); opacity: 0; }
  #portada h1 { margin: 0; font-size: min(13vw, 140px); font-weight: 900; -webkit-text-stroke: 4px #000; text-shadow: 0 8px 0 #000; }
  #portada .subtitulo { display: inline-block; margin: 0; font-size: min(3.8vw, 36px); font-weight: 700; border-top: 8px solid var(--rojo);
                        padding-top: 8px; text-shadow: 0 2px 5px #000, 0 0 3px #000; }
  #portada .parpadea { position: fixed; bottom: 9%; left: 0; right: 0; margin: 0; font-size: min(4vw, 32px); font-weight: 800; color: var(--dorado);
                       text-shadow: 0 3px 0 #000, 0 0 4px #000; animation: parpadea 1s steps(2, jump-none) infinite; }
  @keyframes parpadea { from { opacity: 1; } to { opacity: .15; } }
  /* Los pedazos en que estalla una caja del menú. */
  .pedazo { position: fixed; border: 1px solid #000; pointer-events: none; }

  /* El modo Aprender. A la izquierda queda el tablero 3D, con los botones para elegir arriba y la leyenda abajo;
     a la derecha, un panel que se puede recorrer. --lado es el ancho de ese panel. */
  #aprender { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; --lado: clamp(340px, 42vw, 600px); }
  #eleccion, #leyenda { position: absolute; left: 10px; right: calc(var(--lado) + 10px); display: flex; flex-wrap: wrap; align-items: center; }
  #eleccion { top: 8px; gap: 6px; } #eleccion .corte { flex-basis: 100%; height: 0; }
  #eleccion p { flex-basis: 100%; margin: 0; font-size: 14px; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  #leyenda { bottom: 8px; gap: 4px 14px; font-size: 13px; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  #leyenda span { white-space: nowrap; } #leyenda em, #leyenda svg { display: inline-block; width: 14px; height: 14px; margin: 0 5px -2px 0; }
  #leyenda em.punto { border-radius: 50%; border: 1px solid #000; }
  .rotulo { font-size: 13px; font-weight: 700; background: rgba(17, 17, 20, .85); padding: 1px 7px 2px; border-radius: 5px; text-shadow: none; }
  #lado { position: absolute; top: 0; right: 0; bottom: 0; width: var(--lado); padding: 0 12px 12px; overflow-y: auto; pointer-events: auto;
          background: rgba(17, 17, 20, .94); border-left: 4px solid var(--rojo); touch-action: pan-y; overscroll-behavior: contain; }
  /* El número de paso y los botones se quedan a la vista aunque se baje a leer el código. */
  #fijo { position: sticky; top: 0; z-index: 1; background: var(--negro); padding: 10px 0 8px; border-bottom: 1px solid #3a3a40; }
  #numeroDePaso { font-size: 18px; font-weight: 800; color: var(--dorado); }
  #botonesDePaso { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #explicacion { margin: 10px 0; font-size: 15px; line-height: 1.4; min-height: 4.2em; }
  /* El código: letra de ancho fijo, del tamaño que deje caber el renglón más largo cuando el panel es ancho. */
  #codigo { background: #1e2026; border-radius: 8px; padding: 8px 6px; white-space: pre-wrap; overflow-wrap: anywhere; color: #c8c8c8;
            font: clamp(10.5px, calc((var(--lado) - 44px) / 46), 13px)/1.45 Consolas, "Courier New", monospace; }
  #codigo div { padding: 0 6px; border-radius: 3px; } #codigo div.actual { background: #ffeb3b; color: #111; font-weight: 700; }
  #teclas { margin-top: 10px; font-size: 12px; color: #b4b4b8; }
  /* La estructura de datos y la tabla: cajas oscuras dentro del panel. */
  #estructura, #tabla, #tablaFija { background: #1e2026; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; }
  #lado h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: #c8c8c8; } #lado p { margin: 8px 0 0; color: #c8c8c8; }
  .caja { flex: none; width: 42px; height: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #ffe082; color: #111; border: 2px solid #000; border-radius: 4px; font: 12px/1 Consolas, "Courier New", monospace; }
  .caja.sale { background: var(--rojo); color: #fff; } .caja b { font: 700 14px/1.1 "Segoe UI", system-ui, Arial, sans-serif; }
  /* La cola es un tubo: dos líneas, abierto por los dos lados. */
  .cola { display: flex; align-items: center; gap: 8px; } .cola > span { flex: none; width: 46px; text-align: center; font-size: 12px; }
  .tubo { flex: 1; display: flex; gap: 4px; height: 42px; padding: 0 6px; align-items: center; overflow: hidden;
          border-top: 3px solid #fff; border-bottom: 3px solid #fff; }
  .cola.prioridad .tubo { height: 56px; } .cola.prioridad .caja { height: 38px; }
  /* La pila es un vaso: dos paredes y un fondo, abierto solo por arriba. */
  .pila { display: flex; align-items: flex-end; gap: 10px; } .pila small { flex: none; width: 76px; text-align: right; color: #c8c8c8; padding-bottom: 6px; }
  .vaso { flex: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; width: 60px; height: 130px; padding: 5px 6px;
          border: 3px solid #fff; border-top: none; }
  .vaso .caja { height: 21px; }
  .rotulos { display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
  .comparacion table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .comparacion th { font-weight: 400; color: #c8c8c8; text-align: right; padding: 0 5px 3px; } .comparacion th:first-child { text-align: left; }
  .comparacion td { text-align: right; padding: 2px 5px; } .comparacion td:first-child { text-align: left; white-space: nowrap; }
  .comparacion tr.elegido { background: #40424a; } .comparacion tr.gana td:first-child, .comparacion tr.gana td:last-child, .verde { color: #78e68c; }
  .comparacion .gris { color: #9a9aa0; } .comparacion i { width: 10px; height: 14px; border-width: 1px; margin: 0 6px -2px 0; } .comparacion p { margin: 8px 0 0; color: #c8c8c8; }
  /* La tabla está escrita dos veces. En pantallas amplias se muestra la que va sobre la escena, arriba y junto
     al panel: así siempre está a la vista. En las demás se muestra la del panel, al final. */
  #tablaFija { display: none; position: absolute; top: 8px; right: calc(var(--lado) + 10px); width: 340px; margin: 0; background: rgba(17, 17, 20, .9); }
  @media (min-width: 1100px) and (min-height: 560px) {
    #tablaFija { display: block; } #tabla { display: none; } #eleccion { right: calc(var(--lado) + 360px); }
  }
  /* En ventanas angostas y altas el panel pasa abajo y el tablero queda arriba. */
  @media (max-width: 700px) and (orientation: portrait) {
    #lado { top: auto; left: 0; width: auto; height: 46%; border-left: none; border-top: 4px solid var(--rojo); }
    #eleccion { right: 10px; } #leyenda { right: 10px; bottom: calc(46% + 8px); }
    #aprender { --lado: 100vw; }
  }

  /* Teléfonos y ventanas chicas. La altura de la barra (--barra) y la del texto de ayuda (--pie) las mide el
     programa en cada cuadro; lo demás se coloca a partir de ellas, y así nada se encima. */
  :root { --barra: 64px; --pie: 19px; }
  html, body { touch-action: none; } #interfaz button { touch-action: manipulation; }
  #mensaje { top: calc(var(--barra) + 14px); padding: 0 8px; } #aprender { top: var(--barra); }
  #cartel { top: calc(var(--barra) + 32px); max-width: calc(100vw - 20px); }
  #rivales, #controles { bottom: calc(var(--pie) + 15px); }
  /* Lo que solo sirve con teclado se esconde cuando se juega con los dedos, y al revés. */
  .conDedo, #tactil { display: none; } body.tactil .conDedo { display: inline; } body.tactil #tactil { display: block; }
  body.tactil .conTeclado, body.tactil #ayuda, body.tactil #teclas, body.tactil #cartel p,
  body.tactil #controles button[data-accion="acercar"] { display: none !important; }
  body.tactil #rivales, body.tactil #controles { bottom: 8px; padding: 0 122px 0 144px; gap: 5px; }
  /* La cruceta: un disco con cuatro flechas. La flecha hacia donde apunta el dedo se pinta de dorado. */
  #cruceta { position: absolute; left: 12px; bottom: 12px; width: 124px; height: 124px; border-radius: 50%; pointer-events: auto;
             touch-action: none; background: rgba(17, 17, 20, .5); border: 2px solid rgba(255, 255, 255, .7); }
  #cruceta span { position: absolute; left: 50%; top: 50%; margin: -11px; border: 11px solid transparent; pointer-events: none; }
  #cruceta .arriba { transform: translateY(-40px); border-top-width: 0; border-bottom: 16px solid #fff; }
  #cruceta .abajo { transform: translateY(40px); border-bottom-width: 0; border-top: 16px solid #fff; }
  #cruceta .izquierda { transform: translateX(-40px); border-left-width: 0; border-right: 16px solid #fff; }
  #cruceta .derecha { transform: translateX(40px); border-right-width: 0; border-left: 16px solid #fff; }
  #cruceta .arriba.activa { border-bottom-color: var(--dorado); } #cruceta .abajo.activa { border-top-color: var(--dorado); }
  #cruceta .izquierda.activa { border-right-color: var(--dorado); } #cruceta .derecha.activa { border-left-color: var(--dorado); }
  #botonesTactiles { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 7px; }
  #interfaz #botonesTactiles button { min-width: 104px; padding: 9px 10px; font-size: 14px; background: rgba(42, 42, 48, .85); }
  #interfaz #botonesTactiles button.activo { background: var(--rojo); }
  /* El aviso de girar el teléfono tapa todo: mientras se ve, el juego está en pausa. */
  #girar { position: absolute; inset: 0; background: var(--negro); display: flex; flex-direction: column; align-items: center;
           justify-content: center; text-align: center; padding: 24px; pointer-events: auto; }
  #girar b { font-size: 26px; margin: 26px 0 8px; } #girar span { font-size: 16px; color: #cfcfcf; }
  #girar i { width: 54px; height: 96px; margin: 0; border: 4px solid #fff; border-radius: 10px; background: var(--rojo); animation: gira 2.2s ease-in-out infinite; }
  @keyframes gira { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  /* Ventanas angostas: la barra se hace de dos renglones, con el marcador abajo y completo; la cuenta
     regresiva va en ese segundo renglón, sin tocar el título. */
  @media (max-width: 760px) {
    #barra { height: auto; min-height: 64px; flex-wrap: wrap; align-content: center; padding: 4px 12px; gap: 0 10px; }
    #titulo { flex: 1; font-size: 18px; } #tiempo { font-size: 19px; min-width: 0; }
    #centro { order: 3; flex-basis: 100%; min-height: 32px; white-space: normal; font-size: 15px; line-height: 30px; } #centro b { font-size: 19px; }
    .puesto { font-size: 12px; line-height: 1.5; margin: 2px; padding: 0 5px 1px 3px; } .puesto b { font-size: 14px !important; }
    .puesto i { width: 8px; height: 12px; margin: 0 4px -2px 2px; }
    #cuenta { top: 32px; height: 30px; line-height: 30px; font-size: 30px; -webkit-text-stroke-width: 1px; }
    #mensaje { font-size: 15px; } #aviso { font-size: 22px; } #cartel { right: 10px; padding: 10px 12px; }
    #interfaz button { padding: 5px 9px; font-size: 13px; } #rivales span, #controles span { font-size: 13px; }
    #menu .cajas { gap: 6px; padding: 0 6px; } #menu .cajas button { height: 128px; padding: 6px; gap: 5px; border-radius: 12px; }
    #menu .cajas button[data-modo="aprender"] { height: 70px; }
    #menu .cajas button b { font-size: 14px; } #menu .cajas button span { font-size: 11px; line-height: 1.2; }
  }
  /* Teléfono en horizontal: poca altura. Todo se compacta y las cajas del menú se hacen más bajas. */
  @media (max-height: 520px) {
    #barra { height: 40px; min-height: 0; flex-wrap: nowrap; border-bottom-width: 4px; padding: 0 12px; gap: 12px; }
    #titulo { flex: none; font-size: 18px; } #tiempo { font-size: 19px; min-width: 60px; }
    #centro { order: 0; flex: 1; min-height: 0; white-space: nowrap; font-size: 15px; line-height: normal; } #centro b { font-size: 19px; }
    .puesto { font-size: 12px; margin: 0 2px; padding: 0 5px 1px 3px; } .puesto b { font-size: 14px !important; }
    .puesto i { width: 8px; height: 12px; margin: 0 4px -2px 2px; }
    #cuenta { top: 0; height: 40px; line-height: 38px; font-size: 36px; -webkit-text-stroke-width: 1px; }
    #mensaje { top: calc(var(--barra) + 6px); font-size: 14px; } #aviso { top: calc(var(--barra) + 30px); font-size: 17px; padding: 3px 0; }
    #cartel { top: calc(var(--barra) + 6px); right: 10px; width: 290px; padding: 8px 12px; border-width: 3px; }
    #cartel h2 { font-size: 19px; margin-bottom: 4px; } #cartel table { font-size: 14px; } #cartel td { padding: 1px 2px; }
    #interfaz button { padding: 5px 7px; font-size: 13px; } #rivales span, #controles span { font-size: 13px; }
    .letrero { font-size: 12px; padding: 2px 6px 2px 4px; } .letrero b { font-size: 15px; } .letrero small { display: none; }
    .letrero i { width: 8px; height: 12px; margin: 0 4px -2px 2px; }
    #menu h1.chico { font-size: 30px; margin-bottom: 8px; -webkit-text-stroke-width: 2px; text-shadow: 0 3px 0 #000; }
    #menu .cajas { gap: 6px; grid-template-columns: repeat(3, minmax(0, 250px)); } #menu .cajas button { height: 72px; padding: 5px; gap: 3px; border-radius: 12px; }
    #menu .cajas button[data-modo="aprender"] { height: 48px; }
    #menu .cajas button b { font-size: 15px; } #menu .cajas button span { font-size: 11px; line-height: 1.15; } #menu .pie { margin: 8px 0 0; font-size: 13px; }
    #portada h1 { font-size: min(13vw, 22vh); } #portada .parpadea { bottom: 7%; }
    #aprender { --lado: clamp(300px, 42vw, 600px); } #eleccion { top: 5px; gap: 4px; } #eleccion p { font-size: 12px; }
    #leyenda { bottom: 4px; gap: 2px 9px; font-size: 11px; } #leyenda em, #leyenda svg { width: 11px; height: 11px; margin-right: 3px; }
    #lado { padding: 0 9px 9px; } #fijo { padding: 6px 0 6px; } #numeroDePaso { font-size: 15px; } #botonesDePaso { gap: 4px; margin-top: 4px; }
    #explicacion { margin: 7px 0; font-size: 13px; line-height: 1.3; }
  }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="interfaz">
  <div id="etiquetas"></div>
  <div id="barra"><span id="titulo"></span><span id="centro"></span><span id="tiempo"></span></div>
  <div id="mensaje"></div>
  <div id="cuenta"></div>
  <div id="aviso"></div>
  <div id="cartel"></div>
  <div id="rivales"></div>
  <div id="controles"></div>
  <div id="ayuda"></div>
  <div id="aprender" style="display:none">
    <div id="eleccion"></div><div id="leyenda"></div>
    <div id="tablaFija" class="comparacion"></div>
    <div id="lado">
      <div id="fijo"><div id="numeroDePaso"></div><div id="botonesDePaso"></div></div>
      <div id="explicacion"></div><div id="codigo"></div>

      manchasDeFrente.mancha(meta[0], 0.15, meta[2], radio, DORADO, 0.5 * (1 - ((t * 0.9 + k / 3) % 1)), 0.8);
    }
    // Una flecha dorada que sube y baja encima.
    const alto = 2.3 + Math.sin(t * 5) * 0.2;
    dinamico.piramide(componer(mover(meta[0], alto, meta[2]), girarX(Math.PI), girarY(t * 2), escalar(0.5, 0.6, 0.5)), DORADO, 0.8);
    dinamico.caja(bloque(meta[0], alto + 0.5, meta[2], 0.2, 0.5, 0.2), DORADO, 0.8);
  }
  // Cada bandera está clavada en su casilla mientras el otro no se la lleve.
  for (const [dueño, otro] of [[jugador, rival], [rival, jugador]]) {
    if (!otro.lleva) agregarBandera(dinamico, enMundo(origen, posDeCasilla(mapa, banderaDe(juego, dueño))), dueño.color, t);
  }
  for (const [corredor, otro] of [[jugador, rival], [rival, jugador]]) {
    girarHacia(corredor, segundos);
    const lugar = enMundo(origen, posicion(corredor, mapa));
    agregarPersonaje(dinamico, lugar, corredor, t, corredor.lleva ? otro.color : null);
    if (corredor.brillo > 0) agregarPersonaje(brillantes, lugar, corredor, t);
  }
}

// Revisa lo que acaba de pasar para ver si toca un momento especial de cámara.
// Devuelve el momento nuevo, o el que ya había.
function momentoDeCamara(estado, juego) {
  for (const evento of juego.eventos) {
    const quien = juego.corredores.indexOf(evento.quien);
    if (evento.tipo === 'punto') return { tipo: 'punto', quien, t: 0, dura: 1.5 };
    if (evento.tipo === 'victoria') {
      // En las carreras, la cámara gira alrededor del jugador cuando termina; al solo mirar, del primero que llega.
      const esElMomento = juego.tipo === 'bandera' || (juego.jugador ? evento.quien === juego.jugador
                                                                       : juego.corredores.filter(c => c.final !== null).length === 1);
      if (esElMomento) return { tipo: 'victoria', quien, t: 0, dura: juego.tipo === 'bandera' ? 999 : 7 };
    }
  }
  return estado.momento;
}

// Dibuja un cuadro completo de la partida: tableros, personajes, efectos y cielo.
function dibujarPartida(estado, juego, segundos, t) {
  const gl = motor.gl;
  const tableros = tablerosDe(juego);
  dinamico.vaciar(); brillantes.vaciar(); manchasDeFondo.vaciar(); manchasDeFrente.vaciar();

  // 1. Los tableros. Solo se reconstruyen mientras su terreno está cambiando.
  const estaticos = tableros.map((tablero, numero) => {
    const [anterior, progreso] = cambioDeTablero(juego, tablero);
    return loteDeTablero(juego.tipo + numero, tablero.mapa, tablero.origen, anterior, progreso);
  });

  // 2. Lo que se mueve.
  if (juego.tipo === 'gemas') agregarGemas(juego, tableros, t, segundos);
  else if (juego.tipo === 'bandera') agregarBanderas(juego, tableros[0], t, segundos);

  // 3. Los efectos y los momentos especiales de la cámara.
  estado.momento = momentoDeCamara(estado, juego);
  if (estado.pantalla !== 'juego') estado.momento = null;     // detrás de la portada, la cámara no persigue a nadie
  lanzarEventos(estado.efectos, juego, tableros);
  agregarEfectos(dinamico, estado.efectos);
  if (estado.momento) {
    estado.momento.t += segundos;
    if (estado.momento.t > estado.momento.dura) estado.momento = null;
  }

  // 4. La cámara.
  apuntarCamara(estado.camara, juego, tableros, estado.seguir, estado.momento, t);
  if (estado.pantalla !== 'juego') pasearCamara(estado.camara, tableros, t);
  camaraDeMirar(estado, juego, tableros, segundos);
  moverCamara(estado.camara, segundos);
  const camara = matrizDeCamara(estado.camara);
  agregarCielo(manchasDeFondo, estado.camara.centro, t);

  // 5. A dibujar: primero el cielo, luego las figuras, sus bordes negros y al final lo translúcido.
  gl.clearColor(luz.cielo[0], luz.cielo[1], luz.cielo[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  dibujarManchas(manchasDeFondo, camara.total, camara.derecha, camara.arriba, false);
  const lotes = estaticos.concat([dinamico]);
  dibujarLotes(lotes, camara.total, luz);
  // El borde se hace más grueso mientras más lejos está la cámara, para que siempre se vea igual.
  const lejania = Math.hypot(...restar(estado.camara.ojo, estado.camara.centro));
  dibujarLotes(lotes, camara.total, luz, lejania * 0.0012);
  dibujarLotes([brillantes], camara.total, luz, lejania * 0.0012 + 0.07, DORADO);    // el contorno dorado de quien recogió algo
  dibujarManchas(manchasDeFrente, camara.total, camara.derecha, camara.arriba, true);
  return { tableros, camara };
}

// ============================================================================
// 9. LA INTERFAZ, AL ESTILO DE UN JUEGO DE CARRERAS
// Los textos y los botones son elementos de la página, encima del lienzo 3D.
// ============================================================================

const elemento = id => document.getElementById(id);
const textoDeTiempo = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
const colorCss = c => `rgb(${c.map(v => Math.round(v * 255)).join(',')})`;

// Cambia el contenido de un elemento solo si es distinto, para no hacer trabajar de más al navegador.
function poner(id, html) {
  const e = elemento(id);
  if (e.dataset.html !== html) { e.innerHTML = html; e.dataset.html = html; }
  e.style.display = html ? '' : 'none';
}

// Las etiquetas que flotan sobre la escena: letreros de cada tablero, nombres y globitos de pensar.
const etiquetas = new Map();
// Coloca una etiqueta en el punto de la pantalla que corresponde a un lugar del mundo.
function etiquetar(clave, lugar, html, clase, camara) {
  const [x, y, delante] = proyectar(camara.total, lugar, motor.ancho, motor.alto);
  let e = etiquetas.get(clave);
  if (!e) {
    e = document.createElement('div');
    elemento('etiquetas').appendChild(e);
    etiquetas.set(clave, e);
  }
  e.className = 'etiqueta ' + clase;
  if (e.dataset.html !== html) { e.innerHTML = html; e.dataset.html = html; }
  e.style.display = delante ? '' : 'none';
  e.style.left = x + 'px';
  e.style.top = y + 'px';
  e.dataset.vista = '1';
}
// Esconde las etiquetas que no se usaron en este cuadro.
function limpiarEtiquetas() {
  for (const e of etiquetas.values()) { if (e.dataset.vista !== '1') e.style.display = 'none'; e.dataset.vista = '0'; }
}

// Da el letrero con la ficha de color y el nombre de un competidor.
const ficha = corredor => `<i style="background:${colorCss(corredor.color)}"></i>${corredor.nombre}`;

// Actualiza la interfaz de atrapa gemas: lugar de cada competidor, avance y globitos de pensar.
function interfazDeGemas(estado, juego, escena) {
  const orden = clasificacion(juego), jugador = juego.jugador;
  poner('titulo', jugador ? 'Atrapa gemas' : 'Mirar: atrapa gemas');
  poner('centro', jugador ? `Vas en el lugar <b>${orden.indexOf(jugador) + 1}</b> de ${orden.length}` : `Va ganando <b>${orden[0].nombre}</b>`);
  escena.tableros.forEach((tablero, numero) => {
    const corredor = tablero.corredor, lugar = orden.indexOf(corredor) + 1;
    let avance = `gema ${corredor.siguiente + 1} de ${CANTIDAD_DE_GEMAS}`;
    if (corredor.final !== null) avance = 'terminó en ' + textoDeTiempo(corredor.final);
    else if (corredor.pensando > 0) avance = 'pensando...';
    etiquetar('tablero' + numero, [tablero.origen[0] + 4, 0, tablero.origen[1] - 1.5],
              `<b class="${lugar === 1 ? 'primero' : ''}">${lugar}</b>${ficha(corredor)}<small>${avance}</small>`, 'letrero', escena.camara);
    if (corredor.pensando > 0 && corredor.final === null) {
      etiquetar('globo' + numero, enMundo(tablero.origen, posicion(corredor, tablero.mapa), 1.6), '...', 'globo', escena.camara);
    }
  });
  if (juego.anuncio) cartelDeCarrera(juego, orden);
}

// Muestra el cartel con el resultado de una carrera: el lugar del jugador y los tiempos de quienes ya llegaron.
function cartelDeCarrera(juego, orden) {
  const jugador = juego.jugador;
  const titulo = !jugador ? `Ganó ${orden[0].nombre}` : (orden[0] === jugador ? '¡Ganaste!' : `Quedaste en el lugar ${orden.indexOf(jugador) + 1}`);
  const renglones = orden.map((c, k) => `<tr class="${c === jugador ? 'yo' : ''}"><td>${k + 1}.</td><td>${ficha(c)}</td>` +
    `<td>${c.final !== null ? textoDeTiempo(c.final) : 'sigue corriendo'}</td></tr>`).join('');
  poner('cartel', `<h2>${titulo}</h2><table>${renglones}</table><p>Espacio o Enter: otra carrera. R: reiniciar. Esc: menú.</p>`);
}

// Actualiza la interfaz de captura la bandera: marcador, avisos, nombres y botones de rival.
function interfazDeBandera(estado, juego, escena) {
  const { jugador, rival } = juego, humano = juego.humano, enJuego = juego.fase === 'carrera';
  const izquierdo = humano ? 'Tú' : jugador.nombre;
  poner('titulo', humano ? 'Captura la bandera' : 'Mirar: captura la bandera');
  poner('centro', `<span style="color:#ff7a7a">${izquierdo} <b>${jugador.puntos}</b></span> : <b>${rival.puntos}</b> ${ficha(rival)}`);
  let mensaje = `Roba la bandera de ${rival.nombre} y llévala a donde está la tuya.`;
  if (!humano) mensaje = `${jugador.nombre} (rojo) contra ${rival.nombre}. Gana quien llegue a ${PUNTOS_PARA_GANAR}.`;
  else if (jugador.lleva && enJuego) mensaje = '<b class="dorado">¡Llevas la bandera! Llévala a donde está la tuya: sigue la ruta dorada.</b>';
  else if (rival.lleva && enJuego) mensaje = `<b class="rosa">${rival.nombre} te robó la bandera. Chócalo para recuperarla.</b>`;
  poner('mensaje', juego.fase === 'final' ? '' : mensaje);
  const tablero = escena.tableros[0];
  for (const corredor of [jugador, rival]) {
    const lugar = enMundo(tablero.origen, posicion(corredor, tablero.mapa), 1.5);
    etiquetar('nombre' + (corredor === jugador ? 0 : 1), lugar, corredor.pensando > 0 ? '...' : (corredor === jugador && humano ? 'Tú' : corredor.nombre),
              corredor.pensando > 0 ? 'globo' : 'nombre', escena.camara);
  }
  // Los botones para elegir rival: del 1 al 6. El elegido va en rojo.
  // Al solo mirar se elige también el algoritmo del lado izquierdo.
  poner('rivales', (humano ? '<span>Rival:</span>' : botonesDeIzquierda(juego)) + OPCIONES_DE_RIVAL.map((opcion, k) =>
    `<button data-rival="${opcion}" class="${opcion === juego.eleccion ? 'activo' : ''}">` +
    `${opcion in COLOR_DE ? `<i style="background:${colorCss(COLOR_DE[opcion])}"></i>` : ''}${k + 1} ${opcion}</button>`).join(''));
  poner('aviso', juego.avisoResta > 0 && juego.fase !== 'final' ? juego.aviso : '');
  if (juego.fase === 'final') {
    const ganoIzquierda = jugador.puntos > rival.puntos;
    const titulo = humano && ganoIzquierda ? '¡Ganaste!' : `Ganó ${nombreParaAviso(juego, ganoIzquierda ? jugador : rival)}`;
    poner('cartel', `<h2>${titulo}</h2><table><tr class="yo"><td></td><td>${izquierdo}</td><td>${jugador.puntos}</td></tr>` +
      `<tr><td></td><td>${ficha(rival)}</td><td>${rival.puntos}</td></tr><tr><td></td><td>Tiempo</td><td>${textoDeTiempo(juego.reloj)}</td></tr></table>` +
      '<p>Espacio o Enter: otra partida. R: reiniciar. Esc: menú.</p>');
  }
}

// Actualiza toda la interfaz de la partida en curso.
function actualizarInterfaz(estado, juego, escena) {
  poner('tiempo', textoDeTiempo(juego.reloj));
  poner('cartel', '');
  if (juego.tipo !== 'bandera') { poner('rivales', ''); poner('mensaje', ''); poner('aviso', ''); }
  if (juego.tipo === 'gemas') interfazDeGemas(estado, juego, escena);
  else if (juego.tipo === 'bandera') interfazDeBandera(estado, juego, escena);
  // La cuenta regresiva de salida: 3, 2, 1 y la palabra de arranque.
  let cuenta = '';
  if (juego.fase === 'cuenta') cuenta = String(Math.ceil(juego.cuenta));
  else if (juego.fase === 'carrera' && juego.reloj < 0.8) cuenta = '¡Ya!';
  poner('cuenta', cuenta);
  poner('ayuda', estado.modo.startsWith('mirar') ? AYUDA_DE_MIRAR : AYUDA_DE_JUGAR);
  limpiarEtiquetas();
}

const AYUDA_DE_JUGAR = 'Flechas o W A S D: moverte. C: acercar. R: reiniciar. Esc: menú.';
const AYUDA_DE_MIRAR = 'Rueda: acercar. Arrastrar: girar. W A S D: mover. Tab: seguir a otro. 0: vista general. R: reiniciar. Esc: menú.';

// ============================================================================
// 10. MODOS DE SOLO MIRAR
// Compiten solo los algoritmos y la cámara se mueve con libertad: la rueda
// acerca y aleja, arrastrar gira, W A S D desplaza, Tab pasa a seguir a otro
// personaje y 0 vuelve a la vista general.
// ============================================================================

// Cómo está movida la cámara respecto a la vista normal.
//   zoom:    1 es la distancia normal; más grande es más cerca
//   giro:    cuánto se giró alrededor del tablero, en radianes
//   altura:  cuánto se levantó o se bajó la mirada, en radianes
//   dx, dz:  cuánto se desplazó el punto al que mira, en casillas
function vistaNormal() { return { zoom: 1, giro: 0, altura: 0, dx: 0, dz: 0 }; }

// Se llama al empezar cualquier partida: regresa la cámara libre a su lugar.
function alEmpezar(estado) {
  estado.vista = vistaNormal();
  estado.arrastre = null;
}

// Aplica a la cámara lo que el espectador movió: desplazar, girar, levantar y acercar.
// La cámara ya trae su meta normal (vista general o siguiendo a alguien); aquí se le ajusta.
function camaraDeMirar(estado, juego, tableros, segundos) {
  if (!estado.modo || !estado.modo.startsWith('mirar') || estado.pantalla !== 'juego' || estado.momento) return;
  const vista = estado.vista, camara = estado.camara;
  // W A S D desplaza la vista. Se mueve respecto a como está girada la cámara.
  const rapidez = 9 * segundos / vista.zoom;
  for (const [df, dc] of estado.direcciones) {
    vista.dx += (dc * Math.cos(vista.giro) + df * Math.sin(vista.giro)) * rapidez;
    vista.dz += (df * Math.cos(vista.giro) - dc * Math.sin(vista.giro)) * rapidez;
  }
  const centro = [camara.centroMeta[0] + vista.dx, camara.centroMeta[1], camara.centroMeta[2] + vista.dz];
  // El brazo que va del punto mirado a la cámara: se acorta con el zoom y se gira.
  let brazo = restar(camara.ojoMeta, camara.centroMeta).map(v => v / vista.zoom);
  const largo = Math.hypot(...brazo), plano = Math.hypot(brazo[0], brazo[2]);
  // La altura de la mirada: entre casi a ras de piso y casi desde arriba.
  const elevacion = Math.min(1.5, Math.max(0.12, Math.atan2(brazo[1], plano) + vista.altura));
  const rumbo = Math.atan2(brazo[0], brazo[2]) + vista.giro;
  brazo = [Math.sin(rumbo) * Math.cos(elevacion) * largo, Math.sin(elevacion) * largo, Math.cos(rumbo) * Math.cos(elevacion) * largo];
  camara.centroMeta = centro;
  camara.ojoMeta = [centro[0] + brazo[0], centro[1] + brazo[1], centro[2] + brazo[2]];
}

// Atiende las teclas propias de mirar: Tab, 0 y, en captura la bandera, Mayús + 1 a 5.
function teclaDeModo(estado, evento, tecla) {
  if (!estado.modo.startsWith('mirar')) return;
  const juego = estado.juego;
  if (tecla === 'Tab') {
    // Tab pasa a seguir al siguiente personaje.
    estado.seguir = estado.seguir === null ? 0 : (estado.seguir + 1) % juego.corredores.length;
    Object.assign(estado.vista, { dx: 0, dz: 0 });
  } else if (tecla === '0') {
    estado.seguir = null;                             // 0: la vista general
    estado.vista = vistaNormal();
  } else if (juego.tipo === 'bandera' && evento.shiftKey && /^Digit[1-5]$/.test(evento.code)) {
    // Mayús + 1 a 5: el algoritmo del lado izquierdo, que conserva el color rojo.
    estado.izquierda = NOMBRES[Number(evento.code.slice(5)) - 1];
    empezar(estado.modo);
  }
}

// Atiende los botones propios de mirar: elegir el algoritmo del lado izquierdo.
function clicDeModo(estado, boton) {
  if (boton.dataset.izquierda) { estado.izquierda = boton.dataset.izquierda; empezar(estado.modo); }
}

// Da los botones para elegir el algoritmo del lado izquierdo en captura la bandera.
function botonesDeIzquierda(juego) {
  return '<span>Izquierda (Mayús + 1 a 5):</span>' + NOMBRES.map(nombre =>
    `<button data-izquierda="${nombre}" class="${nombre === juego.jugador.nombre ? 'activo' : ''}">` +
    `<i style="background:${colorCss(COLOR_DE['Tú'])}"></i>${nombre}</button>`).join('') + '<span style="margin-left:18px">Derecha (1 a 6):</span>';
}

// El ratón sobre la escena: la rueda acerca y aleja; arrastrar gira y cambia la altura de la mirada.
if (typeof document !== 'undefined') {
  const lienzo = document.getElementById('lienzo');
  const mirando = () => estado.pantalla === 'juego' && estado.modo && estado.modo.startsWith('mirar');
  lienzo.addEventListener('wheel', evento => {
    if (!mirando()) return;
    evento.preventDefault();
    estado.vista.zoom = Math.min(6, Math.max(0.5, estado.vista.zoom * Math.pow(1.0012, -evento.deltaY)));
  }, { passive: false });
  lienzo.addEventListener('pointerdown', evento => {
    if (!mirando()) return;
    estado.arrastre = [evento.clientX, evento.clientY];
    lienzo.setPointerCapture(evento.pointerId);
  });
  lienzo.addEventListener('pointermove', evento => {
    if (!mirando() || !estado.arrastre) return;
    estado.vista.giro -= (evento.clientX - estado.arrastre[0]) * 0.006;
    estado.vista.altura = Math.min(1.2, Math.max(-1.2, estado.vista.altura + (evento.clientY - estado.arrastre[1]) * 0.004));
    estado.arrastre = [evento.clientX, evento.clientY];
  });
  for (const tipo of ['pointerup', 'pointercancel']) lienzo.addEventListener(tipo, () => { estado.arrastre = null; });
}

// ============================================================================
// 11. PORTADA Y MENÚ
// La portada muestra el título sobre una partida que se juega sola. Al oprimir
// una tecla, el fondo se desenfoca, el título se barre hacia un lado y aparecen
// los modos en cajas. Al elegir uno, su caja estalla en partículas y hay un
// salto tipo hiperespacio antes de llegar al tablero.
// ============================================================================

const DURACION_DEL_SALTO = 1.1;         // segundos que dura el salto tipo hiperespacio

// Limpia la interfaz de la partida y deja listo el fondo: una partida entre dos algoritmos.
function prepararFondo(estado) {
  estado.juego = null;
  estado.seguir = null;
  for (const id of ['titulo', 'centro', 'tiempo', 'mensaje', 'ayuda', 'cuenta', 'aviso', 'cartel', 'rivales', 'controles']) poner(id, '');
  limpiarEtiquetas(); limpiarEtiquetas();
  elemento('barra').style.display = 'none';
  if (!estado.demo) estado.demo = crearDemo();
}

// Crea la partida que se juega sola: captura la bandera entre dos algoritmos distintos, sorteados.
function crearDemo() {
  const [izquierda, derecha] = muestra(NOMBRES, 2);
  const demo = crearBandera(derecha, izquierda);
  demo.cuenta = 0.5;                                  // casi sin cuenta regresiva: aquí solo se mira
  return demo;
}

// Muestra la portada: el título arriba y la partida de fondo, sin desenfocar.
function mostrarPortada(estado) {
  prepararFondo(estado);
  estado.pantalla = 'portada';
  elemento('lienzo').style.filter = '';
  elemento('menu').style.display = 'none';
  elemento('portada').style.display = '';
  elemento('portada').classList.remove('fuera');
  poner('portada', '<h1>Maze Runner</h1><p class="subtitulo">Proyecto de matemáticas discretas</p><p class="parpadea">Presiona cualquier tecla</p>');
}

// Muestra el menú: desenfoca el fondo, barre el título hacia un lado y hace aparecer las cajas.
function mostrarMenu(estado) {
  prepararFondo(estado);
  estado.pantalla = 'menu';
  elemento('lienzo').style.filter = 'blur(7px) brightness(0.8)';
  elemento('portada').classList.add('fuera');                       // el título se va por la izquierda
  elemento('menu').style.display = '';
  pintarMenu(estado, true);
}

// Escribe las cajas del menú. Con 'entrando', aparecen una tras otra.
function pintarMenu(estado, entrando = false) {
  poner('menu', '<h1 class="chico">Maze Runner</h1><div class="cajas">' +
    MODOS.map((modo, k) => `<button data-modo="${modo[0]}" class="${k === estado.elegida ? 'activo' : ''} ${entrando ? 'entra' : ''}" ` +
      `style="animation-delay:${k * 60}ms"><b>${modo[1]}</b><span>${modo[2]}</span></button>`).join('') +
    '</div><p class="pie">Elige con las flechas y Enter, o con el ratón. Esc: portada.</p>');
}

// Atiende una tecla en la portada o en el menú.
function teclaDeMenu(estado, tecla) {
  if (estado.pantalla === 'salto') return;                           // durante el salto no se atiende nada
  if (estado.pantalla === 'portada') { mostrarMenu(estado); return; }   // cualquier tecla abre el menú
  if (tecla === 'Escape') { mostrarPortada(estado); return; }
  const columnas = Math.max(1, Math.round(elemento('menu').querySelector('.cajas').clientWidth / 314));
  if (tecla === 'ArrowRight') estado.elegida = (estado.elegida + 1) % MODOS.length;
  else if (tecla === 'ArrowLeft') estado.elegida = (estado.elegida + MODOS.length - 1) % MODOS.length;
  else if (tecla === 'ArrowDown') estado.elegida = Math.min(MODOS.length - 1, estado.elegida + columnas);
  else if (tecla === 'ArrowUp') estado.elegida = Math.max(0, estado.elegida - columnas);
  else if (tecla === 'Enter' || tecla === ' ') { clicDeMenu(estado, MODOS[estado.elegida][0]); return; }
  else return;
  pintarMenu(estado);
}

// Elige un modo: su caja estalla en partículas y empieza el salto tipo hiperespacio.
function clicDeMenu(estado, modo) {
  if (estado.pantalla !== 'menu') return;
  estado.elegida = MODOS.findIndex(m => m[0] === modo);
  const caja = elemento('menu').querySelector(`button[data-modo="${modo}"]`);
  if (caja) estallarCaja(caja);
  estado.pantalla = 'salto';
  estado.salto = { modo, t: 0 };
  elemento('menu').classList.add('yendose');                        // las demás cajas se desvanecen
}

// Hace estallar una caja del menú: se esconde y en su lugar salen volando cuadritos de colores.
function estallarCaja(caja) {
  const zona = caja.getBoundingClientRect();
  caja.style.visibility = 'hidden';
  for (let k = 0; k < 46; k++) {
    const pedazo = document.createElement('div');
    pedazo.className = 'pedazo';
    const tam = 8 + Math.random() * 14;
    pedazo.style.cssText = `left:${zona.left + Math.random() * zona.width}px;top:${zona.top + Math.random() * zona.height}px;` +
      `width:${tam}px;height:${tam}px;background:${elegir(['#c62828', '#ffffff', '#111114', '#ffc107'])}`;
    elemento('interfaz').appendChild(pedazo);
    // Cada pedazo sale en una dirección al azar, gira y se desvanece.
    const angulo = Math.random() * Math.PI * 2, lejos = 160 + Math.random() * 380;
    pedazo.animate([{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.cos(angulo) * lejos}px,${Math.sin(angulo) * lejos + 120}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }],
                   { duration: 700 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => pedazo.remove();
  }
}

// Las estrellas del salto: cada una tiene su lugar alrededor del centro y qué tan lejos empieza.
const ESTRELLAS_DEL_SALTO = Array.from({ length: 260 }, () => {
  const angulo = Math.random() * Math.PI * 2, radio = 1.5 + Math.random() * 11;
  return { x: Math.cos(angulo) * radio, y: Math.sin(angulo) * radio, z: -Math.random() * 120, color: elegir([BLANCO, BLANCO, ROJO, [0.8, 0.86, 1]]) };
});

// Dibuja el salto tipo hiperespacio: rayas de luz que pasan volando hacia la cámara, cada vez más rápido.
function dibujarSalto(estado, segundos) {
  const gl = motor.gl, salto = estado.salto;
  salto.t += segundos;
  const avance = Math.min(1, salto.t / DURACION_DEL_SALTO);
  const rapidez = 30 + avance * avance * 420;         // acelera conforme avanza
  dinamico.vaciar();
  for (const estrella of ESTRELLAS_DEL_SALTO) {
    estrella.z += rapidez * segundos;
    if (estrella.z > 2) estrella.z -= 120;            // la que pasa de largo vuelve a empezar al fondo
    const largo = 0.4 + avance * avance * 22;         // las rayas se alargan con la velocidad
    dinamico.caja(bloque(estrella.x, estrella.y, estrella.z - largo / 2, 0.07, 0.07, largo), estrella.color, 1);
  }
  const camara = multiplicar(perspectiva(0.9 + avance * 0.7, motor.ancho / motor.alto, 0.1, 300), mirarHacia([0, 0, 0], [0, 0, -1]));
  // El fondo se oscurece y, justo al final, da un destello blanco.
  const destello = Math.max(0, (avance - 0.86) / 0.14);
  const fondo = mezcla(mezcla(luz.cielo, [0.01, 0.01, 0.03], Math.min(1, avance * 3)), [1, 1, 1], destello);
  gl.clearColor(fondo[0], fondo[1], fondo[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  dibujarLotes([dinamico], camara, Object.assign({}, luz, { cielo: fondo, lejos: 900 }));
  if (salto.t >= DURACION_DEL_SALTO) {
    elemento('menu').classList.remove('yendose');
    empezar(salto.modo);                              // se llega al tablero
  }
}

// Dibuja lo que hay detrás de la portada y del menú: la partida que se juega sola, o el salto.
function dibujarMenu(estado, segundos, t) {
  if (estado.pantalla === 'salto') {
    elemento('lienzo').style.filter = '';
    elemento('portada').style.display = 'none';
    dibujarSalto(estado, segundos);
    return;
  }
  const demo = estado.demo;
  actualizarBandera(demo, segundos, []);
  demo.vida = (demo.vida || 0) + segundos;
  // Cuando la partida de fondo termina, o se alarga demasiado, empieza otra.
  if ((demo.fase === 'final' && demo.vida > demo.reloj + 8) || demo.vida > 150) estado.demo = crearDemo();
  return dibujarPartida(estado, demo, segundos, t);
}

// Hace que la cámara pasee despacio alrededor del tablero. Se usa detrás de la portada y del menú.
function pasearCamara(camara, tableros, t) {
  const centro = centroDe(tableros[0]);
  camara.ojoMeta = [centro[0] + Math.cos(t * 0.13) * 15, 9.5, centro[2] + Math.sin(t * 0.13) * 15];
  camara.centroMeta = [centro[0], 0.5, centro[2]];
}

// ============================================================================
// 12. EL PROGRAMA
// ============================================================================

// Los modos del juego: clave, nombre y una línea que lo describe.
const MODOS = [
  ['gemas', 'Atrapa gemas', 'Carrera contra los cinco algoritmos, cada quien en su tablero.'],
  ['bandera', 'Captura la bandera', 'Uno contra uno: roba la bandera rival. A tres puntos.'],
  ['mirar_gemas', 'Mirar: atrapa gemas', 'Compiten solo los algoritmos.'],
  ['mirar_bandera', 'Mirar: captura la bandera', 'Elige el algoritmo de cada lado.'],
];

// Todo lo que cambia mientras corre el programa.
//   pantalla:    'portada', 'menu', 'salto' (el salto tipo hiperespacio) o 'juego'
//   modo, juego: el modo que se está jugando y su partida
//   rival:       el rival elegido en captura la bandera; se conserva entre partidas y empieza en A*
//   izquierda:   el algoritmo del lado izquierdo al solo mirar; empieza en BFS
//   direcciones: los movimientos oprimidos, del más viejo al más reciente
//   seguir:      el número del corredor al que sigue la cámara, o null para la vista general
//   momento:     el momento especial de cámara en curso (alguien anotó o ganó), o null
const estado = { pantalla: 'menu', elegida: 0, modo: null, juego: null, rival: 'A*', izquierda: 'BFS', direcciones: [],
                 seguir: null, momento: null, efectos: crearEfectos(), camara: crearCamara([0, 18, 30], [0, 0, 0]), t: 0 };

// Empieza una partida nueva del modo indicado.
function empezar(modo) {
  estado.modo = modo;
  estado.direcciones = [];
  estado.seguir = null;
  estado.momento = null;
  estado.efectos = crearEfectos();
  if (modo === 'gemas') estado.juego = crearGemas();
  else if (modo === 'mirar_gemas') estado.juego = crearGemas(false);
  else if (modo === 'bandera') estado.juego = crearBandera(estado.rival);
  else if (modo === 'mirar_bandera') estado.juego = crearBandera(estado.rival, estado.izquierda);
  estado.pantalla = 'juego';
  elemento('menu').style.display = 'none';
  elemento('portada').style.display = 'none';
  elemento('lienzo').style.filter = '';
  elemento('barra').style.display = '';
  alEmpezar(estado);
}

// Dice si la partida ya terminó: se anunció el resultado o alguien llegó a 3 puntos.
const terminada = juego => juego.tipo === 'bandera' ? juego.fase === 'final' : juego.anuncio;

// Las teclas de movimiento y su movimiento (cambio de fila, cambio de columna).
const TECLAS_DE_MOVIMIENTO = { ArrowUp: [-1, 0], w: [-1, 0], ArrowRight: [0, 1], d: [0, 1], ArrowDown: [1, 0], s: [1, 0], ArrowLeft: [0, -1], a: [0, -1] };

// Atiende una tecla que se oprime.
function alOprimir(evento) {
  const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key;
  if (tecla in TECLAS_DE_MOVIMIENTO || tecla === ' ' || tecla === 'Tab') evento.preventDefault();   // que la página no se mueva
  if (tecla in TECLAS_DE_MOVIMIENTO && !evento.repeat) {
    // Las direcciones se anotan al oprimirse; la más reciente queda al final.
    const direccion = TECLAS_DE_MOVIMIENTO[tecla];
    estado.direcciones = estado.direcciones.filter(x => x !== direccion);
    estado.direcciones.push(direccion);
  }
  if (estado.pantalla !== 'juego') { if (!evento.repeat) teclaDeMenu(estado, evento.key); return; }
  if (evento.repeat) return;
  const juego = estado.juego, mirando = estado.modo.startsWith('mirar');
  if (tecla === 'Escape') mostrarMenu(estado);                                   // Esc: al menú
  else if (tecla === 'r') empezar(estado.modo);                                  // R: reinicia
  else if ((tecla === ' ' || tecla === 'Enter') && terminada(juego)) empezar(estado.modo);   // otra partida, cuando ya terminó
  else if (tecla === 'c' && !mirando) estado.seguir = estado.seguir === null ? juego.corredores.indexOf(juego.jugador) : null;   // C: acercar
  else if (juego.tipo === 'bandera' && tecla >= '1' && tecla <= '6' && !evento.shiftKey) {
    estado.rival = OPCIONES_DE_RIVAL[Number(tecla) - 1];                         // se conserva para las partidas siguientes
    empezar(estado.modo);
  }
  else teclaDeModo(estado, evento, tecla);
}

// Atiende una tecla que se suelta.
function alSoltar(evento) {
  const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key;
  if (tecla in TECLAS_DE_MOVIMIENTO) estado.direcciones = estado.direcciones.filter(x => x !== TECLAS_DE_MOVIMIENTO[tecla]);
}

// Atiende un clic sobre un botón de la interfaz.
function alHacerClic(evento) {
  if (estado.pantalla === 'portada') { mostrarMenu(estado); return; }             // un clic en la portada abre el menú
  const boton = evento.target.closest('button');
  if (!boton) return;
  if (boton.dataset.modo) clicDeMenu(estado, boton.dataset.modo);
  else if (boton.dataset.rival) { estado.rival = boton.dataset.rival; empezar(estado.modo); }
  else clicDeModo(estado, boton);
  boton.blur();                                                                  // para que Espacio no vuelva a oprimirlo
}

// Avanza la partida un cuadro.
function actualizar(segundos) {
  actualizarEfectos(estado.efectos, segundos);
  if (estado.pantalla !== 'juego') return;
  const juego = estado.juego;
  // Al solo mirar, las teclas de movimiento mueven la cámara y no a un personaje.
  const direcciones = estado.modo.startsWith('mirar') ? [] : estado.direcciones;
  if (juego.tipo === 'gemas') actualizarGemas(juego, segundos, direcciones);
  else if (juego.tipo === 'bandera') actualizarBandera(juego, segundos, direcciones);
}

// Un cuadro completo: avanzar, dibujar y pedir el siguiente.
let momentoAnterior = 0;
function cuadro(ahora) {
  // Se limita a una décima de segundo para que, si la página se traba, los personajes no den un salto.
  const segundos = Math.min((ahora - momentoAnterior) / 1000, 0.1);
  momentoAnterior = ahora;
  estado.t += segundos;
  ajustarLienzo(elemento('lienzo'));
  actualizar(segundos);
  if (estado.pantalla === 'juego') {
    const escena = dibujarPartida(estado, estado.juego, segundos, estado.t);
    actualizarInterfaz(estado, estado.juego, escena);
  } else {
    dibujarMenu(estado, segundos, estado.t);
  }
  requestAnimationFrame(cuadro);
}

// Arranca el programa cuando la página termina de cargar.
function iniciar() {
  if (!iniciarMotor(elemento('lienzo'))) {
    poner('menu', '<h1>Maze Runner</h1><p>Este navegador no puede dibujar en 3D (WebGL).</p>');
    return;
  }
  window.addEventListener('keydown', alOprimir);
  window.addEventListener('keyup', alSoltar);
  document.addEventListener('click', alHacerClic);
  window.addEventListener('blur', () => { estado.direcciones = []; });          // al cambiar de ventana se sueltan las teclas
  mostrarPortada(estado);
  requestAnimationFrame(ahora => { momentoAnterior = ahora; requestAnimationFrame(cuadro); });
}
if (typeof document !== 'undefined') iniciar();

</script>

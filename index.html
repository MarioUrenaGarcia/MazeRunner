      `<div class="rotulos" style="height:${Math.max(2, visibles.length) * 24}px"><span class="dorado">TOPE (inicio): por aquí entra y por aquí sale</span>` +
      '<span>FONDO (fin): lo más viejo</span></div></div>';
  } else {
    // El tubo: dos líneas, abierto por los dos lados. La primera caja de la izquierda es la que sale.
    dibujo = `<div class="cola${tipo === 'prioridad' ? ' prioridad' : ''}"><span class="dorado">INICIO<br>sale</span>` +
      `<div class="tubo">${contenido.slice(0, caben).map((par, k) => caja(par, k === 0)).join('')}</div><span>FIN<br>entra</span></div>`;
    if (contenido.length > caben) pie += ` Hay ${contenido.length - caben} más que no caben en el dibujo.`;
    if (tipo === 'prioridad') {
      const que = { 'Dijkstra': 'el costo acumulado', 'Voraz': 'la estimación hasta la meta', 'A*': 'el costo acumulado más la estimación' }[aprender.algoritmo];
      pie += `<br>El número de cada caja es ${que}. Al entrar, se acomoda según ese valor.`;
    }
  }
  return `<h3>${titulo}. Tiene ${contenido.length} casillas.</h3>${dibujo}<p>${pie}</p>`;
}

// Une nombres en una frase: "A", "A y B" o "A, B y C".
const enLista = nombres => nombres.length < 2 ? nombres.join('') : nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1];

// Da la tabla que compara a los cinco algoritmos en el mapa elegido.
//   aprender: el estado del modo
// Devuelve el HTML: una fila por algoritmo con sus casillas exploradas, pasos, costo y puntaje;
// el mejor en verde, la fila del algoritmo elegido resaltada y, al pie, por qué gana el mejor.
function htmlDeTabla(aprender) {
  const tabla = aprender.tabla, conRuta = NOMBRES.filter(nombre => tabla[nombre][3] !== null);
  const mejor = conRuta.length ? Math.min(...conRuta.map(nombre => tabla[nombre][3])) : null;
  const filas = NOMBRES.map(nombre => {
    const [exploradas, pasos, costo, puntaje] = tabla[nombre], gana = puntaje !== null && puntaje === mejor;
    const datos = puntaje === null ? '<td colspan="3" class="gris">sin ruta</td>'
                                   : `<td>${pasos}</td><td>${costo}</td><td>${puntaje}</td>`;
    return `<tr class="${nombre === aprender.algoritmo ? 'elegido' : ''}${gana ? ' gana' : ''}">` +
      `<td><i style="background:${colorCss(COLOR_DE[nombre])}"></i>${nombre}</td><td>${exploradas}</td>${datos}</tr>`;
  }).join('');
  let pie = 'Ningún algoritmo puede llegar: no hay mejor.';
  if (mejor !== null) {
    // Por qué gana: su ruta es de las más baratas y, entre quienes logran ese costo, es quien menos exploró.
    const ganan = conRuta.filter(nombre => tabla[nombre][3] === mejor), [exploradas, , costo] = tabla[ganan[0]];
    const igualDeBaratos = conRuta.filter(nombre => tabla[nombre][2] === costo && !ganan.includes(nombre));
    pie = `<b class="verde">En verde, el mejor: ${enLista(ganan)}.</b> Su ruta cuesta ${costo}, lo mínimo` +
      (igualDeBaratos.length ? ` (igual que la de ${enLista(igualDeBaratos)}), pero con menos casillas exploradas: ${exploradas}.`
                             : `, y nadie más lo consigue. Exploró ${exploradas} casillas.`) +
      ' Puntaje = costo x 10 000 + exploradas; gana el más bajo.';
  }
  return `<table><tr><th>En "${MAPAS_DE_APRENDER[aprender.numeroDeMapa][0]}"</th><th>Exploradas</th><th>Pasos</th>` +
    `<th>Costo</th><th>Puntaje</th></tr>${filas}</table><p>${pie}</p>`;
}

// Actualiza toda la interfaz del modo Aprender.
//   estado:   el estado del programa
//   aprender: el estado del modo
//   escena:   los tableros y la cámara con que se dibujó este cuadro
// Cada parte del panel se escribe por separado y solo cuando cambia: así el panel no pierde
// el lugar hasta donde se bajó a leer.
function interfazDeAprender(estado, aprender, escena) {
  const paso = aprender.pasos[aprender.paso], nombreDelMapa = MAPAS_DE_APRENDER[aprender.numeroDeMapa][0];
  elemento('aprender').style.display = '';
  poner('titulo', 'Aprender');
  poner('centro', `${ficha(aprender.personaje)} en <b>${nombreDelMapa}</b>`);
  // Aquí no hay cronómetro, ni avisos, ni botones de los juegos.
  for (const id of ['tiempo', 'mensaje', 'cuenta', 'aviso', 'cartel', 'rivales', 'controles', 'ayuda']) poner(id, '');
  elemento('centro').style.visibility = '';
  // Los botones para elegir algoritmo (1 a 5) y mapa. El elegido va en rojo.
  poner('eleccion', NOMBRES.map((nombre, k) =>
      `<button data-aprender="algoritmo" data-valor="${nombre}" class="${nombre === aprender.algoritmo ? 'activo' : ''}">` +
      `<i style="background:${colorCss(COLOR_DE[nombre])}"></i>${k + 1} ${nombre}</button>`).join('') + '<span class="corte"></span>' +
    MAPAS_DE_APRENDER.map((mapa, k) =>
      `<button data-aprender="mapa" data-valor="${k}" class="${k === aprender.numeroDeMapa ? 'activo' : ''}">${mapa[0]}</button>`).join('') +
    `<p>${QUE_ENSEÑA[nombreDelMapa]}</p>`);
  poner('leyenda', htmlDeLeyenda());
  // El número de paso y los botones para avanzar, que se quedan fijos arriba del panel.
  poner('numeroDePaso', `Paso ${aprender.paso + 1} de ${aprender.pasos.length}`);
  // Con los dedos no hay tecla Esc: se agrega un botón para volver al menú.
  const botones = BOTONES_DE_APRENDER.concat(document.body.classList.contains('tactil') ? [['menu', 'Menú']] : []);
  poner('botonesDePaso', botones.map(([accion, texto]) => {
    if (accion === 'velocidad') { const nombre = VELOCIDADES_DE_APRENDER[aprender.velocidad][0]; texto = nombre[0].toUpperCase() + nombre.slice(1) + ' (V)'; }
    else if (accion === 'auto' && aprender.auto) texto = 'Pausa';
    return `<button data-aprender="${accion}" class="${accion === 'auto' && aprender.auto ? 'activo' : ''}">${texto}</button>`;
  }).join(''));
  poner('explicacion', paso.texto);
  // El código, con el renglón que se está ejecutando resaltado.
  poner('codigo', CODIGO[aprender.algoritmo].map((renglon, k) =>
    `<div class="${k === paso.renglon ? 'actual' : ''}">${String(k + 1).padStart(2)}  ${escaparHtml(renglon)}</div>`).join(''));
  // En la cola caben más o menos cajas según el ancho del panel.
  const caben = Math.max(3, Math.min(8, Math.floor((elemento('lado').clientWidth - 150) / 46)));
  poner('estructura', htmlDeEstructura(aprender, paso, caben));
  // La tabla va en dos lugares y la hoja de estilos muestra uno solo, según el tamaño de la pantalla.
  poner('tabla', htmlDeTabla(aprender));
  poner('tablaFija', htmlDeTabla(aprender));
  poner('teclas', AYUDA_DE_APRENDER);
  // Los letreros del inicio y de la meta, sobre el tablero.
  const [inicio, meta] = letrerosDeAprender(aprender, escena.tableros[0]);
  etiquetar('letreroDeInicio', inicio, 'Inicio', 'rotulo', escena.camara);
  etiquetar('letreroDeMeta', meta, 'Meta', 'rotulo', escena.camara);
  limpiarEtiquetas();
}

// Atiende un botón del modo Aprender.
//   accion: lo que hace el botón; valor: el algoritmo o el número del mapa, si lo lleva
function accionDeAprender(estado, accion, valor) {
  if (accion === 'menu') { mostrarMenu(estado); return; }
  estado.juego = hacerEnAprender(estado.juego, accion, accion === 'mapa' ? Number(valor) : valor);
}

// Atiende una tecla en el modo Aprender.
//   tecla:    la tecla oprimida
//   repetida: true si la tecla sigue oprimida y el teclado la está repitiendo
// Solo las flechas se repiten: así se puede recorrer la búsqueda dejando oprimida una.
function teclaDeAprender(estado, tecla, repetida) {
  const deFlecha = { ArrowLeft: 'anterior', ArrowRight: 'siguiente' }[tecla];
  if (deFlecha) { accionDeAprender(estado, deFlecha); return; }
  if (repetida) return;
  const aprender = estado.juego;
  if (tecla === 'Escape') mostrarMenu(estado);
  else if (tecla >= '1' && tecla <= '5') accionDeAprender(estado, 'algoritmo', NOMBRES[Number(tecla) - 1]);
  else if (tecla === 'm') accionDeAprender(estado, 'mapa', (aprender.numeroDeMapa + 1) % MAPAS_DE_APRENDER.length);
  else {
    const accion = { r: 'reiniciar', ' ': 'auto', v: 'velocidad' }[tecla];
    if (accion) accionDeAprender(estado, accion);
  }
}

// ============================================================================
// 16. PORTADA Y MENÚ
// La portada muestra el título sobre una partida que se juega sola. Al oprimir
// una tecla, el fondo se desenfoca, el título se barre hacia un lado y aparecen
// los modos en cajas. Al elegir uno, su caja estalla en partículas y hay un
// salto tipo hiperespacio antes de llegar al tablero.
// ============================================================================

const DURACION_DEL_SALTO = 1.1;         // segundos que dura el salto tipo hiperespacio

// Limpia la interfaz de la partida y deja listo el fondo: una partida entre dos algoritmos.
function prepararFondo(estado) {
  estado.juego = null;
  estado.seguir = null;
  for (const id of ['titulo', 'centro', 'tiempo', 'mensaje', 'ayuda', 'cuenta', 'aviso', 'cartel', 'rivales', 'controles']) poner(id, '');
  limpiarEtiquetas(); limpiarEtiquetas();
  elemento('aprender').style.display = 'none';
  elemento('barra').style.display = 'none';
  if (!estado.demo) estado.demo = crearDemo();
}

// Crea la partida que se juega sola: captura la bandera entre dos algoritmos distintos, sorteados.
function crearDemo() {
  const [izquierda, derecha] = muestra(NOMBRES, 2);
  const demo = crearBandera(derecha, izquierda);
  demo.cuenta = 0.5;                                  // casi sin cuenta regresiva: aquí solo se mira
  return demo;
}

// Muestra la portada: el título arriba y la partida de fondo, sin desenfocar.
function mostrarPortada(estado) {
  prepararFondo(estado);
  estado.pantalla = 'portada';
  elemento('lienzo').style.filter = '';
  elemento('menu').style.display = 'none';
  elemento('portada').style.display = '';
  elemento('portada').classList.remove('fuera');
  // El texto de abajo depende de si hay teclado o se juega con los dedos; la hoja de estilos muestra el que toca.
  poner('portada', '<h1>Maze Runner</h1><p class="subtitulo">Proyecto de matemáticas discretas</p>' +
    '<p class="parpadea"><span class="conTeclado">Presiona cualquier tecla</span><span class="conDedo">Toca la pantalla</span></p>');
}

// Muestra el menú: desenfoca el fondo, barre el título hacia un lado y hace aparecer las cajas.
function mostrarMenu(estado) {
  prepararFondo(estado);
  estado.pantalla = 'menu';
  elemento('lienzo').style.filter = 'blur(6px)';
  elemento('portada').classList.add('fuera');                       // el título se va por la izquierda
  elemento('menu').style.display = '';
  pintarMenu(estado);
}

// Escribe las cajas del menú. Al abrirse, llegan una tras otra.
// Siempre se escriben de nuevo, aunque el texto sea el mismo de la vez anterior: así ninguna caja
// conserva restos de la última visita (la que estalló quedó escondida, y todas sin su animación).
let esperaDelMenu = 0;                  // el temporizador que quita la animación de entrada
function pintarMenu(estado) {
  clearTimeout(esperaDelMenu);
  elemento('interfaz').querySelectorAll('.pedazo').forEach(pedazo => pedazo.remove());   // partículas que sigan volando
  elemento('menu').classList.remove('yendose');
  delete elemento('menu').dataset.html;               // obliga a 'poner' a escribir el menú otra vez
  poner('menu', '<h1 class="chico">Maze Runner</h1><div class="cajas entrando">' +
    MODOS.map((modo, k) => `<button data-modo="${modo[0]}" style="animation-delay:${k * 60}ms"><b>${modo[1]}</b><span>${modo[2]}</span></button>`).join('') +
    '</div><p class="pie"><span class="conTeclado">Elige con las flechas y Enter, o con el ratón. Esc: portada.</span>' +
    '<span class="conDedo">Toca un modo para empezar.</span></p>');
  // Cuando terminan de llegar se quita la animación de entrada, para que puedan rebotar al elegirlas.
  esperaDelMenu = setTimeout(() => { const cajas = elemento('menu').querySelector('.cajas'); if (cajas) cajas.classList.remove('entrando'); marcarCaja(estado); }, 420 + MODOS.length * 60);
  marcarCaja(estado);
}

// Marca la caja elegida. Al cambiar de caja, la nueva se apachurra un poco y rebota.
function marcarCaja(estado) {
  elemento('menu').querySelectorAll('button[data-modo]').forEach((caja, k) => caja.classList.toggle('activo', k === estado.elegida));
}

// Atiende una tecla en la portada o en el menú.
function teclaDeMenu(estado, tecla) {
  if (estado.pantalla === 'salto') return;                           // durante el salto no se atiende nada
  if (estado.pantalla === 'portada') { mostrarMenu(estado); return; }   // cualquier tecla abre el menú
  if (tecla === 'Escape') { mostrarPortada(estado); return; }
  // El menú tiene tres columnas: fila 0 los juegos (cajas 0 a 2), fila 1 sus versiones de mirar
  // (cajas 3 a 5) y, debajo, Aprender (caja 6), que ocupa las tres columnas.
  const aprender = MODOS.length - 1, actual = estado.elegida;
  if (actual < aprender) estado.columnaDelMenu = actual % 3;         // se recuerda la columna, para volver a ella desde Aprender
  if (tecla === 'ArrowRight') estado.elegida = actual === aprender ? aprender : Math.floor(actual / 3) * 3 + (actual + 1) % 3;
  else if (tecla === 'ArrowLeft') estado.elegida = actual === aprender ? aprender : Math.floor(actual / 3) * 3 + (actual + 2) % 3;
  else if (tecla === 'ArrowDown') estado.elegida = actual < 3 ? actual + 3 : aprender;                  // juego -> mirar -> Aprender
  else if (tecla === 'ArrowUp') estado.elegida = actual === aprender ? 3 + (estado.columnaDelMenu || 0) : (actual >= 3 ? actual - 3 : actual);
  else if (tecla === 'Enter' || tecla === ' ') { clicDeMenu(estado, MODOS[estado.elegida][0]); return; }
  else return;
  marcarCaja(estado);
}

// Al pasar el cursor por una caja, queda elegida (y rebota).
if (typeof document !== 'undefined') {
  document.getElementById('menu').addEventListener('mouseover', evento => {
    const caja = evento.target.closest('button[data-modo]');
    if (!caja || estado.pantalla !== 'menu') return;
    const numero = MODOS.findIndex(modo => modo[0] === caja.dataset.modo);
    if (numero !== estado.elegida) { estado.elegida = numero; marcarCaja(estado); }
  });
}

// Elige un modo: su caja estalla en partículas y empieza el salto tipo hiperespacio.
function clicDeMenu(estado, modo) {
  if (estado.pantalla !== 'menu') return;
  estado.elegida = MODOS.findIndex(m => m[0] === modo);
  const caja = elemento('menu').querySelector(`button[data-modo="${modo}"]`);
  if (caja) estallarCaja(caja);
  estado.pantalla = 'salto';
  estado.salto = { modo, t: 0 };
  elemento('menu').classList.add('yendose');                        // las demás cajas se desvanecen
}

// Hace estallar una caja del menú: se esconde y en su lugar salen volando cuadritos de colores.
function estallarCaja(caja) {
  const zona = caja.getBoundingClientRect();
  caja.style.visibility = 'hidden';
  for (let k = 0; k < 46; k++) {
    const pedazo = document.createElement('div');
    pedazo.className = 'pedazo';
    const tam = 8 + Math.random() * 14;
    pedazo.style.cssText = `left:${zona.left + Math.random() * zona.width}px;top:${zona.top + Math.random() * zona.height}px;` +
      `width:${tam}px;height:${tam}px;background:${elegir(['#c62828', '#ffffff', '#111114', '#ffc107'])}`;
    elemento('interfaz').appendChild(pedazo);
    // Cada pedazo sale en una dirección al azar, gira y se desvanece.
    const angulo = Math.random() * Math.PI * 2, lejos = 160 + Math.random() * 380;
    pedazo.animate([{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.cos(angulo) * lejos}px,${Math.sin(angulo) * lejos + 120}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }],
                   { duration: 700 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => pedazo.remove();
  }
}

// Las estrellas del salto: cada una tiene su lugar alrededor del centro y qué tan lejos empieza.
const ESTRELLAS_DEL_SALTO = Array.from({ length: 260 }, () => {
  const angulo = Math.random() * Math.PI * 2, radio = 1.5 + Math.random() * 11;
  return { x: Math.cos(angulo) * radio, y: Math.sin(angulo) * radio, z: -Math.random() * 120, color: elegir([BLANCO, BLANCO, ROJO, [0.8, 0.86, 1]]) };
});

// Dibuja el salto tipo hiperespacio: rayas de luz que pasan volando hacia la cámara, cada vez más rápido.
function dibujarSalto(estado, segundos) {
  const gl = motor.gl, salto = estado.salto;
  salto.t += segundos;
  const avance = Math.min(1, salto.t / DURACION_DEL_SALTO);
  const rapidez = 30 + avance * avance * 420;         // acelera conforme avanza
  dinamico.vaciar();
  for (const estrella of ESTRELLAS_DEL_SALTO) {
    estrella.z += rapidez * segundos;
    if (estrella.z > 2) estrella.z -= 120;            // la que pasa de largo vuelve a empezar al fondo
    const largo = 0.4 + avance * avance * 22;         // las rayas se alargan con la velocidad
    dinamico.caja(bloque(estrella.x, estrella.y, estrella.z - largo / 2, 0.07, 0.07, largo), estrella.color, 1);
  }
  const camara = multiplicar(perspectiva(0.9 + avance * 0.7, motor.ancho / motor.alto, 0.1, 300), mirarHacia([0, 0, 0], [0, 0, -1]));
  // El fondo se oscurece y, justo al final, da un destello blanco.
  const destello = Math.max(0, (avance - 0.86) / 0.14);
  const fondo = mezcla(mezcla(luz.cielo, [0.01, 0.01, 0.03], Math.min(1, avance * 3)), [1, 1, 1], destello);
  gl.clearColor(fondo[0], fondo[1], fondo[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  dibujarLotes([dinamico], camara, Object.assign({}, luz, { cielo: fondo, lejos: 900, matriz: null }));
  if (salto.t >= DURACION_DEL_SALTO) {
    elemento('menu').classList.remove('yendose');
    empezar(salto.modo);                              // se llega al tablero
  }
}

// Dibuja lo que hay detrás de la portada y del menú: la partida que se juega sola, o el salto.
function dibujarMenu(estado, segundos, t) {
  if (estado.pantalla === 'salto') {
    elemento('lienzo').style.filter = '';
    elemento('portada').style.display = 'none';
    dibujarSalto(estado, segundos);
    return;
  }
  const demo = estado.demo;
  actualizarBandera(demo, segundos, []);
  demo.vida = (demo.vida || 0) + segundos;
  // Cuando la partida de fondo termina, o se alarga demasiado, empieza otra.
  if ((demo.fase === 'final' && demo.vida > demo.reloj + 8) || demo.vida > 150) estado.demo = crearDemo();
  return dibujarPartida(estado, demo, segundos, t);
}

// Hace que la cámara pasee despacio alrededor del tablero. Se usa detrás de la portada y del menú.
function pasearCamara(camara, tableros, t) {
  const centro = centroDe(tableros[0]);
  camara.ojoMeta = [centro[0] + Math.cos(t * 0.13) * 15, 9.5, centro[2] + Math.sin(t * 0.13) * 15];
  camara.centroMeta = [centro[0], 0.5, centro[2]];
}

// ============================================================================
// 17. TELÉFONOS
// En un teléfono se juega en horizontal y con los dedos: una cruceta para
// moverse, tres botones (acercar, reiniciar y menú) y, al solo mirar, un dedo
// gira la cámara y dos la acercan o la alejan. Aquí también se mide la
// interfaz en cada cuadro, para que nada se encime en pantallas chicas.
// ============================================================================

// Dice si la página se está viendo en un teléfono: una pantalla que se toca y que es chica.
const esTelefono = () => navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) <= 540;

// Acomoda la interfaz al tamaño y al tipo de pantalla. Se llama en cada cuadro.
//   estado: el estado del programa
// Devuelve true cuando el teléfono está en vertical: entonces se muestra el aviso de girarlo y
// el juego queda en pausa, porque quien llama deja de avanzarlo.
function acomodarPantalla(estado) {
  // Los controles para dedos aparecen en un teléfono o en cuanto alguien toca la pantalla.
  const tactil = estado.tocado || esTelefono();
  document.body.classList.toggle('tactil', tactil);
  const jugando = estado.pantalla === 'juego' && estado.modo !== 'aprender';
  elemento('cruceta').style.display = jugando ? '' : 'none';
  let botones = '';
  if (jugando) {
    const mirando = estado.modo.startsWith('mirar');
    botones = `<button data-tactil="acercar" class="${estado.seguir !== null ? 'activo' : ''}">${mirando ? 'Seguir a otro' : 'Acercar'}</button>` +
              '<button data-tactil="reiniciar">Reiniciar</button><button data-tactil="menu">Menú</button>';
  }
  poner('botonesTactiles', botones);
  // La altura de la barra y la del texto de ayuda cambian con el ancho de la ventana. Se le avisan
  // a la hoja de estilos, que coloca debajo de la barra y encima de la ayuda todo lo demás.
  const medidas = { '--barra': elemento('barra').offsetHeight || 64, '--pie': elemento('ayuda').offsetHeight };
  for (const nombre in medidas) {
    const valor = medidas[nombre] + 'px';
    if (document.documentElement.style.getPropertyValue(nombre) !== valor) document.documentElement.style.setProperty(nombre, valor);
  }
  const girar = esTelefono() && window.innerHeight > window.innerWidth;
  elemento('girar').style.display = girar ? '' : 'none';
  if (girar) estado.direcciones = [];                  // en pausa no queda ningún movimiento oprimido
  return girar;
}

// Da los márgenes, en pixeles, que la cámara debe dejar libres para la interfaz en la vista general.
//   juego: la partida que se está dibujando
// Se miden en la página: arriba, la barra y el mensaje; abajo, los botones y la ayuda. En una
// pantalla de computadora nunca se deja menos lugar que el acostumbrado.
function margenesDeLaInterfaz(juego) {
  const alto = motor.alto, gemas = juego.tipo === 'gemas', chica = alto < 520;
  // Dónde termina un elemento de arriba y dónde empieza uno de abajo; si no se ve, no estorba.
  const fondoDe = id => { const zona = elemento(id).getBoundingClientRect(); return zona.height ? zona.bottom : 0; };
  const topeDe = id => { const zona = elemento(id).getBoundingClientRect(); return zona.height ? zona.top : alto; };
  // En atrapa gemas cada tablero lleva encima su letrero, que también necesita lugar.
  let arriba = Math.max(fondoDe('barra'), fondoDe('mensaje')) + (gemas ? (chica ? 36 : 58) : 8);
  let abajo = alto - Math.min(topeDe('rivales'), topeDe('controles'), topeDe('ayuda')) + 13;
  if (!chica) { arriba = Math.max(arriba, gemas ? 122 : 112); abajo = Math.max(abajo, gemas ? 40 : 84); }
  return { lados: chica ? 10 : 24, arriba, abajo };
}

// Atiende los tres botones para dedos.
//   accion: 'acercar', 'reiniciar' o 'menu'
function accionTactil(estado, accion) {
  const juego = estado.juego;
  if (accion === 'menu') mostrarMenu(estado);
  else if (accion === 'reiniciar') empezar(estado.modo);
  else if (!estado.modo.startsWith('mirar')) {
    // Jugando: acerca la cámara al jugador, o regresa a la vista general.
    estado.seguir = estado.seguir === null ? juego.corredores.indexOf(juego.jugador) : null;
  } else {
    // Mirando: pasa a seguir al siguiente competidor y, después del último, vuelve a la vista general.
    estado.seguir = estado.seguir === null ? 0 : (estado.seguir + 1 < juego.corredores.length ? estado.seguir + 1 : null);
    Object.assign(estado.vista, { dx: 0, dz: 0 });
  }
}

// Los dedos sobre la pantalla.
if (typeof document !== 'undefined') {
  // El primer toque con un dedo hace aparecer los controles, aunque la pantalla no sea de teléfono.
  document.addEventListener('pointerdown', evento => { if (evento.pointerType === 'touch') estado.tocado = true; }, true);

  // La cruceta: la dirección sale de hacia dónde está el dedo respecto a su centro, así que se
  // puede cambiar de rumbo deslizándolo, sin levantarlo.
  const cruceta = document.getElementById('cruceta');
  const FLECHAS = { arriba: 'ArrowUp', derecha: 'ArrowRight', abajo: 'ArrowDown', izquierda: 'ArrowLeft' };
  const apuntar = evento => {
    const zona = cruceta.getBoundingClientRect();
    const dx = evento.clientX - (zona.left + zona.width / 2), dy = evento.clientY - (zona.top + zona.height / 2);
    let hacia = null;
    if (Math.hypot(dx, dy) > zona.width * 0.12) hacia = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'derecha' : 'izquierda') : (dy > 0 ? 'abajo' : 'arriba');
    // Es el mismo movimiento que da la flecha del teclado.
    estado.direcciones = hacia ? [TECLAS_DE_MOVIMIENTO[FLECHAS[hacia]]] : [];
    for (const marca of cruceta.children) marca.classList.toggle('activa', marca.className.split(' ')[0] === hacia);
  };
  let dedoEnCruceta = null;                            // el dedo que la está usando; los demás no la mueven
  const soltar = evento => {
    if (evento.pointerId !== dedoEnCruceta) return;
    dedoEnCruceta = null;
    estado.direcciones = [];
    for (const marca of cruceta.children) marca.classList.remove('activa');
  };
  cruceta.addEventListener('pointerdown', evento => { dedoEnCruceta = evento.pointerId; apuntar(evento); evento.preventDefault(); });
  cruceta.addEventListener('pointermove', evento => { if (evento.pointerId === dedoEnCruceta) apuntar(evento); });
  for (const tipo of ['pointerup', 'pointercancel']) cruceta.addEventListener(tipo, soltar);

  // Pellizcar al solo mirar: con dos dedos, la cámara se acerca o se aleja según se separen o
  // se junten. Mientras hay dos dedos no se gira.
  const lienzo = document.getElementById('lienzo'), dedos = new Map();
  const separacion = () => { const [a, b] = [...dedos.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  lienzo.addEventListener('pointerdown', evento => {
    dedos.set(evento.pointerId, [evento.clientX, evento.clientY]);
    if (dedos.size === 2) estado.arrastre = null;
  });
  lienzo.addEventListener('pointermove', evento => {
    if (!dedos.has(evento.pointerId)) return;
    const antes = dedos.size === 2 ? separacion() : 0;
    dedos.set(evento.pointerId, [evento.clientX, evento.clientY]);
    if (dedos.size !== 2 || antes < 1 || estado.pantalla !== 'juego' || !estado.modo.startsWith('mirar')) return;
    estado.arrastre = null;
    estado.vista.zoom = Math.min(6, Math.max(0.5, estado.vista.zoom * separacion() / antes));
  });
  for (const tipo of ['pointerup', 'pointercancel']) lienzo.addEventListener(tipo, evento => dedos.delete(evento.pointerId));
}

// ============================================================================
// 18. EL PROGRAMA
// ============================================================================

// Los modos del juego: clave, nombre y una línea que lo describe. Van en el orden del menú:
// los tres juegos, debajo de cada uno su versión de solo mirar y, al final, Aprender.
const MODOS = [
  ['gemas', 'Atrapa gemas', 'Carrera contra los cinco algoritmos, cada quien en su tablero.'],
  ['bandera', 'Captura la bandera', 'Uno contra uno: roba la bandera rival. A tres puntos.'],
  ['laberinto', 'Maze Runner', 'Un laberinto gigante que cambia cada 3 segundos.'],
  ['mirar_gemas', 'Mirar: atrapa gemas', 'Compiten solo los algoritmos.'],
  ['mirar_bandera', 'Mirar: captura la bandera', 'Elige el algoritmo de cada lado.'],
  ['mirar_laberinto', 'Mirar: Maze Runner', 'Sigue de cerca a quien quieras.'],
  ['aprender', 'Aprender', 'Cada algoritmo, paso a paso.'],
];

// Todo lo que cambia mientras corre el programa.
//   pantalla:    'portada', 'menu', 'salto' (el salto tipo hiperespacio) o 'juego'
//   elegida:     el número de la caja resaltada en el menú; columnaDelMenu: su columna, para volver a ella desde Aprender
//   modo, juego: el modo que se está jugando y su partida
//   rival:       el rival elegido en captura la bandera; se conserva entre partidas y empieza en A*
//   izquierda:   el algoritmo del lado izquierdo al solo mirar; empieza en BFS
//   direcciones: los movimientos oprimidos, del más viejo al más reciente
//   seguir:      el número del corredor al que sigue la cámara, o null para la vista general
//   momento:     el momento especial de cámara en curso (alguien anotó o ganó), o null
const estado = { pantalla: 'menu', elegida: 0, modo: null, juego: null, rival: 'A*', izquierda: 'BFS', direcciones: [],
                 seguir: null, momento: null, efectos: crearEfectos(), camara: crearCamara([0, 18, 30], [0, 0, 0]), t: 0 };

// Empieza una partida nueva del modo indicado.
function empezar(modo) {
  estado.modo = modo;
  estado.direcciones = [];
  estado.seguir = null;
  estado.momento = null;
  estado.cartelCerrado = false;
  adornosHechos.clear();                               // cada partida estrena adornos
  estado.efectos = crearEfectos();
  if (modo === 'gemas') estado.juego = crearGemas();
  else if (modo === 'mirar_gemas') estado.juego = crearGemas(false);
  else if (modo === 'bandera') estado.juego = crearBandera(estado.rival);
  else if (modo === 'mirar_bandera') estado.juego = crearBandera(estado.rival, estado.izquierda);
  else if (modo === 'aprender') estado.juego = empezarAprender();
  else estado.juego = crearLaberinto(modo === 'laberinto');
  estado.pantalla = 'juego';
  elemento('menu').style.display = 'none';
  elemento('portada').style.display = 'none';
  elemento('lienzo').style.filter = '';
  elemento('barra').style.display = '';
  alEmpezar(estado);
}

// Dice si la partida ya terminó: se anunció el resultado o alguien llegó a 3 puntos.
const terminada = juego => juego.tipo === 'bandera' ? juego.fase === 'final' : juego.anuncio;

// Las teclas de movimiento y su movimiento (cambio de fila, cambio de columna).
const TECLAS_DE_MOVIMIENTO = { ArrowUp: [-1, 0], w: [-1, 0], ArrowRight: [0, 1], d: [0, 1], ArrowDown: [1, 0], s: [1, 0], ArrowLeft: [0, -1], a: [0, -1] };

// Atiende una tecla que se oprime.
function alOprimir(evento) {
  const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key;
  if (tecla in TECLAS_DE_MOVIMIENTO || tecla === ' ' || tecla === 'Tab') evento.preventDefault();   // que la página no se mueva
  if (tecla in TECLAS_DE_MOVIMIENTO && !evento.repeat) {
    // Las direcciones se anotan al oprimirse; la más reciente queda al final.
    const direccion = TECLAS_DE_MOVIMIENTO[tecla];
    estado.direcciones = estado.direcciones.filter(x => x !== direccion);
    estado.direcciones.push(direccion);
  }
  if (estado.pantalla !== 'juego') { if (!evento.repeat) teclaDeMenu(estado, evento.key); return; }
  // El modo Aprender tiene sus propias teclas; ahí las flechas sí se repiten al dejarlas oprimidas.
  if (estado.modo === 'aprender') { teclaDeAprender(estado, tecla, evento.repeat); return; }
  if (evento.repeat) return;
  const juego = estado.juego, mirando = estado.modo.startsWith('mirar');
  if (tecla === 'Escape') mostrarMenu(estado);                                   // Esc: al menú
  else if (tecla === 'r') empezar(estado.modo);                                  // R: reinicia
  else if ((tecla === ' ' || tecla === 'Enter') && terminada(juego)) empezar(estado.modo);   // otra partida, cuando ya terminó
  else if (tecla === 'c' && !mirando) estado.seguir = estado.seguir === null ? juego.corredores.indexOf(juego.jugador) : null;   // C: acercar
  else if (juego.tipo === 'bandera' && tecla >= '1' && tecla <= '6' && !evento.shiftKey) {
    estado.rival = OPCIONES_DE_RIVAL[Number(tecla) - 1];                         // se conserva para las partidas siguientes
    empezar(estado.modo);
  }
  else if (juego.tipo === 'laberinto' && teclaDeLaberinto(estado, tecla)) return;
  else teclaDeModo(estado, evento, tecla);
}

// Atiende una tecla que se suelta.
function alSoltar(evento) {
  const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key;
  if (tecla in TECLAS_DE_MOVIMIENTO) estado.direcciones = estado.direcciones.filter(x => x !== TECLAS_DE_MOVIMIENTO[tecla]);
}

// Atiende un clic sobre un botón de la interfaz.
function alHacerClic(evento) {
  if (estado.pantalla === 'portada') { mostrarMenu(estado); return; }             // un clic en la portada abre el menú
  const boton = evento.target.closest('button');
  if (!boton) return;
  if (boton.dataset.modo) clicDeMenu(estado, boton.dataset.modo);
  else if (boton.dataset.rival) { estado.rival = boton.dataset.rival; empezar(estado.modo); }
  else if (boton.dataset.tactil) accionTactil(estado, boton.dataset.tactil);
  else if (boton.dataset.aprender) accionDeAprender(estado, boton.dataset.aprender, boton.dataset.valor);
  else if (boton.dataset.accion) accionDeLaberinto(estado, boton.dataset.accion);
  else clicDeModo(estado, boton);
  boton.blur();                                                                  // para que Espacio no vuelva a oprimirlo
}

// Avanza la partida un cuadro.
function actualizar(segundos) {
  actualizarEfectos(estado.efectos, segundos);
  if (estado.pantalla !== 'juego') return;
  const juego = estado.juego;
  // Al solo mirar, las teclas de movimiento mueven la cámara y no a un personaje.
  const direcciones = estado.modo.startsWith('mirar') ? [] : estado.direcciones;
  if (juego.tipo === 'gemas') actualizarGemas(juego, segundos, direcciones);
  else if (juego.tipo === 'bandera') actualizarBandera(juego, segundos, direcciones);
  else if (juego.tipo === 'aprender') actualizarAprender(juego, segundos);
  else actualizarLaberinto(juego, segundos, direcciones);
}

// Un cuadro completo: avanzar, dibujar y pedir el siguiente.
let momentoAnterior = 0;
function cuadro(ahora) {
  // Se limita a una décima de segundo para que, si la página se traba, los personajes no den un salto.
  const segundos = Math.min((ahora - momentoAnterior) / 1000, 0.1);
  momentoAnterior = ahora;
  // Con el teléfono en vertical se pide girarlo y el juego queda en pausa: no avanza ni se dibuja.
  if (acomodarPantalla(estado)) { requestAnimationFrame(cuadro); return; }
  estado.t += segundos;
  ajustarLienzo(elemento('lienzo'));
  actualizar(segundos);
  if (estado.pantalla === 'juego') {
    const escena = dibujarPartida(estado, estado.juego, segundos, estado.t);
    actualizarInterfaz(estado, estado.juego, escena);
  } else {
    dibujarMenu(estado, segundos, estado.t);
  }
  requestAnimationFrame(cuadro);
}

// Arranca el programa cuando la página termina de cargar.
function iniciar() {
  if (!iniciarMotor(elemento('lienzo'))) {
    poner('menu', '<h1>Maze Runner</h1><p>Este navegador no puede dibujar en 3D (WebGL).</p>');
    return;
  }
  window.addEventListener('keydown', alOprimir);
  window.addEventListener('keyup', alSoltar);
  document.addEventListener('click', alHacerClic);
  window.addEventListener('blur', () => { estado.direcciones = []; });          // al cambiar de ventana se sueltan las teclas
  mostrarPortada(estado);
  requestAnimationFrame(ahora => { momentoAnterior = ahora; requestAnimationFrame(cuadro); });
}
if (typeof document !== 'undefined') iniciar();

</script>

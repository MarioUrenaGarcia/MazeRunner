<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MazeRunner 3D</title>
<style>
:root{
  /* Paleta institucional: cambiar aquí si se tienen los códigos oficiales. */
  --rojo:#D7282F; --rojo-oscuro:#8F1620; --blanco:#FFFFFF; --carbon:#1B1B1E; --oro:#FFD21E;
  --titular:"Arial Black","Segoe UI Black",Impact,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5A0C14 0%,#B01E27 38%,#D7282F 62%,#F47C74 100%);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--carbon)}
canvas{display:block;position:fixed;left:0;top:0;transition:filter .6s ease}
canvas.borroso{filter:blur(9px) brightness(.82)}
/* El cielo va en su propio lienzo, siempre un poco desenfocado, como fondo lejano. */
#cielo{filter:blur(3.5px)}
#cielo.borroso{filter:blur(13px) brightness(.82)}
[hidden]{display:none!important}

/* Letras de carreras: gruesas, inclinadas y con contorno negro. */
.carrera{font-family:var(--titular);font-style:italic;font-weight:900;color:var(--blanco);-webkit-text-stroke:7px var(--carbon);paint-order:stroke fill;letter-spacing:.01em;line-height:1}
#hud{position:fixed;inset:0;pointer-events:none}
#posiciones{position:absolute;left:20px;top:22px;width:300px}
.fila{position:absolute;left:0;height:46px;display:flex;align-items:center;gap:8px;transition:top .35s cubic-bezier(.2,1.3,.4,1);transform:skewX(-9deg)}
.fila .puesto{font-size:34px;width:40px;text-align:center;color:var(--oro)}
.fila .ficha{width:30px;height:30px;border-radius:50%;border:4px solid var(--carbon);box-shadow:0 0 0 3px var(--blanco)}
.fila .nombre{font-size:22px;min-width:92px}
.fila .avance{font-size:19px;color:var(--oro)}
.fila .avance.salta{animation:saltarContador .3s cubic-bezier(.2,1.6,.4,1)}
.fila.yo .nombre{color:var(--oro)}
.fila.listo .avance{color:#7CFF8A}
#lugar{position:absolute;left:26px;bottom:74px;font-size:132px;-webkit-text-stroke-width:12px}
#lugar sup{font-size:.42em;vertical-align:top;margin-left:4px}
#lugar.primero{color:var(--oro)}
#contador{position:absolute;right:26px;top:18px;text-align:right}
#contador small{display:block;font-size:22px;color:var(--oro)}
#contador b{display:block;font-size:76px;-webkit-text-stroke-width:10px;transform-origin:right center}
#contador b.salta{animation:saltarContador .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes saltarContador{from{transform:scale(1.3)}}
#tiempo{position:absolute;right:26px;top:128px;font-size:30px}
#marcador{position:absolute;left:50%;top:16px;transform:translateX(-50%) skewX(-9deg);display:flex;align-items:center;gap:14px}
#marcador .lado{display:flex;align-items:center;gap:10px;padding:6px 18px;border:5px solid var(--carbon);border-radius:14px;box-shadow:5px 5px 0 var(--carbon)}
#marcador .lado span{font-size:22px}
#marcador .lado b{font-size:56px}
#marcador .entre{font-size:30px;color:var(--oro)}
#aviso{position:absolute;left:50%;top:118px;transform:translateX(-50%) skewX(-9deg);font-size:30px;color:var(--oro);white-space:nowrap}
#rivales{position:absolute;left:20px;top:20px;display:flex;gap:22px;align-items:flex-start;pointer-events:auto}
#rivales div{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#rivales b{font-size:20px;color:var(--oro);transform:skewX(-9deg)}
#rivales button{font:inherit;font-family:var(--titular);font-style:italic;font-size:17px;color:var(--blanco);background:var(--carbon);border:4px solid var(--carbon);border-radius:10px;padding:3px 12px;cursor:pointer;transform:skewX(-9deg);box-shadow:3px 3px 0 var(--carbon);opacity:.78}
#rivales button.elegido{background:var(--oro);color:var(--carbon);opacity:1;transform:skewX(-9deg) scale(1.1);transform-origin:left center}
.boton{font:inherit;font-family:var(--titular);font-style:italic;font-size:18px;color:var(--carbon);background:var(--oro);border:5px solid var(--carbon);border-radius:12px;padding:5px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--carbon);transform:skewX(-9deg);pointer-events:auto}
.boton:hover,.boton:focus-visible{background:var(--blanco);outline:none}
.boton.activo{background:var(--blanco)}
#acercar{position:absolute;right:26px;bottom:60px}
#flechas{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);display:flex;align-items:center;gap:14px}
#flechas span{font-size:20px;color:var(--oro)}
#fin.chico{justify-content:flex-start}
#fin.chico h3{font-size:clamp(30px,4vw,52px);-webkit-text-stroke-width:8px}
#fin.chico p{font-size:17px;margin-top:4px}
#cuenta{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:230px;-webkit-text-stroke-width:16px;color:var(--oro)}
.salta{animation:saltar .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes saltar{from{transform:scale(2.1);opacity:0}}
#cuenta.salta{animation:saltarCentro .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes saltarCentro{from{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
/* Modo aprender: panel de código y estructura a la derecha, leyenda y comparación a la izquierda. */
#aprender > div{position:absolute;background:rgba(27,27,30,.94);color:var(--blanco);border:5px solid var(--carbon);border-radius:16px;box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:12px 14px;pointer-events:auto;font-size:14px;line-height:1.35}
#aprender{--panel:min(470px,46vw)}
#leccion{right:14px;top:14px;bottom:14px;width:var(--panel);box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#leyenda{left:14px;right:calc(var(--panel) + 28px);top:14px;display:flex;flex-wrap:wrap;gap:3px 16px;font-weight:700;font-size:13px;padding:8px 12px}
#resultado{left:14px;right:calc(var(--panel) + 28px);bottom:14px;display:flex;gap:18px;align-items:flex-start}
#resultado > div:first-child{flex:none}
#aprender h4{margin:0;font-family:var(--titular);font-style:italic;font-size:15px;color:var(--oro)}
#aprender p{margin:0}
#aprender small{color:#B9B9C2;font-size:12px}
#aprender button{font:inherit;font-weight:800;font-size:13px;color:var(--blanco);background:#3A3A40;border:2px solid #5A5A62;border-radius:8px;padding:3px 9px;cursor:pointer}
#aprender button:hover,#aprender button:focus-visible{border-color:var(--oro);outline:none}
#aprender button.elegido{background:var(--oro);color:var(--carbon);border-color:var(--oro)}
#aprender .grupo{display:flex;flex-wrap:wrap;gap:5px}
#codigo{margin:0;font:12px/1.45 Consolas,"Courier New",monospace;background:#111114;border-radius:10px;padding:8px 0;white-space:pre;overflow-x:auto}
#codigo span{display:block;padding:0 10px}
#codigo span.ahora{background:var(--oro);color:var(--carbon);font-weight:700}
.dato{display:inline-block;background:#FFE066;color:var(--carbon);font-weight:800;font-size:12.5px;border-radius:7px;padding:2px 7px;margin:0 5px 5px 0}
.dato i{font-style:normal;font-weight:600;opacity:.75}
.dato.sale{background:var(--blanco);box-shadow:0 0 0 3px var(--oro)}
/* La pila es un vaso abierto por arriba; la cola, un tubo abierto por los dos lados. */
.pila{display:flex;gap:12px;align-items:stretch;margin-top:6px}
.vaso{flex:none;width:150px;border:4px solid #B9B9C2;border-top:none;border-radius:0 0 12px 12px;padding:8px 8px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:150px}
.vaso .dato{display:block;margin:0;text-align:center}
.pila .rotulos{display:flex;flex-direction:column;justify-content:space-between}
.tubo{border-top:4px solid #B9B9C2;border-bottom:4px solid #B9B9C2;padding:8px 4px 3px;min-height:30px}
.extremos{display:flex;justify-content:space-between;gap:10px;margin:6px 0 3px}
.rotulo{font-weight:800;font-size:12px;color:var(--oro)}
.rotulo b{color:var(--blanco)}
.muestra{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid #000;vertical-align:-3px;margin-right:7px}
#resultado table{border-collapse:collapse;margin:4px 0 0}
#resultado td,#resultado th{padding:2px 8px;text-align:right}
#resultado td:first-child,#resultado th:first-child{text-align:left}
#resultado tr.este{background:#3A3A40}
#resultado .mejor{color:#7CFF8A;font-weight:800}
#ayuda{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:17px;-webkit-text-stroke-width:5px;pointer-events:none;white-space:pre-wrap}

.capa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#portada{cursor:pointer;justify-content:flex-start;padding-top:3.5vh}
#portada h1{font-size:clamp(30px,5.2vw,70px);margin:0;-webkit-text-stroke-width:10px}
#portada p{font-size:clamp(15px,1.8vw,22px);margin:14px 0 0;color:var(--oro);-webkit-text-stroke-width:6px}
#portada .pulsa{color:var(--blanco);animation:latir 1.3s ease-in-out infinite}
@keyframes latir{50%{transform:scale(1.08)}}
/* El texto de la portada se barre de izquierda a derecha, un renglón tras otro. */
#portada.barrida > *{animation:barrer .55s cubic-bezier(.6,0,.9,.4) forwards}
#portada.barrida > :nth-child(2){animation-delay:.08s}
#portada.barrida > :nth-child(3){animation-delay:.16s}
@keyframes barrer{to{clip-path:inset(0 0 0 100%);transform:translateX(90px);opacity:0}}
#menu h2{font-size:46px;margin:0 0 26px;-webkit-text-stroke-width:9px}
#menu p{margin:26px 0 0;font-size:19px;color:var(--oro);-webkit-text-stroke-width:5px}
#modos{display:flex;flex-wrap:wrap;gap:20px 24px;justify-content:center;max-width:1240px}
#modos button{font:inherit;width:min(370px,86vw);text-align:left;background:var(--blanco);color:var(--carbon);border:6px solid var(--carbon);border-radius:18px;padding:16px 22px;cursor:pointer;box-shadow:8px 8px 0 var(--carbon);transform:skewX(-7deg);transition:transform .12s, box-shadow .12s, opacity .3s}
#modos button:hover,#modos button:focus-visible{transform:skewX(-7deg) translate(-3px,-3px) scale(1.03);box-shadow:12px 12px 0 var(--carbon);outline:none}
#modos b{display:block;font-family:var(--titular);font-style:italic;font-size:24px;color:var(--rojo)}
#modos span{display:block;font-size:16px;font-weight:700;margin-top:4px}
#menu.entrando #modos button{animation:entrar .5s cubic-bezier(.2,1.4,.4,1) backwards}
#menu.entrando #modos button:nth-child(2){animation-delay:.08s}
#menu.entrando #modos button:nth-child(3){animation-delay:.16s}
#menu.entrando #modos button:nth-child(4){animation-delay:.24s}
#menu.entrando #modos button:nth-child(5){animation-delay:.32s}
#menu.entrando #modos button:nth-child(6){animation-delay:.4s}
#menu.entrando #modos button:nth-child(7){animation-delay:.48s}
@keyframes entrar{from{opacity:0;transform:skewX(-7deg) translateY(40px) scale(.8)}}
#menu.saliendo h2,#menu.saliendo p,#menu.saliendo button{opacity:0;transition:opacity .3s}
#fin{pointer-events:none;justify-content:flex-end;padding-bottom:12vh}
#fin h3{margin:0;font-size:clamp(54px,9vw,120px);color:var(--oro);-webkit-text-stroke-width:13px;transform:translateX(-120vw) skewX(-9deg);transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
#fin p{white-space:pre-wrap;margin:10px 0 0;font-size:24px;-webkit-text-stroke-width:6px;opacity:0;transition:opacity .4s .35s}
#fin.ver h3{transform:skewX(-9deg)}
#fin.ver p{opacity:1}
.trozo{position:fixed;pointer-events:none;z-index:20}
#salto{position:fixed;inset:0;pointer-events:none;z-index:15;transition:none}
#sinVista{position:fixed;inset:auto 0 45% 0;text-align:center;font-size:22px}
@media (prefers-reduced-motion: reduce){#portada .pulsa,#menu.entrando #modos button,.salta,#cuenta.salta{animation:none}}
</style>
</head>
<body>
<div id="hud" hidden>
  <div id="posiciones"></div>
  <div id="lugar" class="carrera"></div>
  <div id="contador" class="carrera"><small></small><b></b></div>
  <div id="tiempo" class="carrera"></div>
  <div id="marcador" class="carrera"></div>
  <div id="aviso" class="carrera"></div>
  <div id="rivales"></div>
  <button id="acercar" class="boton">ACERCAR (C)</button>
  <div id="flechas"><button class="boton" data-sentido="-1" aria-label="Ver al anterior">&#9664;</button><span class="carrera">VER A LOS DEMÁS</span><button class="boton" data-sentido="1" aria-label="Ver al siguiente">&#9654;</button></div>
  <div id="cuenta" class="carrera"></div>
  <div id="aprender" hidden><div id="leyenda"></div><div id="resultado"></div><div id="leccion"></div></div>
</div>
<div id="ayuda" class="carrera" hidden></div>
<div id="fin" class="capa" hidden><h3 id="finTitulo" class="carrera"></h3><p id="finDetalle" class="carrera"></p><p class="carrera">ESPACIO: OTRA VEZ   ESC: MENÚ</p></div>
<div id="portada" class="capa">
  <h1 class="carrera">Proyecto Matemáticas Discretas</h1>
  <p class="carrera">MazeRunner: algoritmos de búsqueda en grafos</p>
  <p class="carrera pulsa">PRESIONA CUALQUIER TECLA</p>
</div>
<div id="menu" class="capa" hidden>
  <h2 class="carrera">ELIGE UN MODO</h2>
  <div id="modos"></div>
  <p class="carrera">CLIC O TECLAS 1 A 7</p>
</div>
<canvas id="salto" hidden></canvas>
<div id="sinVista" class="carrera" hidden>No se pudo iniciar la vista 3D. Revisa la conexión a internet o que el navegador permita WebGL.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// LOGICA-INICIO
// ---------------------------------------------------------------------------
// Mapa y algoritmos de búsqueda: los mismos de la fase 1
// ---------------------------------------------------------------------------
const COSTOS = {'.': 1, 'b': 3, 'a': 5};

// Colores de los personajes. El jugador lleva el rojo institucional.
const ROJO = 0xD7282F, CARBON = 0x26262A, AMBAR = 0xE98A15, VIOLETA = 0x7A4FB5, TURQUESA = 0x2A9D8F, AZUL = 0x2F6CB0, DORADO = 0xF2B632, GRIS = 0x9A9A9F;

function leerMapa(texto) {
  // Devuelve la cuadrícula de terreno y un diccionario símbolo -> posiciones.
  const filas = texto.trim().split('\n').map(l => l.trim());
  const ancho = Math.max(...filas.map(f => f.length));
  const cuad = [], puntos = {};
  filas.forEach((fila, f) => {
    let terreno = '';
    [...fila.padEnd(ancho, '#')].forEach((s, c) => {
      if (s in COSTOS || s === '#' || s === '_') terreno += s;      // '_' es vacío: ahí no hay tablero
      else { (puntos[s] = puntos[s] || []).push([f, c]); terreno += '.'; }
    });
    cuad.push(terreno);
  });
  return {cuad, puntos};
}
const K = p => p[0] * 1000 + p[1];
const igual = (a, b) => a[0] === b[0] && a[1] === b[1];
const distancia = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

function vecinos(cuad, p) {
  // Casillas contiguas transitables, con el costo de entrar a cada una.
  const out = [];
  for (const [nf, nc] of [[p[0] - 1, p[1]], [p[0], p[1] + 1], [p[0] + 1, p[1]], [p[0], p[1] - 1]]) {
    if (nf >= 0 && nf < cuad.length && nc >= 0 && nc < cuad[0].length && cuad[nf][nc] in COSTOS) out.push([[nf, nc], COSTOS[cuad[nf][nc]]]);
  }
  return out;
}
function reconstruir(padres, meta) {
  const ruta = [];
  for (let x = meta; x; x = padres.get(K(x))) ruta.push(x);
  return ruta.reverse();
}
const heuristica = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

// Cada búsqueda deja aquí cuántas casillas tuvo que revisar para encontrar su ruta.
// Es la métrica principal de la fase 1, y en el juego se convierte en tiempo de pensar.
let casillasExploradas = 0;

// Cola de prioridad sencilla: una lista que se mantiene ordenada por su primer valor.
function meter(cola, elemento) {
  let i = cola.length;
  while (i > 0 && (cola[i - 1][0] > elemento[0] || (cola[i - 1][0] === elemento[0] && cola[i - 1][1] > elemento[1]))) i--;
  cola.splice(i, 0, elemento);
}

function bfs(cuad, inicio, meta) {
  casillasExploradas = 0;
  // Ruta con menos pasos. No toma en cuenta el costo del terreno.
  const frontera = [inicio], padres = new Map([[K(inicio), null]]);
  for (let i = 0; i < frontera.length; i++) {
    const actual = frontera[i];
    casillasExploradas++;
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v] of vecinos(cuad, actual)) if (!padres.has(K(v))) { padres.set(K(v), actual); frontera.push(v); }
  }
  return null;
}
function dfs(cuad, inicio, meta) {
  casillasExploradas = 0;
  // Primera ruta que aparece al avanzar siempre por el último camino abierto. Suele dar muchas vueltas.
  const frontera = [inicio], padres = new Map([[K(inicio), null]]), explorados = new Set();
  while (frontera.length) {
    const actual = frontera.pop();
    if (explorados.has(K(actual))) continue;
    explorados.add(K(actual));
    casillasExploradas++;
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v] of vecinos(cuad, actual)) if (!explorados.has(K(v))) { padres.set(K(v), actual); frontera.push(v); }
  }
  return null;
}
function dijkstra(cuad, inicio, meta) {
  casillasExploradas = 0;
  // Ruta de menor costo: sale siempre la casilla más barata de alcanzar desde el inicio.
  const frontera = [[0, 0, inicio]], costos = new Map([[K(inicio), 0]]), padres = new Map([[K(inicio), null]]);
  let n = 0;
  while (frontera.length) {
    const [costo, , actual] = frontera.shift();
    if (costo > costos.get(K(actual))) continue;      // entrada vieja: ya había un camino más barato
    casillasExploradas++;
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v, peso] of vecinos(cuad, actual)) {
      const nuevo = costo + peso;
      if (!costos.has(K(v)) || nuevo < costos.get(K(v))) { costos.set(K(v), nuevo); padres.set(K(v), actual); meter(frontera, [nuevo, ++n, v]); }
    }
  }
  return null;
}
function voraz(cuad, inicio, meta) {
  casillasExploradas = 0;
  // Avanza siempre hacia la casilla que parece más cercana a la meta.
  const frontera = [[heuristica(inicio, meta), 0, inicio]], padres = new Map([[K(inicio), null]]);
  let n = 0;
  while (frontera.length) {
    const actual = frontera.shift()[2];
    casillasExploradas++;
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v] of vecinos(cuad, actual)) if (!padres.has(K(v))) { padres.set(K(v), actual); meter(frontera, [heuristica(v, meta), ++n, v]); }
  }
  return null;
}
function aEstrella(cuad, inicio, meta) {
  casillasExploradas = 0;
  // Ruta de menor costo: combina el costo acumulado con el estimado restante.
  const h0 = heuristica(inicio, meta);
  const frontera = [[h0, h0, inicio]], costos = new Map([[K(inicio), 0]]), padres = new Map([[K(inicio), null]]), cerrados = new Set();
  while (frontera.length) {
    const actual = frontera.shift()[2];
    if (cerrados.has(K(actual))) continue;
    cerrados.add(K(actual));
    casillasExploradas++;
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v, peso] of vecinos(cuad, actual)) {
      const nuevo = costos.get(K(actual)) + peso;
      if (!costos.has(K(v)) || nuevo < costos.get(K(v))) {
        costos.set(K(v), nuevo); padres.set(K(v), actual);
        const h = heuristica(v, meta);
        meter(frontera, [nuevo + h, h, v]);
      }
    }
  }
  return null;
}
function alcanzables(cuad, inicio) {
  // Recorrido en anchura completo: todas las casillas conectadas con el inicio.
  // Sirve para comprobar que mover un muro no deja a nadie encerrado.
  const vistos = new Set([K(inicio)]), frontera = [inicio];
  for (let i = 0; i < frontera.length; i++) {
    for (const [v] of vecinos(cuad, frontera[i])) if (!vistos.has(K(v))) { vistos.add(K(v)); frontera.push(v); }
  }
  return vistos;
}
function conMuros(cuad, posiciones) {
  // Copia de la cuadrícula con muros en las posiciones dadas.
  const filas = cuad.map(fila => [...fila]);
  for (const [f, c] of posiciones) filas[f][c] = '#';
  return filas.map(fila => fila.join(''));
}
function muestra(lista, n) {
  // Elige n elementos al azar sin repetir.
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copia[i], copia[j]] = [copia[j], copia[i]]; }
  return copia.slice(0, n);
}

function terrenoAlAzar(libres, cuantos) {
  // Reparte casillas libres entre muros, bosque y agua: 'cuantos' de cada uno, en
  // manchas de dos casillas contiguas para que no queden como puntos sueltos.
  const usadas = new Set(), lista = [];
  for (const tipo of ['#', 'b', 'a']) {
    let puestos = 0;
    for (const semilla of muestra(libres, libres.length)) {
      if (puestos >= cuantos) break;
      if (usadas.has(K(semilla))) continue;
      const vecina = muestra(libres.filter(x => distancia(x, semilla) === 1 && !usadas.has(K(x))), 1);
      for (const pos of [semilla, ...vecina]) if (puestos < cuantos) { usadas.add(K(pos)); lista.push({tipo, pos}); puestos++; }
    }
  }
  return lista;
}

function tablerosEnFilas(base, cuantos) {
  // Texto de un mapa con varias copias del mismo tablero, en filas de tres separadas
  // por franjas vacías. Si la última fila queda incompleta, el hueco no tiene tablero.
  const ancho = base[0].length, hueco = '_'.repeat(ancho), filas = [];
  for (let primero = 0; primero < cuantos; primero += 3) {
    if (primero) filas.push('_'.repeat(3 * ancho + 2));
    base.forEach(fila => filas.push([0, 1, 2].map(k => primero + k < cuantos ? fila : hueco).join('_')));
  }
  return filas.join('\n');
}

// Cada tipo de rival: nombre, algoritmo y color.
// Son los cinco algoritmos comparados en la fase 1.
const RIVALES = [['BFS', bfs, AMBAR], ['DFS', dfs, TURQUESA], ['Dijkstra', dijkstra, AZUL], ['Voraz', voraz, VIOLETA], ['A*', aEstrella, CARBON]];

// ---------------------------------------------------------------------------
// Piezas comunes a los dos modos
// ---------------------------------------------------------------------------
const VELOCIDAD_JUGADOR = 5.0, VELOCIDAD_RIVAL = 4.4, CONTACTO = 0.6, CUENTA_ATRAS = 3;
const SEGUNDOS_POR_CASILLA = 0.008;      // tiempo que un rival se queda pensando por cada casilla que explora
let siguienteId = 1, versionMapa = 0;

class Personaje {
  // Cualquiera que camina por el mapa: el jugador o un rival.
  constructor(posicion, color, nombre, algoritmo, velocidad) {
    Object.assign(this, {id: siguienteId++, posicion, base: posicion, color, nombre, algoritmo, velocidad, camino: [], avance: 0, pensando: 0, porCasilla: SEGUNDOS_POR_CASILLA});
  }
  visual() {
    // Posición interpolada mientras camina entre dos casillas.
    const [f, c] = this.posicion;
    if (!this.camino.length) return [f, c];
    return [f + (this.camino[0][0] - f) * this.avance, c + (this.camino[0][1] - c) * this.avance];
  }
  irA(cuad, objetivo) {
    // Si va a medio paso, primero termina de llegar a la casilla siguiente.
    const origen = this.camino.length && this.avance > 0 ? this.camino[0] : this.posicion;
    const ruta = this.algoritmo(cuad, origen, objetivo);
    this.camino = (igual(origen, this.posicion) ? [] : [origen]).concat(ruta ? ruta.slice(1) : []);
    // Planear no es gratis: se queda quieto un tiempo proporcional a lo que exploró.
    // Así un algoritmo que revisa medio tablero pierde frente a uno que va al grano.
    this.pensando = casillasExploradas * this.porCasilla;
    this.exploradas = (this.exploradas || 0) + casillasExploradas;
  }
  avanzar(dt, cuad) {
    // Devuelve true cuando acaba de llegar a una casilla. El terreno caro se cruza más despacio.
    if (this.pensando > 0) { this.pensando -= dt; return false; }      // todavía está pensando la ruta
    if (!this.camino.length) return false;
    const [f, c] = this.camino[0];
    this.avance += dt * this.velocidad / COSTOS[cuad[f][c]];
    if (this.avance < 1) return false;
    this.avance = 0;
    this.posicion = this.camino.shift();
    return true;
  }
  regresar() { this.posicion = this.base; this.camino = []; this.avance = 0; this.pensando = 0; }
}

class Modo {
  // Base de los modos: mapa, terreno cambiante, movimiento del jugador y fin de partida.
  constructor() { this.tiempo = 0; this.direccion = null; this.eventos = []; this.cargar(); }
  usarMapa(texto) {
    const m = leerMapa(texto);
    this.cuadBase = m.cuad;          // tablero vacío: solo llano
    this.cuad = m.cuad.slice();      // tablero con los muros, árboles y agua del momento
    this.terreno = []; this.versionTerreno = 0;
    this.puntos = m.puntos;
    this.filas = this.cuad.length; this.columnas = this.cuad[0].length;
    this.estado = 'jugando'; this.final = ['', ''];
    this.espera = CUENTA_ATRAS;      // segundos de cuenta regresiva antes de arrancar
    this.version = ++versionMapa;    // avisa a la vista de que hay que reconstruir la escena
  }
  ponerTerreno(lista) {
    // lista: piezas de terreno como {id, tipo, pos}, con tipo '#', 'b' o 'a'.
    // El id permite a la vista deslizar cada muro hasta su lugar nuevo.
    this.terreno = lista;
    const filas = this.cuadBase.map(fila => [...fila]);
    for (const pieza of lista) filas[pieza.pos[0]][pieza.pos[1]] = pieza.tipo;
    this.cuad = filas.map(fila => fila.join(''));
    this.versionTerreno++;
  }
  vistaTerreno() {
    return {muros: this.terreno.filter(x => x.tipo === '#'), arboles: this.terreno.filter(x => x.tipo === 'b').map(x => x.pos)};
  }
  emitir(tipo, pos, color, extra) { this.eventos.push(Object.assign({tipo, pos, color}, extra)); }
  terminar(ganado, titulo, detalle, foco) {
    this.estado = ganado ? 'ganado' : 'perdido';
    this.final = [titulo, detalle || ''];
    this.emitir('fin', foco, ganado ? ROJO : GRIS, {ganado});
  }
  tecla(t) {
    if (t === 'r' || ((t === ' ' || t === 'enter') && this.estado !== 'jugando')) this.cargar();
  }
  transitable(p) { return p[0] >= 0 && p[0] < this.filas && p[1] >= 0 && p[1] < this.columnas && this.cuad[p[0]][p[1]] in COSTOS; }
  moverJugador(jugador, dt) {
    if (!jugador.camino.length && this.direccion) {
      const casilla = [jugador.posicion[0] + this.direccion[0], jugador.posicion[1] + this.direccion[1]];
      if (this.transitable(casilla)) jugador.camino = [casilla];
    }
    return jugador.avanzar(dt, this.cuad);
  }
}

// ---------------------------------------------------------------------------
// Modo 1: atrapa gemas
// ---------------------------------------------------------------------------
// Tablero de un competidor: empieza vacío. En la partida hay seis copias idénticas,
// una para el jugador y una por cada algoritmo.
const MAPA_GEMAS = `
I........
.........
.........
.........
.........
.........
.........
.........
.........`;
const PIEZAS_POR_TIPO = 5;      // muros, árboles y charcos que hay en cada tablero

class AtrapaGemas extends Modo {
  // Cada competidor corre en su propio tablero, igual a los demás, y recoge la misma
  // secuencia de gemas. Cada vez que alguien toma una gema, el terreno de su tablero
  // cambia: los muros se mueven, unos árboles crecen y a otros se los traga la tierra,
  // y el agua aparece y desaparece. Esa secuencia de terrenos también es común, así
  // que todos enfrentan exactamente lo mismo y lo único que cambia es el algoritmo.
  cargar() {
    const base = MAPA_GEMAS.trim().split('\n'), ancho = base[0].length;
    // Un tablero por competidor, en filas de tres separadas por franjas vacías. Como
    // espectador compiten solo los cinco algoritmos, así que un hueco queda sin tablero.
    const quienes = [...(this.soloVer ? [] : [['Tú', aEstrella, ROJO, VELOCIDAD_JUGADOR]]), ...RIVALES.map(r => [...r, VELOCIDAD_RIVAL])];
    this.usarMapa(tablerosEnFilas(base, quienes.length));
    this.total = 8;
    // Todo se sortea una vez, en coordenadas del tablero base, y vale para los seis.
    const local = leerMapa(MAPA_GEMAS), inicio = local.puntos.I[0], llano = [];
    local.cuad.forEach((fila, f) => [...fila].forEach((s, c) => { if (s === '.' && !igual([f, c], inicio)) llano.push([f, c]); }));
    this.secuencia = [];
    for (let previo = inicio; this.secuencia.length < this.total;) {
      // Cada gema aparece lejos de la anterior para que haya que recorrer el tablero.
      const lejos = llano.filter(x => distancia(x, previo) >= 5);
      previo = lejos[Math.floor(Math.random() * lejos.length)];
      this.secuencia.push(previo);
    }
    // etapas[k]: cómo está el terreno mientras se busca la gema k.
    this.etapas = this.secuencia.map((gema, k) => {
      const origen = k ? this.secuencia[k - 1] : inicio;
      // Nada puede caer sobre la gema ni junto al competidor, que acaba de tomar la anterior.
      const libres = llano.filter(x => distancia(x, origen) > 1 && !igual(x, gema));
      for (let intento = 0; intento < 60; intento++) {
        const piezas = terrenoAlAzar(libres, PIEZAS_POR_TIPO);
        const muros = piezas.filter(x => x.tipo === '#').map(x => x.pos);
        // Solo vale un terreno cuyos muros dejen camino hasta la gema.
        if (aEstrella(conMuros(local.cuad, muros), origen, gema)) return piezas;
      }
      return [];
    });
    this.todos = this.puntos.I.map((pos, k) => {
      const p = new Personaje(pos, quienes[k][2], quienes[k][0], quienes[k][1], quienes[k][3]);
      // El desvío traslada las coordenadas del tablero base al tablero de este competidor.
      p.desvio = [pos[0] - inicio[0], pos[1] - inicio[1]]; p.puntos = 0; p.tiempoFinal = null;
      return p;
    });
    // Sin jugador, todos son rivales manejados por la CPU.
    this.jugador = this.soloVer ? null : this.todos[0];
    this.rivales = this.soloVer ? this.todos : this.todos.slice(1);
    this.reloj = 0; this.llegadas = [];
    this.colocarTerreno();
    this.rivales.forEach(r => r.irA(this.cuad, this.gemaDe(r)));
  }
  gemaDe(p) {
    // Gema que le toca ahora a un competidor, ya en su propio tablero. Null si terminó.
    const g = this.secuencia[p.puntos];
    return g ? [g[0] + p.desvio[0], g[1] + p.desvio[1]] : null;
  }
  colocarTerreno() {
    // Cada tablero muestra el terreno de la etapa en la que va su competidor.
    const lista = [];
    this.todos.forEach((p, tablero) => {
      this.etapas[Math.min(p.puntos, this.total - 1)].forEach((x, i) => lista.push({id: tablero * 100 + i, tipo: x.tipo, pos: [x.pos[0] + p.desvio[0], x.pos[1] + p.desvio[1]]}));
    });
    this.ponerTerreno(lista);
  }
  actualizar(dt) {
    this.reloj += dt;
    if (this.jugador && this.jugador.tiempoFinal === null) this.moverJugador(this.jugador, dt);
    this.rivales.forEach(r => r.avanzar(dt, this.cuad));
    for (const p of this.todos) {
      const gema = this.gemaDe(p);
      if (!gema || distancia(p.visual(), gema) >= 0.5) continue;
      p.puntos++;
      const esJugador = p === this.jugador;
      this.emitir('gema', gema, p.color, {quien: p.id, esJugador});
      if (p.puntos === this.total) {
        p.tiempoFinal = this.reloj; this.llegadas.push(p);
        this.emitir('meta', gema, p.color, {quien: p.id, esJugador});
        // El resultado se anuncia cuando termina el jugador o, si solo se mira, cuando llega el primero.
        // Los demás siguen corriendo para que se pueda ver cómo acaban.
        if (esJugador || (this.soloVer && this.llegadas.length === 1)) this.cerrar();
        continue;
      }
      // Al tomar la gema cambia el terreno de su tablero y hay que volver a planear la ruta.
      this.colocarTerreno();
      if (!esJugador || this.automatico) p.irA(this.cuad, this.gemaDe(p));
    }
  }
  orden() {
    // Clasificación: primero quien ya terminó, luego quien lleva más gemas, luego quien está más cerca de la siguiente.
    const falta = p => { const g = this.gemaDe(p); return g ? distancia(p.visual(), g) : 0; };
    return this.todos.slice().sort((a, b) => (a.tiempoFinal ?? Infinity) - (b.tiempoFinal ?? Infinity) || b.puntos - a.puntos || falta(a) - falta(b));
  }
  cerrar() {
    const lugar = this.llegadas.indexOf(this.jugador) + 1;
    const tabla = this.llegadas.map((p, i) => `${i + 1}. ${p.nombre} ${p.tiempoFinal.toFixed(1)} s`).join('   ');
    if (this.soloVer) return this.terminar(true, 'GANÓ ' + this.llegadas[0].nombre.toUpperCase(), tabla, this.llegadas[0].visual());
    this.terminar(lugar === 1, lugar === 1 ? '¡GANASTE!' : `LUGAR ${lugar}`, tabla, this.jugador.visual());
  }
  escena() {
    return {
      // Quien ya terminó se queda bailando en su tablero.
      personajes: this.todos.map(p => ({p, etiqueta: p.nombre, baila: p.tiempoFinal !== null})),
      gemas: this.todos.map(p => this.gemaDe(p)).filter(Boolean),
      ...this.vistaTerreno(), rutas: this.rivales,
    };
  }
  hud() {
    const orden = this.orden();
    return {
      tipo: 'carrera', lugar: this.jugador ? orden.indexOf(this.jugador) + 1 : null, tiempo: this.reloj,
      contador: this.jugador ? ['GEMAS', `${this.jugador.puntos}/${this.total}`] : ['VA GANANDO', orden[0].nombre.toUpperCase()],
      filas: orden.map(p => ({id: p.id, nombre: p.nombre.toUpperCase(), color: p.color, yo: p === this.jugador, listo: p.tiempoFinal !== null,
        avance: p.tiempoFinal !== null ? p.tiempoFinal.toFixed(1) + ' s' : `${p.puntos}/${this.total}`})),
    };
  }
}
AtrapaGemas.prototype.sigueTrasFinal = true;
AtrapaGemas.titulo = 'ATRAPA GEMAS';
AtrapaGemas.resumen = 'Mismo tablero, mismas gemas y mismo terreno cambiante para todos. Termina antes que los cinco algoritmos.';
AtrapaGemas.ayuda = 'FLECHAS O WASD   C: ACERCAR LA CÁMARA   TU TABLERO ES EL DE ARRIBA A LA IZQUIERDA   R: REINICIAR   ESC: MENÚ';

// ---------------------------------------------------------------------------
// Modo 2: captura la bandera
// ---------------------------------------------------------------------------
// I y 3 son las salidas del jugador y de la CPU. El tablero empieza vacío.
const MAPA_BANDERA = `
.................
.................
.................
.................
.................
I...............3
.................
.................
.................
.................
.................`;
const PIEZAS_POR_LADO = 5;      // muros, árboles y charcos en cada mitad del mapa

class Bandera extends Modo {
  // Robar la bandera rival y llevarla a la propia, tres veces. Las banderas cambian de
  // lugar tras cada punto, y el terreno (muros, árboles y agua) cambia cada vez que
  // alguien toma una bandera, anota o choca. Todo se coloca en espejo, así que los dos
  // lados enfrentan lo mismo.
  cargar() {
    this.usarMapa(MAPA_BANDERA);
    this.metaPuntos = 3;
    // Como espectador, el lado izquierdo también lo maneja un algoritmo y conserva el color rojo.
    this.jugador = this.soloVer ? this.nuevoRival(this.puntos.I[0], Bandera.izquierda, ROJO) : new Personaje(this.puntos.I[0], ROJO, 'Tú', aEstrella, VELOCIDAD_JUGADOR);
    this.cpu = this.nuevoRival(this.puntos['3'][0]);
    this.ganador = null;
    for (const p of [this.jugador, this.cpu]) { p.lleva = false; p.puntos = 0; }
    this.mitad = Math.floor(this.columnas / 2);
    // Se sortea una sola secuencia de posiciones, en la mitad del jugador. La bandera
    // de la CPU usa siempre la casilla espejo.
    const candidatas = [];
    for (let f = 0; f < this.filas; f++) for (let c = 0; c < this.mitad - 1; c++) {
      if (this.cuadBase[f][c] === '.' && distancia([f, c], this.jugador.base) >= 3) candidatas.push([f, c]);
    }
    this.secuencia = muestra(candidatas, 16);      // de sobra: se avanza una con cada punto y con cada choque
    this.ronda = 0;
    this.colocarBanderas();
    this.cambiarMapa();
  }
  nuevoRival(posicion, eleccion = Bandera.rival, colorFijo) {
    // Crea a un personaje de la CPU con el algoritmo elegido. En 'Azar' se sortea uno cualquiera.
    const opciones = RIVALES.filter(r => r[0] === eleccion);
    const [nombre, algoritmo, color] = opciones.length ? opciones[0] : RIVALES[Math.floor(Math.random() * RIVALES.length)];
    return new Personaje(posicion, colorFijo || color, nombre, algoritmo, 4.3);
  }
  elegir(lado, indice) {
    // Cambia el algoritmo de un lado y empieza una partida nueva.
    Bandera[lado] = Bandera.OPCIONES[indice];
    this.cargar();
  }
  tecla(t) {
    // Las teclas 1 a 6 eligen el algoritmo del lado derecho.
    if (t >= '1' && t <= String(Bandera.OPCIONES.length)) this.elegir('rival', Number(t) - 1);
    else super.tecla(t);
  }
  espejo(x) { return [x[0], this.columnas - 1 - x[1]]; }
  colocarBanderas() {
    const p = this.secuencia[this.ronda % this.secuencia.length];
    this.jugador.bandera = p;
    this.cpu.bandera = this.espejo(p);
  }
  cambiarMapa() {
    // Sortea terreno nuevo en la mitad izquierda y lo repite en espejo en la derecha.
    const claves = [this.jugador.base, this.cpu.base, this.jugador.bandera, this.cpu.bandera], cerca = [];
    for (const p of [this.jugador, this.cpu]) { cerca.push(p.posicion); if (p.camino.length) cerca.push(p.camino[0]); }
    // Nada puede caer sobre una base o una bandera, ni encima o al lado de un personaje.
    const prohibida = x => claves.some(k => igual(k, x)) || cerca.some(k => distancia(k, x) <= 1);
    const libres = [];
    for (let f = 0; f < this.filas; f++) for (let c = 0; c < this.mitad; c++) {
      if (!prohibida([f, c]) && !prohibida(this.espejo([f, c]))) libres.push([f, c]);
    }
    for (let intento = 0; intento < 40; intento++) {
      const izquierda = terrenoAlAzar(libres, PIEZAS_POR_LADO);
      const lista = [...izquierda.map((x, i) => ({id: i, tipo: x.tipo, pos: x.pos})), ...izquierda.map((x, i) => ({id: i + 100, tipo: x.tipo, pos: this.espejo(x.pos)}))];
      // Se acepta solo si bases, banderas y personajes siguen conectados entre sí.
      const muros = lista.filter(x => x.tipo === '#').map(x => x.pos);
      const zona = alcanzables(conMuros(this.cuadBase, muros), this.jugador.base);
      if ([...claves, ...cerca].every(k => zona.has(K(k)))) return this.ponerTerreno(lista);
    }
  }
  objetivoDe(personaje, rival) {
    if (personaje.lleva) return personaje.bandera;     // ya la tiene: a casa
    if (rival.lleva) return rival.posicion;            // le robaron: a perseguir
    return rival.bandera;                              // nada en juego: a robar
  }
  moverCpu(personaje, rival, dt) {
    personaje.avanzar(dt, this.cuad);
    // Solo vuelve a planear cuando cambia su objetivo o el terreno. Si planeara en cada casilla,
    // un algoritmo como DFS elegiría un camino distinto a cada paso y no llegaría nunca.
    const objetivo = this.objetivoDe(personaje, rival), plan = K(objetivo) + ':' + this.versionTerreno;
    if (!personaje.camino.length || (personaje.avance === 0 && personaje.plan !== plan)) { personaje.irA(this.cuad, objetivo); personaje.plan = plan; }
  }
  revisar(personaje, rival) {
    const esJugador = !this.soloVer && personaje === this.jugador;
    if (igual(personaje.posicion, rival.bandera) && !personaje.lleva) {
      personaje.lleva = true;
      this.emitir('robo', rival.bandera, rival.color, {quien: personaje.id, esJugador});
      this.cambiarMapa();
    } else if (igual(personaje.posicion, personaje.bandera) && personaje.lleva) {
      personaje.puntos++;
      this.emitir('punto', personaje.bandera, personaje.color, {quien: personaje.id, esJugador});
      // Tras cada punto las dos banderas saltan a la siguiente posición. Quien cargaba una la pierde.
      personaje.lleva = rival.lleva = false;
      this.ronda++;
      this.colocarBanderas();
      // En el modo al azar, quien juega al azar cambia de algoritmo después de cada punto.
      for (const [lado, eleccion, color] of [['cpu', Bandera.rival], ['jugador', this.soloVer ? Bandera.izquierda : null, ROJO]]) {
        if (eleccion !== 'Azar') continue;
        const anterior = this[lado];
        this[lado] = Object.assign(this.nuevoRival(anterior.posicion, eleccion, color), {base: anterior.base, puntos: anterior.puntos, lleva: false, bandera: anterior.bandera});
      }
      this.cambiarMapa();
    }
  }
  choque() {
    // Al chocar, los dos vuelven a su salida, sueltan lo que cargaban, y cambian de lugar las banderas y el terreno.
    for (const p of [this.jugador, this.cpu]) {
      this.emitir('golpe', p.visual(), p.color);
      p.regresar(); p.lleva = false;
    }
    this.ronda++;
    this.colocarBanderas();
    this.cambiarMapa();
  }
  actualizar(dt) {
    if (this.soloVer) this.moverCpu(this.jugador, this.cpu, dt); else this.moverJugador(this.jugador, dt);
    this.moverCpu(this.cpu, this.jugador, dt);
    // Tras un punto en modo al azar los personajes pueden ser otros: siempre se leen de nuevo.
    for (const lado of ['jugador', 'cpu']) {
      const p = this[lado], rival = this[lado === 'cpu' ? 'jugador' : 'cpu'];
      if (!p.camino.length || p.avance === 0) this.revisar(p, rival);
    }
    const j = this.jugador, cpu = this.cpu;
    // El choque solo cuenta cuando alguien lleva una bandera: así se defiende la propia.
    if (distancia(j.visual(), cpu.visual()) < CONTACTO && (j.lleva || cpu.lleva)) this.choque();
    const ganador = [j, cpu].find(p => p.puntos === this.metaPuntos);
    if (!ganador) return;
    this.ganador = ganador;

const CELDAS_ALTO = 10, CELDAS_ANCHO = 15;      // el laberinto mide 10 x 15 celdas: un tablero de 21 x 31 casillas
const CADA_CAMBIO = 3;           // segundos entre un cambio del laberinto y el siguiente
const PASILLOS_EXTRA = 22;       // pasillos de más sobre el árbol generador: crean rutas alternativas
const MUROS_POR_CAMBIO = 8;
const CELDAS_LENTAS = 30;        // celdas con agua o bosque

class MazeRunner extends Modo {
  // Carrera para salir de un laberinto gigante que cambia cada pocos segundos. Todos corren
  // en el mismo laberinto: salen juntos de una esquina y gana quien llegue antes a la contraria.
  //
  // El laberinto es un grafo: cada celda es un vértice y cada pasillo entre dos celdas
  // vecinas una arista. Al empezar se excava un árbol generador (un solo camino entre dos
  // celdas) y se abren unos pasillos extra para que haya ciclos. En cada cambio se cierran
  // pasillos sin desconectar el grafo y se abren otros tantos.
  cargar() {
    const alto = 2 * CELDAS_ALTO + 1, ancho = 2 * CELDAS_ANCHO + 1;
    // Tablero base: las celdas y los pasillos son suelo; el borde y las esquinas entre
    // celdas son muro fijo. Los pasillos cerrados se añaden después como muros que cambian.
    const base = [];
    for (let f = 0; f < alto; f++) {
      let fila = '';
      for (let c = 0; c < ancho; c++) {
        const interior = f > 0 && f < alto - 1 && c > 0 && c < ancho - 1;
        fila += interior && (f % 2 === 1 || c % 2 === 1) ? '.' : '#';
      }
      base.push(fila);
    }
    this.usarMapa(base.join('\n'));
    // Aristas posibles: de cada celda a su vecina de la derecha y a la de abajo.
    // 'muro' es la casilla del tablero que queda entre las dos celdas.
    this.aristas = [];
    for (let i = 0; i < CELDAS_ALTO; i++) for (let j = 0; j < CELDAS_ANCHO; j++) {
      const celda = i * CELDAS_ANCHO + j;
      if (j < CELDAS_ANCHO - 1) this.aristas.push({a: celda, b: celda + 1, muro: [2 * i + 1, 2 * j + 2]});
      if (i < CELDAS_ALTO - 1) this.aristas.push({a: celda, b: celda + CELDAS_ANCHO, muro: [2 * i + 2, 2 * j + 1]});
    }
    // Árbol generador con un recorrido en profundidad aleatorio, como en la fase 1.
    this.abiertas = new Set();
    const deCelda = Array.from({length: CELDAS_ALTO * CELDAS_ANCHO}, () => []);
    this.aristas.forEach((x, k) => { deCelda[x.a].push(k); deCelda[x.b].push(k); });
    const visitadas = new Set([0]), pila = [0];
    while (pila.length) {
      const celda = pila[pila.length - 1];
      const salidas = deCelda[celda].filter(k => !visitadas.has(this.aristas[k].a === celda ? this.aristas[k].b : this.aristas[k].a));
      if (!salidas.length) { pila.pop(); continue; }
      const k = salidas[Math.floor(Math.random() * salidas.length)], destino = this.aristas[k].a === celda ? this.aristas[k].b : this.aristas[k].a;
      this.abiertas.add(k); visitadas.add(destino); pila.push(destino);
    }
    muestra(this.aristas.map((x, k) => k).filter(k => !this.abiertas.has(k)), PASILLOS_EXTRA).forEach(k => this.abiertas.add(k));
    // Agua y bosque en algunas celdas, para que el camino con menos pasos no sea siempre el más rápido.
    const celdas = [];
    for (let i = 0; i < CELDAS_ALTO; i++) for (let j = 0; j < CELDAS_ANCHO; j++) if (i + j > 1 && i + j < CELDAS_ALTO + CELDAS_ANCHO - 3) celdas.push([2 * i + 1, 2 * j + 1]);
    this.lento = muestra(celdas, CELDAS_LENTAS).map((pos, k) => ({tipo: k < CELDAS_LENTAS / 2 ? 'a' : 'b', pos}));
    const quienes = [...(this.soloVer ? [] : [['Tú', aEstrella, ROJO, VELOCIDAD_JUGADOR]]), ...RIVALES.map(r => [...r, VELOCIDAD_RIVAL])];
    this.todos = quienes.map(([nombre, algoritmo, color, velocidad]) => {
      const p = new Personaje([1, 1], color, nombre, algoritmo, velocidad);

  }
  conectado(abiertas) {

    const vecinas = new Map();
    for (const k of abiertas) {
      const x = this.aristas[k];
      for (const [de, a] of [[x.a, x.b], [x.b, x.a]]) { if (!vecinas.has(de)) vecinas.set(de, []); vecinas.get(de).push(a); }
    }
    const vistas = new Set([0]), cola = [0];
    for (let i = 0; i < cola.length; i++) for (const otra of vecinas.get(cola[i]) || []) {

  aplicar() {
    // Pone en el tablero los pasillos cerrados y el terreno lento, y hace que los rivales vuelvan a planear.
    const lista = [];
    this.aristas.forEach((x, k) => { if (!this.abiertas.has(k)) lista.push({id: k, tipo: '#', pos: x.muro}); });
    this.lento.forEach((x, k) => lista.push({id: 10000 + k, tipo: x.tipo, pos: x.pos}));
    this.ponerTerreno(lista);
    // Un rival solo vuelve a planear si el cambio le cerró el camino que llevaba. Así no
    // pierde tiempo pensando de más, pero tampoco aprovecha los atajos que se abren.
    for (const r of this.rivales) {
      const bloqueado = !r.camino.length || r.camino.some(pos => !this.transitable(pos));
      if (r.tiempoFinal === null && bloqueado) r.irA(this.cuad, r.salida);
    }
  }
  cambiarLaberinto() {
    // Casillas ocupadas por algún competidor: ahí no puede cerrarse un pasillo.
    const ocupadas = new Set();
    for (const p of this.todos) for (const pos of [p.posicion, ...p.camino.slice(0, 1)]) ocupadas.add(K([pos[0] - p.desvio[0], pos[1] - p.desvio[1]]));
    const cerradas = [];
    for (const k of muestra([...this.abiertas], this.abiertas.size)) {
      if (cerradas.length === MUROS_POR_CAMBIO) break;
      if (ocupadas.has(K(this.aristas[k].muro))) continue;
      // Un pasillo solo se cierra si el laberinto sigue conectado sin él.
      this.abiertas.delete(k);
      if (this.conectado(this.abiertas)) cerradas.push(k); else this.abiertas.add(k);
    }
    // Se abren tantos pasillos como se cerraron, elegidos entre los que ya estaban cerrados.
    const candidatas = this.aristas.map((x, k) => k).filter(k => !this.abiertas.has(k) && !cerradas.includes(k));
    muestra(candidatas, cerradas.length).forEach(k => this.abiertas.add(k));
    this.aplicar();
    this.emitir('cambio');
  }
  actualizar(dt) {
    this.reloj += dt;
    this.cambio -= dt;
    if (this.cambio <= 0) { this.cambio = CADA_CAMBIO; this.cambiarLaberinto(); }
    if (this.jugador && this.jugador.tiempoFinal === null) this.moverJugador(this.jugador, dt);
    this.rivales.forEach(r => r.avanzar(dt, this.cuad));
    for (const p of this.todos) {
      if (p.tiempoFinal !== null || !igual(p.posicion, p.salida)) continue;
      p.tiempoFinal = this.reloj; this.llegadas.push(p);
      const esJugador = p === this.jugador;
      this.emitir('meta', p.salida, p.color, {quien: p.id, esJugador});
      // El resultado se anuncia cuando llega el jugador o, si solo se mira, cuando llega el primero.
      if (esJugador || (this.soloVer && this.llegadas.length === 1)) this.cerrar();
    }
  }
  orden() {
    // Clasificación: primero quien ya salió, luego quien está más cerca de la salida.
    return this.todos.slice().sort((a, b) => (a.tiempoFinal ?? Infinity) - (b.tiempoFinal ?? Infinity) || distancia(a.visual(), a.salida) - distancia(b.visual(), b.salida));
  }
  cerrar() {
    const tabla = this.llegadas.map((p, i) => `${i + 1}. ${p.nombre} ${p.tiempoFinal.toFixed(1)} s`).join('   ');
    if (this.soloVer) return this.terminar(true, 'GANÓ ' + this.llegadas[0].nombre.toUpperCase(), tabla, this.llegadas[0].visual());
    const lugar = this.llegadas.indexOf(this.jugador) + 1;
    this.terminar(lugar === 1, lugar === 1 ? '¡ESCAPASTE PRIMERO!' : `LUGAR ${lugar}`, tabla, this.jugador.visual());
  }
  escena() {
    return {
      // Como salen de la misma casilla, cada uno se dibuja un poco corrido para que no se tapen.
      personajes: this.todos.map((p, i) => ({p, etiqueta: p.nombre, baila: p.tiempoFinal !== null,
        dx: Math.cos(i * 2 * Math.PI / this.todos.length) * 0.24, dz: Math.sin(i * 2 * Math.PI / this.todos.length) * 0.24})),
      banderas: [{pos: this.todos[0].salida, color: DORADO, marco: true}],
      ...this.vistaTerreno(), rutas: this.rivales,
    };
  }
  hud() {
    const orden = this.orden();
    return {
      tipo: 'carrera', lugar: this.jugador ? orden.indexOf(this.jugador) + 1 : null, tiempo: this.reloj,
      contador: ['CAMBIA EN', String(Math.max(0, Math.ceil(this.cambio)))],
      filas: orden.map(p => ({id: p.id, nombre: p.nombre.toUpperCase(), color: p.color, yo: p === this.jugador, listo: p.tiempoFinal !== null,
        avance: p.tiempoFinal !== null ? p.tiempoFinal.toFixed(1) + ' s' : 'A ' + Math.round(distancia(p.visual(), p.salida))})),
    };
  }

  // Cada elemento de la frontera es [clave, desempate, casilla]; la casilla lleva su g y su h.
  const primero = {pos: inicio, g: 0, h: heuristica(inicio, meta)};
  const frontera = [[...(r.clave ? r.clave(primero, 0) : [0, 0]), primero]];
  let n = 0, ruta = null;
  const foto = (tipo, texto, extra) => pasos.push(Object.assign({tipo, texto, actual: null, nuevos: [], ruta: null,
    frontera: frontera.map(x => x[2]), exploradas: orden.length}, extra));
  foto('inicio', `Se mete el inicio ${nombreDe(inicio)} a la frontera. Todavía no se ha explorado nada.`);
  while (frontera.length) {
    const actual = (r.saca === 'tope' ? frontera.pop() : frontera.shift())[2];
    if (r.entra !== 'sin padre' && explorados.has(K(actual.pos))) {
      foto('saltar', `${nombreDe(actual.pos)} ya se había explorado por otro camino. Se descarta y se saca la siguiente.`, {actual: actual.pos});
      continue;
    }
    explorados.add(K(actual.pos)); orden.push(actual.pos);
    foto('sacar', `${nombreDe(actual.pos)}: ${r.porque(actual)}`, {actual: actual.pos});
    if (igual(actual.pos, meta)) {
      ruta = reconstruir(padres, meta);
      foto('meta', `${nombreDe(actual.pos)} es la meta. La búsqueda termina aquí.`, {actual: actual.pos});
      break;
    }
    const nuevos = [];
    for (const [v, peso] of vecinos(cuad, actual.pos)) {
      const g = costos.get(K(actual.pos)) + peso;
      const entra = r.entra === 'sin padre' ? !padres.has(K(v)) : r.entra === 'sin explorar' ? !explorados.has(K(v)) : !costos.has(K(v)) || g < costos.get(K(v));
      if (!entra) continue;
      costos.set(K(v), g); padres.set(K(v), actual.pos);
      const e = {pos: v, g, h: heuristica(v, meta)};
      if (r.clave) meter(frontera, [...r.clave(e, ++n), e]); else frontera.push([0, 0, e]);
      nuevos.push(v);
    }
    foto('vecinos', nuevos.length ? `Se revisan los vecinos de ${nombreDe(actual.pos)}. Entran a la frontera: ${nuevos.map(nombreDe).join(', ')}.`
      : `Se revisan los vecinos de ${nombreDe(actual.pos)}. Ninguno entra: son muros o ya estaban anotados.`, {actual: actual.pos, nuevos});
  }
  if (ruta) foto('ruta', `Se reconstruye la ruta siguiendo los padres desde la meta hasta el inicio: ${ruta.length - 1} pasos, costo ${costoDeRuta(cuad, ruta)}.`, {ruta});
  else foto('sinRuta', 'La frontera quedó vacía sin llegar a la meta: no existe ninguna ruta.');
  return {pasos, orden, ruta};
}

const RITMOS = [['LENTA', 0.7], ['NORMAL', 0.3], ['RÁPIDA', 0.07]];      // segundos entre pasos en automático

class Aprender extends Modo {
  // No es una partida: se elige un algoritmo y un mapa, y la búsqueda se recorre paso a
  // paso. Todos los pasos se calculan al cargar; avanzar o retroceder solo cambia 'indice'.
  cargar() {
    const leccion = LECCIONES[Aprender.mapa], [nombre, , color] = RIVALES[Aprender.algoritmo];
    this.usarMapa(leccion.mapa);
    this.espera = 0;      // sin cuenta regresiva
    this.nombre = nombre; this.leccion = leccion;
    this.inicio = this.puntos.I[0]; this.meta = this.puntos.M[0];
    Object.assign(this, pasosDe(nombre, this.cuad, this.inicio, this.meta));      // pasos, orden y ruta
    // turno: en qué momento se exploró cada casilla, para saber cuáles ya van en cada paso.
    this.turno = new Map(this.orden.map((pos, i) => [K(pos), i]));
    // Resultado de los cinco algoritmos en este mapa, para compararlos al final.
    this.tabla = RIVALES.map(([otro]) => {
      const r = pasosDe(otro, this.cuad, this.inicio, this.meta);
      return {nombre: otro, exploradas: r.orden.length, pasos: r.ruta ? r.ruta.length - 1 : null, costo: r.ruta ? costoDeRuta(this.cuad, r.ruta) : null};
    });
    // Un personaje espera en el inicio y recorre la ruta cuando la búsqueda termina.
    this.caminante = new Personaje(this.inicio, color, nombre, null, VELOCIDAD_RIVAL);
    this.indice = 0; this.auto = false; this.reloj = 0; this.cambios = 0; this.festejo = false;
  }
  ir(indice) {
    // Salta al paso indicado, sin salirse de la lista.
    indice = Math.max(0, Math.min(this.pasos.length - 1, indice));
    if (indice === this.pasos.length - 1) this.auto = false;
    this.cambios++;
    if (indice === this.indice) return;
    this.indice = indice;
    this.versionTerreno++;      // la vista vuelve a pintar las casillas
    this.caminante.regresar(); this.festejo = false;
    if (this.terminado() && this.ruta) this.caminante.camino = this.ruta.slice(1);
  }
  terminado() { return this.indice === this.pasos.length - 1; }
  accion(nombre, valor) {
    // Lo que se puede pedir desde los botones del panel o desde el teclado.
    if (nombre === 'paso') this.ir(this.indice + valor);
    else if (nombre === 'ir') this.ir(valor < 0 ? this.pasos.length - 1 : valor);
    else if (nombre === 'auto') { if (this.terminado()) this.ir(0); this.auto = !this.auto; this.reloj = 0; this.cambios++; }
    else if (nombre === 'ritmo') { Aprender.ritmo = (Aprender.ritmo + 1) % RITMOS.length; this.cambios++; }
    else if (nombre === 'algoritmo' && RIVALES[valor]) { Aprender.algoritmo = valor; this.cargar(); }
    else if (nombre === 'mapa' && LECCIONES[valor]) { Aprender.mapa = valor; this.cargar(); }
  }
  teclaPropia(t) {
    // Devuelve true si la tecla era de este modo. Las flechas aquí cambian de paso en lugar de mover la cámara.
    const teclas = {arrowright: ['paso', 1], ' ': ['paso', 1], arrowleft: ['paso', -1], p: ['auto'], enter: ['auto'], v: ['ritmo'],
      home: ['ir', 0], end: ['ir', -1], r: ['ir', 0], m: ['mapa', (Aprender.mapa + 1) % LECCIONES.length]};
    const pedida = teclas[t] || (t >= '1' && t <= String(RIVALES.length) ? ['algoritmo', Number(t) - 1] : null);
    if (pedida) this.accion(...pedida);
    return !!pedida;
  }
  actualizar(dt) {
    if (this.auto) {
      this.reloj += dt;
      while (this.auto && this.reloj >= RITMOS[Aprender.ritmo][1]) { this.reloj -= RITMOS[Aprender.ritmo][1]; this.ir(this.indice + 1); }
    }
    // Al llegar a la meta, el personaje festeja con fuegos artificiales.
    if (this.caminante.avanzar(dt, this.cuad) && igual(this.caminante.posicion, this.meta) && !this.festejo) {
      this.festejo = true;
      this.emitir('meta', this.meta, this.caminante.color, {quien: this.caminante.id});
    }
  }
  marcaDe(f, c) {
    // Qué papel tiene una casilla en el paso actual, para pintarla. null: no ha sido tocada.
    const paso = this.pasos[this.indice], clave = K([f, c]), esta = pos => K(pos) === clave;
    if (paso.ruta && paso.ruta.some(esta)) return 'ruta';
    if (paso.actual && esta(paso.actual)) return 'actual';
    if (paso.nuevos.some(esta)) return 'nueva';
    if (paso.frontera.some(e => esta(e.pos))) return 'frontera';
    if (this.turno.has(clave) && this.turno.get(clave) < paso.exploradas) return 'explorada';
    return null;
  }
  escena() {
    const arboles = [];
    this.cuad.forEach((fila, f) => [...fila].forEach((s, c) => { if (s === 'b') arboles.push([f, c]); }));
    return {
      personajes: [{p: this.caminante, etiqueta: this.nombre, baila: this.festejo}],
      banderas: [{pos: this.meta, color: DORADO, marco: true}],
      letreros: [{pos: this.inicio, texto: 'INICIO', color: ROJO, alto: 2.35}, {pos: this.meta, texto: 'META', color: CARBON, alto: 1.75}],
      muros: [], arboles,
    };
  }
  hud() { return {tipo: 'aprender'}; }
}

function crearCielo(cielo) {
  // Todo lo que se ve detrás del tablero: nubes, estrellas, luna, aves, cometas y dos criaturas raras.
  const azar = (a, b) => a + Math.random() * (b - a);
  // Nubes en dos capas, suaves y translúcidas.
  vista.nubes = new THREE.Group();
  // Cada nube es una sola pieza: una bola a la que se le abultan y hunden zonas y se le
  // aplana la panza. Al no estar hecha de varias bolas encimadas, puede ser translúcida
  // sin que se le noten las uniones.
  const forma = semilla => {
    const geo = new THREE.IcosahedronGeometry(1, 2), puntos = geo.attributes.position, normales = [];
    for (let i = 0; i < puntos.count; i++) {
      const x = puntos.getX(i), y = puntos.getY(i), z = puntos.getZ(i);
      const r = 1 + 0.22 * Math.sin(x * 3.1 + semilla) * Math.cos(z * 2.7 + semilla * 2) + 0.14 * Math.sin(y * 4 + x * 2 + semilla * 3);
      puntos.setXYZ(i, x * r, (y < 0 ? y * 0.45 : y) * r, z * r);
      normales.push(x, y, z);      // normales de esfera: la luz la recorre sin marcar las caras
    }
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normales, 3));
    return geo;
  };
  const formas = [1, 2.3, 3.9, 5.2].map(forma), blanco = new THREE.MeshLambertMaterial({color: 0xFFF3EE, transparent: true, opacity: 0.5});
  // Las nubes van espaciadas para que casi no se tapen entre sí.
  for (const capa of [{y: -12, paso: 17, n: 4, tam: 1}, {y: -26, paso: 30, n: 3, tam: 2.1}]) {
    for (let i = -capa.n; i <= capa.n; i++) for (let j = -capa.n; j <= capa.n; j++) {
      const nube = new THREE.Mesh(formas[Math.floor(Math.random() * formas.length)], blanco);
      nube.scale.set(azar(4.5, 7) * capa.tam, azar(1.3, 2) * capa.tam, azar(3, 4.5) * capa.tam);
      nube.rotation.y = azar(0, Math.PI * 2);
      nube.position.set(i * capa.paso + azar(0, 7), capa.y - azar(0, 5), j * capa.paso + azar(0, 7));
      nube.userData = {v: azar(0.3, 0.7), limite: capa.n * capa.paso + 12};
      vista.nubes.add(nube);
    }
  }
  cielo.add(vista.nubes);
  // Estrellas: puntos repartidos en una esfera enorme. De día son invisibles.
  const puntos = [];
  for (let i = 0; i < 900; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1);
    puntos.push(Math.sin(b) * Math.cos(a) * 170, Math.cos(b) * 170, Math.sin(b) * Math.sin(a) * 170);
  }
  const geoEstrellas = new THREE.BufferGeometry();
  geoEstrellas.setAttribute('position', new THREE.Float32BufferAttribute(puntos, 3));
  vista.estrellas = new THREE.Points(geoEstrellas, new THREE.PointsMaterial({color: 0xffffff, size: 1.7, sizeAttenuation: false, transparent: true, opacity: 0, fog: false}));
  vista.luna = new THREE.Mesh(new THREE.IcosahedronGeometry(8, 1), new THREE.MeshBasicMaterial({color: 0xF1EEFF, fog: false}));
  cielo.add(vista.estrellas, vista.luna);
  // Bandadas de aves en formación de V, con alas que aletean.
  const oscuro = new THREE.MeshBasicMaterial({color: 0x2B1A1F});
  vista.bandadas = [0, 1, 2].map(n => {
    const bandada = new THREE.Group(), aves = [];
    for (let k = 0; k < 5; k++) {
      const ave = new THREE.Group(), fila = Math.ceil(k / 2), lado = k % 2 ? 1 : -1;
      const cuerpo = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 4), oscuro); cuerpo.rotation.z = -Math.PI / 2;
      const alas = [1, -1].map(s => { const eje = new THREE.Group(), ala = new THREE.Mesh(vista.geo.caja, oscuro); ala.scale.set(0.3, 0.04, 0.8); ala.position.z = s * 0.4; eje.add(ala); return eje; });
      ave.add(cuerpo, ...alas);
      ave.position.set(-fila * 1.3, 0, k ? lado * fila * 1.1 : 0);
      bandada.add(ave); aves.push({alas, fase: Math.random() * 6});
    }
    bandada.position.set(azar(-90, 90), azar(-7, -3), azar(-30, 30));
    cielo.add(bandada);
    return {grupo: bandada, aves, v: azar(5, 9) * (n % 2 ? -1 : 1)};
  });
  for (const b of vista.bandadas) b.grupo.rotation.y = b.v < 0 ? Math.PI : 0;
  // Cometa: una cabeza brillante y una cola que se adelgaza.
  const cometa = new THREE.Group();
  const cola = new THREE.Mesh(new THREE.ConeGeometry(0.55, 11, 6), new THREE.MeshBasicMaterial({color: 0xFFD9A8, transparent: true, opacity: 0.55, fog: false}));
  cola.rotation.z = -Math.PI / 2; cola.position.x = -5.5;      // la punta de la cola queda atrás
  cometa.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 1), new THREE.MeshBasicMaterial({color: 0xFFFBE8, fog: false})), cola);
  cometa.visible = false; cielo.add(cometa);
  vista.cometa = {grupo: cometa, vida: 0, v: new THREE.Vector3(), proximo: 6};
  // Dragón y leviatán: serpientes hechas de segmentos que siguen a la cabeza.
  const serpiente = (segmentos, color, tam, alas) => {
    const grupo = new THREE.Group(), cuerpo = [], material = new THREE.MeshLambertMaterial({color, flatShading: true});
    for (let i = 0; i < segmentos; i++) {
      const grosor = (i === 0 ? 1.25 : 1 - i / segmentos * 0.8) * tam;
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), material);
      s.scale.set(grosor * 1.25, grosor, grosor);
      // Cuernos en la cabeza y aletas a lo largo del lomo.
      const pico = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.1, 4), material);
      pico.position.set(i === 0 ? 0.3 : 0, 0.95, 0); pico.rotation.z = i === 0 ? -0.5 : 0.35;
      if (i === 0 || i % 2 === 0) s.add(pico);
      grupo.add(s); cuerpo.push(s);
    }
    const ejes = [];
    if (alas) for (const lado of [1, -1]) {
      // Ala: un triángulo grande que sale del tercer segmento.
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, -2.2, 0, lado * 4.6, 1.6, 0, lado * 3.2], 3));
      geo.computeVertexNormals();
      const eje = new THREE.Group();
      eje.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color: 0xA3202B, side: THREE.DoubleSide, flatShading: true})));
      grupo.add(eje); ejes.push({eje, lado});
    }
    grupo.visible = false; cielo.add(grupo);
    return {grupo, cuerpo, ejes, activo: false, s: 0};
  };
  vista.dragon = Object.assign(serpiente(15, 0x7A0F18, 1.0, true), {proximo: 30, paso: 1.35, v: 13});
  vista.leviatan = Object.assign(serpiente(24, 0x1F4558, 2.3, false), {proximo: 70, paso: 2.6, v: 7});
}

function decorar(modo) {
  // Adornos que no afectan al juego: flores, rocas y lámparas en salientes del borde, y
  // luciérnagas, abejas y motas flotando. Se sortean por tablero, así que ninguno queda igual.
  const azar = (a, b) => a + Math.random() * (b - a), uno = lista => lista[Math.floor(Math.random() * lista.length)];
  vista.luciernagas = []; vista.abejas = []; vista.motas = []; vista.lamparas = [];
  const esTablero = (f, c) => f >= 0 && f < modo.filas && c >= 0 && c < modo.columnas && modo.cuadBase[f][c] !== '_';
  // Cada tablero es un grupo de casillas conectadas: se encuentran con un recorrido en anchura.
  const vistas = new Set(), tableros = [];
  for (let f = 0; f < modo.filas; f++) for (let c = 0; c < modo.columnas; c++) {
    if (!esTablero(f, c) || vistas.has(K([f, c]))) continue;
    const casillas = [[f, c]]; vistas.add(K([f, c]));
    for (let i = 0; i < casillas.length; i++) for (const [df, dc] of [[-1, 0], [0, 1], [1, 0], [0, -1]]) {
      const v = [casillas[i][0] + df, casillas[i][1] + dc];
      if (esTablero(v[0], v[1]) && !vistas.has(K(v))) { vistas.add(K(v)); casillas.push(v); }
    }
    tableros.push(casillas);
  }
  const verde = material(0x5FAE48), gris = [material(0x8E9096), material(0xA6A8AE), material(0x74767C)];
  const colores = [0xFFFFFF, 0xFFE066, 0xFF8FB1, 0xC9A0FF, 0xFF9A4A];
  for (const casillas of tableros) {
    const suelo = casillas.filter(([f, c]) => modo.cuadBase[f][c] === '.'), flores = [];
    // Flores: un botón de color con su centro, en una esquina de la casilla para no estorbar.
    for (let i = 0; i < Math.min(26, Math.max(5, suelo.length / 9)); i++) {
      const [f, c] = uno(suelo), flor = new THREE.Group();
      const petalos = new THREE.Mesh(vista.geo.gema, material(uno(colores))); petalos.scale.set(0.45, 0.16, 0.45);
      const centro = new THREE.Mesh(vista.geo.marca, material(0xF2B632)); centro.position.y = 0.04;
      flor.add(petalos, centro);
      flor.position.set(mundoX(c) + uno([-0.3, 0.3]) + azar(-0.06, 0.06), 0.04, mundoZ(f) + uno([-0.3, 0.3]) + azar(-0.06, 0.06));
      vista.mapa.add(flor); flores.push(flor.position);
    }
    // Salientes: pequeños bloques de pasto pegados por fuera del borde, con una roca o una lámpara.
    const bordes = [];
    for (const [f, c] of casillas) for (const [df, dc] of [[-1, 0], [0, 1], [1, 0], [0, -1]]) if (!esTablero(f + df, c + dc)) bordes.push([f, c, df, dc]);
    const cuantas = Math.min(16, Math.max(4, Math.round(bordes.length / 7)));
    muestra(bordes, cuantas).forEach(([f, c, df, dc], n) => {
      const saliente = new THREE.Group();
      const bloque = pieza(vista.geo.caja, 0x5FAE48, 0, -0.26, 0, 0.05); bloque.scale.set(0.62, 0.52, 0.62);
      saliente.add(bloque);
      if (n % 4 === 0) {
        // Lámpara: poste y cabeza que se enciende de noche, con su mancha de luz.
        const poste = pieza(vista.geo.asta, 0x2B2B2E, 0, 0.45, 0, 0.3);
        const cabeza = new THREE.Mesh(vista.geo.caja, new THREE.MeshBasicMaterial({color: 0x8A8A8A}));
        cabeza.scale.set(0.22, 0.22, 0.22); cabeza.position.y = 0.98;
        const charco = charcoDeLuz(2.6, 0xFFC56B);
        saliente.add(poste, cabeza, charco);
        vista.lamparas.push({cabeza, charco});
      } else {
        // Rocas: de una a tres piedras, unas mucho más altas que otras.
        for (let k = 0; k < 1 + Math.floor(Math.random() * 3); k++) {
          const alto = k === 0 ? azar(0.25, 1.1) : azar(0.15, 0.4);
          const roca = pieza(vista.geo.gema, 0x8E9096, k ? azar(-0.18, 0.18) : 0, alto * 0.42, k ? azar(-0.18, 0.18) : 0, 0.07);
          roca.material = uno(gris); roca.scale.set(azar(0.9, 1.3), alto * 4.2, azar(0.9, 1.3)); roca.rotation.y = azar(0, 3);
          saliente.add(roca);
        }
      }
      saliente.position.set(mundoX(c) + dc * 0.84, 0, mundoZ(f) + df * 0.84);
      vista.mapa.add(saliente);
    });
    // Luciérnagas (de noche), abejas (de día) y motas que suben despacio.
    const minF = Math.min(...casillas.map(x => x[0])), maxF = Math.max(...casillas.map(x => x[0]));
    const minC = Math.min(...casillas.map(x => x[1])), maxC = Math.max(...casillas.map(x => x[1]));
    const punto = () => [mundoX(azar(minC, maxC)), mundoZ(azar(minF, maxF))];
    const volador = (color, tam) => { const m = new THREE.Mesh(vista.geo.marca, new THREE.MeshBasicMaterial({color, transparent: true})); m.scale.setScalar(tam); vista.mapa.add(m); return m; };
    for (let i = 0; i < Math.min(22, Math.max(5, suelo.length / 12)); i++) { const [x, z] = punto(); vista.luciernagas.push({m: volador(0xE9FF7A, 0.75), casa: [x, azar(0.5, 1.5), z], fase: azar(0, 9)}); }
    for (let i = 0; i < Math.min(8, Math.max(2, flores.length / 4)); i++) vista.abejas.push({m: volador(0xFFC400, 0.8), flor: uno(flores), fase: azar(0, 9)});
    for (let i = 0; i < Math.min(18, Math.max(5, suelo.length / 14)); i++) { const [x, z] = punto(); vista.motas.push({m: volador(0xFFFFFF, 0.42), x, z, fase: azar(0, 3), v: azar(0.18, 0.4)}); }
  }
}

const CICLO = 80;      // segundos que dura un día completo, con su noche
function ambientar(modo, dt) {
  // Lo que pasa alrededor del juego: hora del día, luces, adornos y criaturas del cielo.
  const t = vista.tiempo, azar = (a, b) => a + Math.random() * (b - a);
  const sube = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
  for (const nube of vista.nubes.children) { nube.position.x += dt * nube.userData.v; if (nube.position.x > nube.userData.limite) nube.position.x -= nube.userData.limite * 2; }

  // Ciclo de día y noche. 'noche' va de 0 (pleno día) a 1 (plena noche) y 'ocaso' marca el paso de uno a otro.
  const fase = (t / CICLO) % 1, noche = modo.siempreDia ? 0 : sube(0.44, 0.54, fase) - sube(0.9, 1, fase), ocaso = 1 - Math.abs(noche * 2 - 1);
  vista.noche = noche;
  const L = vista.luces, mezcla = (dia, deNoche) => dia + (deNoche - dia) * noche;
  // De día el sol es cálido; al atardecer se pone rojo; de noche queda una luz azul tenue.
  const colorSol = new THREE.Color(0xFFC4AE).lerp(new THREE.Color(0x8FA2FF), noche).lerp(new THREE.Color(0xFF4A2E), ocaso * 0.75);
  L.sol.color.copy(colorSol); L.solCielo.color.copy(colorSol);
  L.sol.intensity = mezcla(0.68, 0.2); L.solCielo.intensity = mezcla(0.75, 0.3);
  L.hemi.intensity = mezcla(0.3, 0.2); L.hemiCielo.intensity = mezcla(0.4, 0.22);
  L.hemi.color.setHex(0xffffff).lerp(new THREE.Color(0x8793FF), noche); L.hemiCielo.color.copy(L.hemi.color);
  L.contraste.intensity = mezcla(0.34, 0.12);
  // El cielo de la página cambia con la hora: rojo de día, morado oscuro de noche.
  if (Math.abs(noche - (vista.nochePintada ?? -1)) > 0.01) {
    vista.nochePintada = noche;
    const tono = (dia, deNoche) => '#' + new THREE.Color(dia).lerp(new THREE.Color(deNoche), noche).getHexString();
    document.body.style.background = `linear-gradient(${tono(0x5A0C14, 0x04030D)} 0%, ${tono(0xB01E27, 0x120A2B)} 38%, ${tono(0xD7282F, 0x2A1140)} 62%, ${tono(0xF47C74, 0x5C1D43)} 100%)`;
    vista.cielo.fog.color.set(0xD7282F).lerp(new THREE.Color(0x1B0D30), noche);
  }
  vista.estrellas.material.opacity = noche;
  vista.astros.disco.position.y = vista.astros.halo.position.y = 42 - noche * 110;      // el sol se pone
  vista.luna.position.set(58, -70 + noche * 112, -82);                                   // y sale la luna

  // Lámparas y linterna del jugador.
  for (const lampara of vista.lamparas) {
    lampara.cabeza.material.color.setHex(0x8A8A8A).lerp(new THREE.Color(0xFFD27A), noche);
    lampara.charco.material.opacity = noche * 0.6;
  }
  const guia = modo.jugador || (vista.libre && modo.escena().personajes.map(x => x.p).find(p => p.id === vista.libre.seguir));
  const figura = guia && vista.personajes.get(guia.id);
  vista.farol.intensity = figura ? noche * 1.2 : 0;
  if (figura) vista.farol.position.set(figura.position.x, 1.1, figura.position.z);

  // Luciérnagas de noche, abejas de día y motas a toda hora.
  for (const l of vista.luciernagas) {
    l.m.visible = noche > 0.08;
    l.m.position.set(l.casa[0] + Math.sin(t * 0.7 + l.fase) * 0.7, l.casa[1] + Math.sin(t * 1.3 + l.fase) * 0.25, l.casa[2] + Math.cos(t * 0.9 + l.fase) * 0.7);
    l.m.material.opacity = noche * (0.55 + 0.45 * Math.sin(t * 3 + l.fase * 3));      // parpadean
  }
  for (const a of vista.abejas) {
    a.m.visible = noche < 0.6;
    a.m.position.set(a.flor.x + Math.cos(t * 2.6 + a.fase) * 0.38, 0.32 + Math.sin(t * 5 + a.fase) * 0.07, a.flor.z + Math.sin(t * 2.6 + a.fase) * 0.38);
  }
  for (const mota of vista.motas) {
    const y = (t * mota.v + mota.fase) % 2.4;
    mota.m.position.set(mota.x + Math.sin(t * 0.6 + mota.fase) * 0.3, 0.1 + y, mota.z);
    mota.m.material.opacity = Math.sin(y / 2.4 * Math.PI) * 0.7;
  }

  // Aves: solo de día. Cruzan de lado a lado y al salir reaparecen por el otro extremo.
  for (const b of vista.bandadas) {
    b.grupo.visible = noche < 0.7;
    b.grupo.position.x += b.v * dt;
    if (Math.abs(b.grupo.position.x) > 95) b.grupo.position.set(-95 * Math.sign(b.v), azar(-7, -3), azar(-32, 32));
    for (const ave of b.aves) ave.alas.forEach((eje, i) => { eje.rotation.x = (i ? -1 : 1) * Math.sin(t * 9 + ave.fase) * 0.75; });
  }
  // Cometas: cada tantos segundos pasa uno a toda velocidad.
  const cometa = vista.cometa;
  if (cometa.vida > 0) {
    cometa.vida -= dt; cometa.grupo.position.addScaledVector(cometa.v, dt);
    if (cometa.vida <= 0) { cometa.grupo.visible = false; cometa.proximo = t + azar(7, 15); }
  } else if (t > cometa.proximo) {
    cometa.grupo.position.set(-95, azar(-9, -2), azar(-34, 34));
    cometa.v.set(62, azar(-2.5, 0.5), azar(-9, 9));
    cometa.grupo.rotation.y = Math.atan2(-cometa.v.z, cometa.v.x);
    cometa.vida = 3.1; cometa.grupo.visible = true;
  }
  // Dragón (aparece muy de vez en cuando) y leviatán (más raro todavía, nadando entre las nubes).
  for (const [bicho, base, ondaY, ondaZ, espera] of [[vista.dragon, -4, 1.7, 6, [95, 210]], [vista.leviatan, -15, 5.5, 4, [170, 300]]]) {
    if (!bicho.activo) {
      if (t < bicho.proximo) continue;
      Object.assign(bicho, {activo: true, s: 0, z: (Math.random() < 0.5 ? -1 : 1) * (modo.filas / 2 + azar(8, 15))});
      bicho.grupo.visible = true;
    }
    bicho.s += dt * bicho.v;
    bicho.cuerpo.forEach((segmento, i) => {
      // Cada segmento va un poco atrás del anterior sobre la misma curva ondulada.
      const u = bicho.s - i * bicho.paso;
      segmento.position.set(-100 + u, base + Math.sin(u * 0.33) * ondaY, bicho.z + Math.sin(u * 0.11) * ondaZ);
    });
    for (const {eje, lado} of bicho.ejes) { eje.position.copy(bicho.cuerpo[3].position); eje.rotation.x = lado * Math.sin(t * 5) * 0.55; }
    if (bicho.s - bicho.cuerpo.length * bicho.paso > 200) { bicho.activo = false; bicho.grupo.visible = false; bicho.proximo = t + azar(...espera); }
  }
}

function ajustarTamano() {
  vista.render.setSize(innerWidth, innerHeight);
  vista.renderCielo.setSize(innerWidth, innerHeight);
  vista.camara.aspect = innerWidth / innerHeight;
  // vista.panel es la fracción del ancho que tapa un panel a la derecha. La imagen se
  // recorre la mitad de esa franja para que el tablero quede centrado en lo que sobra.
  if (vista.panel) vista.camara.setViewOffset(innerWidth, innerHeight, vista.panel * innerWidth / 2, 0, innerWidth, innerHeight);
  else vista.camara.clearViewOffset();
  vista.camara.updateProjectionMatrix();
  if (vista.filas) encuadrar();
}
function material(color) {
  if (!vista.materiales.has(color)) vista.materiales.set(color, new THREE.MeshToonMaterial({color, gradientMap: vista.tonos, side: THREE.DoubleSide}));
  return vista.materiales.get(color);
}
function pieza(geo, color, x, y, z, grosor = 0.06, contorno = vista.contorno) {
  // Malla con contorno negro: una copia un poco más grande que solo muestra sus caras de atrás.
  const m = new THREE.Mesh(geo, material(color));
  const borde = new THREE.Mesh(geo, contorno);
  borde.scale.setScalar(1 + grosor);
  m.add(borde);
  m.castShadow = true;
  m.position.set(x, y, z);
  return m;
}
// Paso de casilla (fila, columna) a coordenadas del mundo: x hacia la derecha, z hacia la cámara.
const mundoX = c => c - (vista.columnas - 1) / 2, mundoZ = f => f - (vista.filas - 1) / 2;

function construirMapa(modo) {
  vista.version = modo.version; vista.filas = modo.filas; vista.columnas = modo.columnas;
  for (const grupo of [vista.mapa, vista.cosas]) while (grupo.children.length) grupo.remove(grupo.children[0]);
  for (const m of [vista.personajes, vista.gemas, vista.muros, vista.losas, vista.arboles]) m.clear();
  vista.banderas = []; vista.letreros = []; vista.cohetes = []; vista.pendientes = []; vista.orbita = null; vista.zoom = 1; vista.versionTerreno = -1;
  // Solo se construye el suelo: muros, árboles y agua se dibujan aparte porque van cambiando.
  for (let f = 0; f < modo.filas; f++) for (let c = 0; c < modo.columnas; c++) {
    if (modo.cuadBase[f][c] === '_') continue;      // vacío: ahí no hay tablero
    const x = mundoX(c), z = mundoZ(f);
    // Bloque negro bajo cada casilla: juntos forman la base del tablero flotante.
    const base = new THREE.Mesh(vista.geo.caja, material(PALETA.borde));
    base.scale.set(1.06, 0.55, 1.06); base.position.set(x, -0.56, z);
    vista.mapa.add(base);
    if (modo.cuadBase[f][c] === '#') {
      // Muro fijo: forma parte del tablero y no cambia durante la partida.
      const muro = pieza(vista.geo.caja, PALETA.muro, x, 0.1, z, 0.035);
      muro.scale.set(1, 0.7, 1); muro.receiveShadow = true;
      vista.mapa.add(muro);
      continue;
    }
    const losa = new THREE.Mesh(vista.geo.caja, material(PALETA.suelo[(f + c) % 2]));
    losa.scale.set(1, 0.3, 1); losa.position.set(x, -0.15, z); losa.receiveShadow = true;
    losa.userData = {f, c, tipo: '.'};
    vista.mapa.add(losa); vista.losas.set(f + ',' + c, losa);
  }
  decorar(modo);
  encuadrar();
}
function encuadrar() {
  // Aleja la cámara hasta que las cuatro esquinas del tablero caben en pantalla.
  const prueba = vista.camara.clone(), mx = vista.columnas / 2 + 0.4, mz = vista.filas / 2 + 0.4;
  prueba.clearViewOffset();
  // Con panel, el tablero debe caber en el ancho que sobra y dejar abajo sitio para la comparación.
  const ancho = 0.93 * (1 - (vista.panel || 0)), bajo = vista.panel ? -0.5 : -0.84;
  const esquinas = [[-mx, -mz], [mx, -mz], [-mx, mz], [mx, mz]];
  for (vista.distancia = 6; vista.distancia < 90; vista.distancia += 0.5) {
    prueba.position.set(0, vista.distancia * 0.86, vista.distancia * 0.52 + DESVIO);
    prueba.lookAt(0, 0, DESVIO);
    prueba.updateMatrixWorld();
    const caben = esquinas.every(([x, z]) => {
      const v = new THREE.Vector3(x, 0.7, z).project(prueba);
      return Math.abs(v.x) < ancho && v.y > bajo && v.y < 0.8;
    });
    if (caben) break;
  }
}

function etiqueta(texto, fondo, tinta = '#fff') {
  // Texto en un lienzo, usado como imagen que siempre mira a la cámara.
  const lienzo = document.createElement('canvas'); lienzo.width = 128; lienzo.height = 64;
  const g = lienzo.getContext('2d');
  g.fillStyle = '#' + fondo.toString(16).padStart(6, '0'); g.strokeStyle = '#111'; g.lineWidth = 6;
  g.beginPath(); g.roundRect ? g.roundRect(8, 8, 112, 48, 14) : g.rect(8, 8, 112, 48); g.fill(); g.stroke();
  g.font = 'italic 900 32px Arial Black, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = tinta; g.fillText(texto, 64, 34, 100);      // el texto largo se comprime para caber
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(lienzo), depthTest: false}));
  s.scale.set(0.9, 0.45, 1); s.renderOrder = 10;
  return s;
}

function crearPersonaje(dato) {
  // Muñeco de bloques: cabeza, torso, dos brazos y dos piernas. Brazos y piernas cuelgan de
  // un grupo colocado en el hombro o la cadera, para que giren desde ahí como articulaciones.
  // Cada personaje tiene su propio material de contorno, para poder iluminarlo por separado.
  const contorno = new THREE.MeshBasicMaterial({color: PALETA.contorno, side: THREE.BackSide});
  const bordes = [];
  const bloque = (ancho, alto, fondo, color, x, y, z) => {
    const m = new THREE.Mesh(vista.geo.caja, material(color));
    m.scale.set(ancho, alto, fondo); m.position.set(x, y, z); m.castShadow = true;
    // El contorno debe medir lo mismo en las piezas delgadas que en las gruesas.
    const borde = new THREE.Mesh(vista.geo.caja, contorno), g = [0.05 / ancho, 0.05 / alto, 0.05 / fondo];
    m.add(borde); bordes.push({m: borde, g});
    return m;
  };
  const articulacion = (x, y, pieza) => { const eje = new THREE.Group(); eje.position.set(x, y, 0); eje.add(pieza); return eje; };
  const oscuro = new THREE.Color(dato.p.color).multiplyScalar(0.62).getHex();
  const piernas = [-1, 1].map(lado => articulacion(lado * 0.08, 0.27, bloque(0.12, 0.27, 0.13, oscuro, 0, -0.135, 0)));
  const brazos = [1, -1].map(lado => articulacion(lado * 0.215, 0.56, bloque(0.1, 0.3, 0.11, dato.p.color, 0, -0.13, 0)));
  const cuerpo = new THREE.Group();
  cuerpo.add(bloque(0.32, 0.31, 0.18, dato.p.color, 0, 0.42, 0), bloque(0.27, 0.25, 0.25, PALETA.piel, 0, 0.71, 0),
    bloque(0.2, 0.2, 0.09, 0xffffff, 0, 0.43, -0.13), ...piernas, ...brazos);      // la mochila blanca deja ver hacia dónde mira
  cuerpo.scale.setScalar(1.25);
  const g = new THREE.Group();
  g.add(cuerpo);
  g.userData = {cuerpo, contorno, bordes, piernas, brazos, giro: 0, previo: null, brillo: 0, colorBrillo: new THREE.Color(0xffffff)};
  if (dato.etiqueta) { const e = etiqueta(dato.etiqueta, dato.p.color); e.position.y = 1.5; g.add(e); }
  // Linterna: un farolito a un costado y la mancha de luz que deja en el suelo. Solo se ve de noche.
  const farolito = new THREE.Mesh(vista.geo.caja, new THREE.MeshBasicMaterial({color: 0xFFD27A}));
  farolito.scale.set(0.13, 0.17, 0.13); farolito.position.set(0.36, 0.52, 0.12);
  const luzSuelo = charcoDeLuz(1.9, 0xFFC56B);
  g.add(farolito, luzSuelo);
  Object.assign(g.userData, {farolito, luzSuelo});
  vista.cosas.add(g);
  return g;
}
function crearArbol(pos) {
  const arbol = new THREE.Group();
  arbol.add(pieza(vista.geo.tronco, PALETA.tronco, 0, 0.15, 0), pieza(vista.geo.cono, PALETA.copa[0], 0, 0.5, 0), pieza(vista.geo.cono, PALETA.copa[1], 0, 0.78, 0));
  arbol.children[2].scale.setScalar(0.7);
  arbol.position.set(mundoX(pos[1]), 0, mundoZ(pos[0])); arbol.rotation.y = pos[0] * 1.7 + pos[1];
  arbol.userData = {fase: pos[0] * 2 + pos[1], crece: 0.01};
  vista.cosas.add(arbol);
  return arbol;
}
function crearBandera() {
  const g = new THREE.Group();
  g.add(pieza(vista.geo.asta, 0x222222, 0, 0.45, 0));
  const tela = new THREE.Mesh(vista.geo.tela, material(0xffffff)); tela.position.set(0.02, 0.74, 0); tela.castShadow = true;
  const marco = new THREE.Mesh(vista.geo.aro, material(0xffffff)); marco.rotation.x = Math.PI / 2; marco.position.y = 0.02; marco.scale.set(1.3, 1.3, 1);
  g.add(tela, marco); g.userData = {tela, marco};
  vista.cosas.add(g);
  return g;
}

function chispas(x, y, z, colores, cuantas, fuerza, esfera) {
  // Partículas low poly: tetraedros que salen disparados, giran y se encogen.
  // En esfera salen en todas direcciones, como un fuego artificial; si no, saltan desde el suelo.
  const libres = vista.particulas.filter(p => p.vida <= 0);
  for (let i = 0; i < cuantas && i < libres.length; i++) {
    const p = libres[i], a = Math.random() * Math.PI * 2, r = (0.4 + Math.random() * 0.6) * fuerza;
    p.m.material = material(colores[i % colores.length]);
    p.m.position.set(x, y, z);
    if (esfera) {
      const b = Math.acos(2 * Math.random() - 1);
      p.v.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r, Math.sin(b) * Math.sin(a) * r);
    } else p.v.set(Math.cos(a) * r, 2.5 + Math.random() * fuerza, Math.sin(a) * r);
    p.gravedad = esfera ? 3.5 : 9;
    p.giro.set(Math.random() * 9, Math.random() * 9, 0);
    p.vida = p.total = (esfera ? 0.9 : 0.7) + Math.random() * 0.5; p.m.visible = true;
  }
}
function cohete(pos, colores, grande, retraso = 0) {
  // Fuego artificial: sube desde una casilla dejando estela y estalla en el aire.
  vista.pendientes.push({t: retraso, hacer: () => vista.cohetes.push({
    x: mundoX(pos[1]) + (Math.random() - 0.5) * (grande ? 3 : 0.4), z: mundoZ(pos[0]) + (Math.random() - 0.5) * (grande ? 3 : 0.4),
    y: 0.9, v: grande ? 11 : 7.5, t: grande ? 0.6 : 0.42, colores, cuantas: grande ? 46 : 16, fuerza: grande ? 5.5 : 3})});
}

// Estilos de animación: cada algoritmo se mueve y festeja según su "personalidad".
// camina recibe la fase de la zancada (dos zancadas por casilla) y un signo que se invierte en
// cada casilla; festeja recibe el compás del baile.
// Una pose puede fijar: salto, pierna (zancada), abre (piernas separadas), brazos [izq, der]
// (giro adelante o atrás; negativo es al frente), alza [izq, der] (brazo levantado hacia el
// lado), inclina (cuerpo al frente), ladeo, gira (vueltas por segundo) y mece.
const ESTILOS = {
  // El jugador: caminata normal y baile con los brazos arriba.
  base: {
    camina: z => ({salto: Math.abs(Math.sin(z)) * 0.13, pierna: Math.sin(z) * 0.85, brazos: [-Math.sin(z) * 0.7, Math.sin(z) * 0.7]}),
    festeja: c => ({salto: Math.abs(Math.sin(c)) * 0.22, pierna: Math.sin(c) * 0.9, brazos: [Math.sin(c * 2) * 0.5, Math.sin(c * 2) * 0.5],
      alza: [2.5 + Math.sin(c * 2) * 0.5, 2.5 - Math.sin(c * 2) * 0.5], ladeo: Math.sin(c * 0.5) * 0.3, mece: Math.sin(c * 0.25) * 0.9}),
  },
  // BFS avanza por capas, parejo y ordenado: marcha de soldado, y festeja con saltos de tijera bien medidos.
  'BFS': {
    camina: z => ({salto: Math.abs(Math.sin(z)) * 0.05, pierna: Math.sin(z) * 0.6, brazos: [-Math.sin(z) * 1.1, Math.sin(z) * 1.1], alza: [0.02, 0.02]}),
    festeja: c => { const abre = (Math.sin(c) + 1) / 2; return {salto: abre * 0.2, abre: abre * 0.55, alza: [0.2 + abre * 2.6, 0.2 + abre * 2.6]}; },
  },
  // DFS se lanza de cabeza por un camino: corre inclinado con los brazos hacia atrás, y festeja girando como trompo.
  'DFS': {
    camina: z => ({salto: Math.abs(Math.sin(z)) * 0.1, pierna: Math.sin(z) * 1.15, brazos: [1.25, 1.25], alza: [0.35, 0.35], inclina: 0.5}),
    festeja: c => ({salto: Math.abs(Math.sin(c * 2)) * 0.1, alza: [1.55, 1.55], abre: 0.25, gira: 9, ladeo: Math.sin(c) * 0.12}),
  },
  // Dijkstra mide cada paso: camina de puntillas equilibrándose con los brazos, y festeja con una reverencia.
  'Dijkstra': {
    camina: z => ({salto: Math.abs(Math.sin(z)) * 0.035, pierna: Math.sin(z) * 0.45, alza: [0.95 + Math.sin(z) * 0.25, 0.95 - Math.sin(z) * 0.25], ladeo: Math.sin(z) * 0.07}),
    festeja: c => { const baja = (Math.sin(c * 0.45) + 1) / 2; return {inclina: baja * 0.95, brazos: [-baja * 1.3, 0.5 * baja], alza: [0.15, 0.7 * baja + 0.15], pierna: baja * 0.2}; },
  },
  // Voraz se abalanza hacia lo que quiere: zancadas enormes con los brazos estirados al frente, y festeja a grandes brincos.
  'Voraz': {
    camina: z => ({salto: Math.abs(Math.sin(z)) * 0.19, pierna: Math.sin(z) * 1.25, brazos: [-1.45 + Math.sin(z * 2) * 0.15, -1.45 - Math.sin(z * 2) * 0.15], alza: [0.1, 0.1], inclina: 0.3}),
    festeja: c => ({salto: Math.abs(Math.sin(c * 0.8)) * 0.5, alza: [2.9, 2.9], brazos: [Math.sin(c * 3) * 0.2, -Math.sin(c * 3) * 0.2], pierna: Math.sin(c * 0.8) * 0.25}),
  },
  // A* avanza a saltos largos, uno por casilla: sale parado con las piernas juntas, en el aire
  // las abre una al frente y otra atrás con los brazos al contrario, y cae otra vez con las dos
  // piernas juntas. Festeja con el baile del robot: cuatro poses fijas que cambia a saltos,
  // girando el cuerpo en seco entre una y otra.
  'A*': {
    camina: (z, lado) => { const aire = Math.abs(Math.sin(z / 2));      // 0 en el suelo, 1 en lo más alto del salto
      // 'lado' alterna en cada casilla: un salto va con la pierna izquierda al frente y el siguiente con la derecha.
      return {salto: aire * 0.52, pierna: lado * aire * 1.5, brazos: [-lado * aire * 2.0, lado * aire * 2.0], alza: [0.12 + aire * 0.3, 0.12 + aire * 0.3], inclina: aire * 0.3}; },
    festeja: c => {
      const tiempo = c / 4.5, n = Math.floor(tiempo) % 4, golpe = tiempo % 1 < 0.2 ? 0.16 : 0;      // un brinco al cambiar de pose
      return [
        {salto: golpe, brazos: [-1.57, 0.7], alza: [0, 0.3], mece: -1.0, inclina: 0.28, abre: 0.3},
        {salto: golpe, brazos: [0, -1.57], alza: [2.5, 0], mece: 0, ladeo: 0.38, abre: 0.45},
        {salto: golpe, brazos: [0.7, -1.57], alza: [0.3, 0], mece: 1.0, inclina: 0.28, abre: 0.3},
        {salto: golpe, brazos: [-1.57, 0], alza: [0, 2.5], mece: 0, ladeo: -0.38, abre: 0.45},
      ][n];
    },
  },
};
ESTILOS.Rojo = ESTILOS.base;

function sincronizar(modo, dt) {
  if (vista.version !== modo.version) construirMapa(modo);
  vista.tiempo += dt;
  const t = vista.tiempo, e = modo.escena(), suave = 1 - Math.exp(-dt * 12);
  // El tablero flota: sube y baja muy despacio. Las nubes se deslizan y reaparecen del otro lado.
  vista.mundo.position.y = Math.sin(t * 0.9) * 0.09;
  ambientar(modo, dt);

  // Eventos del juego: brillo de contorno, fuegos artificiales y golpes de cámara.
  for (const ev of modo.eventos.splice(0)) {
    const quien = vista.personajes.get(ev.quien), blanco = [0xffffff, 0xFFF3C4], suyo = [ev.color, 0xffffff, DORADO];
    if (quien && ev.tipo !== 'golpe') {
      // El contorno de quien tomó algo se enciende: blanco para el jugador, dorado para los rivales.
      quien.userData.brillo = 1; quien.userData.colorBrillo.set(ev.esJugador ? 0xffffff : 0xFFD21E);
    }
    if (ev.tipo === 'gema' || ev.tipo === 'robo') {
      chispas(mundoX(ev.pos[1]), 0.5, mundoZ(ev.pos[0]), [DORADO, 0xffffff], 10, 2.4, false);
      // Solo el jugador lanza un fuego artificial pequeño y blanco al tomar una gema.
      if (ev.esJugador) { cohete(ev.pos, blanco, false); if (!modo.esDemo) vista.zoom = 0.95; }
    } else if (ev.tipo === 'meta' || ev.tipo === 'punto') {
      // Cuando alguien termina o anota, salen varios fuegos artificiales de su color.
      for (let i = 0; i < 4; i++) cohete(ev.pos, ev.esJugador ? [ROJO, 0xffffff, DORADO] : suyo, true, i * 0.22);
      if (!modo.esDemo) vista.zoom = 0.86;
    } else if (ev.tipo === 'golpe') {
      chispas(mundoX(ev.pos[1]), 0.5, mundoZ(ev.pos[0]), [ev.color, 0xffffff], 16, 2.6, false);
    } else if (ev.tipo === 'cambio') {
      if (!modo.esDemo && !camaraLibre()) vista.zoom = 0.96;      // un leve golpe de cámara avisa del cambio
    } else if (ev.tipo === 'fin' && !modo.esDemo && !modo.soloVer) {
      // Evento especial: la cámara se acerca y gira alrededor de quien terminó la partida.
      vista.orbita = {foco: ev.pos, angulo: 0.6, t: 0, ganado: ev.ganado};
    }
  }
  if (modo.estado === 'jugando') vista.orbita = null;
  if (modo.estado === 'jugando' && !modo.soloVer) vista.mirando = false;
  for (const p of vista.pendientes) { p.t -= dt; if (p.t <= 0) p.hacer(); }
  vista.pendientes = vista.pendientes.filter(p => p.t > 0);

  // Suelo: cuando cambia el terreno, cada losa toma el color de lo que ahora tiene encima.
  if (vista.versionTerreno !== modo.versionTerreno) {
    vista.versionTerreno = modo.versionTerreno;
    for (const losa of vista.losas.values()) {
      const {f, c} = losa.userData, tipo = modo.cuad[f][c], par = (f + c) % 2;
      losa.userData.tipo = tipo;
      const marca = modo.marcaDe ? modo.marcaDe(f, c) : null;      // en el modo aprender, el avance de la búsqueda
      losa.material = material(marca ? PALETA.busqueda[marca][par] : tipo === 'a' ? PALETA.agua[par] : tipo === 'b' ? PALETA.bosque[par] : PALETA.suelo[par]);
    }
  }
  // El agua aparece hundiendo su losa y desaparece cuando la losa vuelve a subir.
  for (const losa of vista.losas.values()) {
    const {f, c, tipo} = losa.userData, destino = tipo === 'a' ? -0.27 + Math.sin(t * 2 + f + c) * 0.035 : -0.15;
    losa.position.y += (destino - losa.position.y) * suave * 0.5;
  }

  // Muros: cada uno se desliza hasta su posición nueva dando un saltito.
  const activos = new Set();
  for (const dato of e.muros || []) {
    activos.add(dato.id);
    let m = vista.muros.get(dato.id);
    const x = mundoX(dato.pos[1]), z = mundoZ(dato.pos[0]);
    if (!m) {
      m = pieza(vista.geo.caja, PALETA.muro, x, 0.1, z, 0.04); m.receiveShadow = true; m.scale.set(1, 0.01, 1);
      vista.cosas.add(m); vista.muros.set(dato.id, m);
    }
    const falta = Math.hypot(x - m.position.x, z - m.position.z);
    m.position.x += (x - m.position.x) * (1 - Math.exp(-dt * 7)); m.position.z += (z - m.position.z) * (1 - Math.exp(-dt * 7));
    m.position.y = 0.1 + Math.min(0.5, falta * 0.25);
    m.scale.y += (0.7 - m.scale.y) * suave * 0.5;      // al aparecer crece desde el suelo
    m.rotation.y = Math.min(0.5, falta * 0.15);
  }
  for (const [id, m] of vista.muros) if (!activos.has(id)) {
    m.scale.y -= dt * 3;                                // al desaparecer se hunde
    if (m.scale.y <= 0.02) { vista.cosas.remove(m); vista.muros.delete(id); }
  }

  // Árboles: los nuevos crecen desde el suelo; a los que sobran se los traga la tierra.
  const plantados = new Set((e.arboles || []).map(pos => pos.join(',')));
  for (const pos of e.arboles || []) if (!vista.arboles.has(pos.join(','))) vista.arboles.set(pos.join(','), crearArbol(pos));
  for (const [clave, arbol] of vista.arboles) {
    const u = arbol.userData, vivo = plantados.has(clave);
    u.crece += ((vivo ? 1 : 0) - u.crece) * (1 - Math.exp(-dt * (vivo ? 5 : 7)));
    arbol.scale.setScalar(1.3 * Math.max(0.01, u.crece));
    arbol.position.y = vivo ? 0 : -(1 - u.crece) * 0.9;            // se hunde mientras se encoge
    arbol.rotation.z = Math.sin(t * 1.6 + u.fase) * 0.035;
    if (!vivo && u.crece < 0.04) { vista.cosas.remove(arbol); vista.arboles.delete(clave); }
  }

  // Personajes: caminan con un saltito y giran hacia donde van.
  const vivos = new Set();
  for (const dato of e.personajes) {
    const p = dato.p; vivos.add(p.id);
    let g = vista.personajes.get(p.id);
    if (!g) { g = crearPersonaje(dato); vista.personajes.set(p.id, g); g.scale.setScalar(0.01); }
    const [f, c] = p.visual(), x = mundoX(c) + (dato.dx || 0), z = mundoZ(f) + (dato.dz || 0), u = g.userData;
    const paso = u.previo ? Math.abs(x - u.previo[0]) + Math.abs(z - u.previo[1]) : 0;
    if (paso > 0.0005) u.destinoGiro = Math.atan2(x - u.previo[0], z - u.previo[1]);
    if (paso > 2) g.position.set(x, 0, z);      // regresó de golpe a su salida
    u.previo = [x, z];
    if (u.destinoGiro !== undefined) {
      let d = u.destinoGiro - u.giro; d = Math.atan2(Math.sin(d), Math.cos(d));
      u.giro += d * suave;
    }
    const caminando = p.camino.length > 0 && !dato.baila && !(p.pensando > 0);
    // Globo de puntos suspensivos sobre quien está pensando.
    if (p.pensando > 0 && !u.globo) { u.globo = etiqueta('...', 0xffffff, '#111'); u.globo.position.y = 2.05; u.globo.scale.set(0.7, 0.35, 1); g.add(u.globo); }
    if (u.globo) u.globo.visible = p.pensando > 0 && !dato.baila;
    g.position.x += (x - g.position.x) * Math.min(1, suave * 2.5); g.position.z += (z - g.position.z) * Math.min(1, suave * 2.5);
    // Cada algoritmo camina y festeja a su manera: la pose sale de su estilo.
    const estilo = ESTILOS[p.nombre] || ESTILOS.base;
    let pose = {brazos: [Math.sin(t * 2 + p.id) * 0.08, -Math.sin(t * 2 + p.id) * 0.08]};      // quieto: apenas balancea los brazos
    if (dato.baila) {
      pose = estilo.festeja(t * 9 + p.id);
      u.destinoGiro = pose.mece || 0;                      // de frente a la cámara
    } else if (p.pensando > 0) {
      // Pensando la ruta: quieto, con una mano en la cabeza y meciéndose.
      pose = {brazos: [-2.5, 0], alza: [0.55, 0.12], ladeo: Math.sin(t * 7 + p.id) * 0.1};
    } else if (caminando) {
      // Casillas vecinas siempre tienen paridad distinta, así que 'lado' cambia de signo en cada casilla.
      const lado = (p.camino[0][0] + p.camino[0][1]) % 2 ? 1 : -1;
      pose = estilo.camina(p.avance * Math.PI * 2, lado);
    }
    pose = Object.assign({salto: 0, pierna: 0, abre: 0, brazos: [0, 0], alza: [0.12, 0.12], inclina: 0, ladeo: 0, gira: 0}, pose);
    g.position.y = pose.salto - (modo.cuad[Math.round(f)][Math.round(c)] === 'a' ? 0.14 : 0);
    // Cada articulación gira poco a poco hacia su ángulo, para que el cambio de pose no sea brusco.
    const mezcla = 1 - Math.exp(-dt * 18), hacia = (objeto, eje, valor) => { objeto.rotation[eje] += (valor - objeto.rotation[eje]) * mezcla; };
    u.piernas.forEach((eje, i) => { hacia(eje, 'x', i ? -pose.pierna : pose.pierna); hacia(eje, 'z', (i ? 1 : -1) * pose.abre); });
    u.brazos.forEach((eje, i) => { hacia(eje, 'x', pose.brazos[i]); hacia(eje, 'z', (i ? -1 : 1) * pose.alza[i]); });
    hacia(u.cuerpo, 'x', pose.inclina); hacia(u.cuerpo, 'z', pose.ladeo);
    // Giro sobre sí mismo, para los festejos que dan vueltas.
    u.vuelta = pose.gira ? (u.vuelta || 0) + dt * pose.gira : 0;
    g.rotation.y = u.giro + u.vuelta;
    g.scale.setScalar(g.scale.x + (1 - g.scale.x) * suave * 0.6);       // aparece creciendo
    // Brillo del contorno: pasa del color encendido al negro y se adelgaza mientras se apaga.
    u.farolito.visible = vista.noche > 0.06; u.luzSuelo.material.opacity = vista.noche * 0.55;
    u.brillo = Math.max(0, u.brillo - dt * 1.1);
    u.contorno.color.set(PALETA.contorno).lerp(u.colorBrillo, u.brillo);
    const grueso = 1 + u.brillo * 2.2;
    for (const borde of u.bordes) borde.m.scale.set(1 + borde.g[0] * grueso, 1 + borde.g[1] * grueso, 1 + borde.g[2] * grueso);
  }
  for (const [id, g] of vista.personajes) if (!vivos.has(id)) { vista.cosas.remove(g); vista.personajes.delete(id); }

  // Gemas que giran y flotan.
  const claves = new Set();
  for (const pos of e.gemas || []) {
    const clave = pos.join(','); claves.add(clave);
    let g = vista.gemas.get(clave);
    if (!g) {
      g = pieza(vista.geo.gema, DORADO, mundoX(pos[1]), 0.5, mundoZ(pos[0]), 0.09); g.userData.crece = 0.01;
      vista.cosas.add(g); vista.gemas.set(clave, g);
    }
    g.userData.crece += (1 - g.userData.crece) * suave * 0.5;
    g.scale.set(1.25 * g.userData.crece, 1.7 * g.userData.crece, 1.25 * g.userData.crece);
    g.position.y = 0.5 + Math.sin(t * 3 + pos[0]) * 0.08; g.rotation.y = t * 2;
  }
  for (const [clave, g] of vista.gemas) if (!claves.has(clave)) { vista.cosas.remove(g); vista.gemas.delete(clave); }

  // Banderas que ondean; la robada va sobre quien la carga.
  const banderas = e.banderas || [];
  banderas.forEach((dato, i) => {
    const g = vista.banderas[i] || (vista.banderas[i] = crearBandera());
    g.visible = true;
    g.position.set(mundoX(dato.pos[1]), dato.llevada ? 0.55 : 0, mundoZ(dato.pos[0]));
    g.userData.tela.material = material(dato.color); g.userData.tela.rotation.y = Math.sin(t * 5 + i) * 0.35;
    g.userData.marco.visible = !!dato.marco; g.userData.marco.material = material(dato.color);
  });
  vista.banderas.forEach((g, i) => { if (i >= banderas.length) g.visible = false; });

  // Letreros fijos sobre una casilla, como INICIO y META.
  (e.letreros || []).forEach((dato, i) => {
    let letrero = vista.letreros[i];
    if (!letrero || letrero.userData.texto !== dato.texto) {
      if (letrero) vista.cosas.remove(letrero);
      letrero = vista.letreros[i] = etiqueta(dato.texto, dato.color);
      letrero.userData.texto = dato.texto; letrero.scale.set(1.5, 0.75, 1);
      vista.cosas.add(letrero);
    }
    letrero.position.set(mundoX(dato.pos[1]), dato.alto + Math.sin(t * 2 + i) * 0.05, mundoZ(dato.pos[0]));
  });

  // Marcas de las rutas que planean los rivales.
  let n = 0;
  for (const p of e.rutas || []) for (const [f, c] of p.camino) {
    if (n >= vista.marcas.length) break;
    const m = vista.marcas[n++];
    m.visible = true; m.material = material(p.color);
    m.position.set(mundoX(c), 0.12 + Math.sin(t * 4 + f + c) * 0.03, mundoZ(f)); m.rotation.y = t * 2;
  }
  for (; n < vista.marcas.length; n++) vista.marcas[n].visible = false;

  // Faro del destino: solo se ve mientras el jugador lleva la bandera rival.
  vista.faro.visible = !!e.destino;
  if (e.destino) {
    vista.faro.position.set(mundoX(e.destino[1]), 0, mundoZ(e.destino[0]));
    vista.faro.children[0].position.y = 1.9 + Math.abs(Math.sin(t * 4)) * 0.45; vista.faro.children[0].rotation.y = t * 3;
    const latido = 1.5 + Math.sin(t * 6) * 0.35;
    vista.faro.children[1].scale.set(latido, latido, 1);
  }

  // Línea de media cancha.
  vista.linea.visible = e.lineaMedia !== undefined;
  if (vista.linea.visible) { vista.linea.position.set(mundoX(e.lineaMedia), 0.01, 0); vista.linea.scale.set(0.08, 0.03, modo.filas); }

  // Cohetes: suben dejando una estela y al agotarse estallan en esfera.
  for (const c of vista.cohetes) {
    c.y += c.v * dt; c.v -= 5 * dt; c.t -= dt;
    chispas(c.x, c.y, c.z, [0xffffff], 1, 0.4, true);
    if (c.t <= 0) chispas(c.x, c.y, c.z, c.colores, c.cuantas, c.fuerza, true);
  }
  vista.cohetes = vista.cohetes.filter(c => c.t > 0);

  // Partículas.
  for (const p of vista.particulas) {
    if (p.vida <= 0) continue;
    p.vida -= dt; p.v.y -= p.gravedad * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.05) { p.m.position.y = 0.05; p.v.y *= -0.45; p.v.x *= 0.7; p.v.z *= 0.7; }
    p.m.rotation.x += p.giro.x * dt; p.m.rotation.y += p.giro.y * dt;
    p.m.scale.setScalar(Math.max(0.01, p.vida / p.total) * 1.3);
    if (p.vida <= 0) p.m.visible = false;
  }

  moverCamara(modo, dt);
  vista.renderCielo.render(vista.cielo, vista.camara);
  vista.render.render(vista.escena, vista.camara);
}

function vistaGeneral() {
  // Posición inicial de la cámara libre: la misma inclinación que al jugar, con todo el tablero a la vista.
  vista.libre = {azimut: 0, elevacion: 1.03, zoom: 1, foco: new THREE.Vector3(0, 0, DESVIO), seguir: null};
}
const camaraLibre = () => !!modo && (modo.soloVer || vista.mirando);
function seguirSiguiente(sentido = 1) {
  // Pasa a seguir al personaje siguiente o al anterior. Entre el último y el primero
  // está la vista general, así que dando la vuelta completa se regresa a ella.
  const ids = [null, ...modo.escena().personajes.map(x => x.p.id)];
  const i = (ids.indexOf(vista.libre.seguir) + sentido + ids.length) % ids.length;
  if (ids[i] === null) return vistaGeneral();
  vista.libre.seguir = ids[i];
  vista.libre.zoom = Math.min(vista.libre.zoom, Math.max(0.3, 9 / vista.distancia));      // se acerca para ver al personaje
}
function verOtro(sentido) {
  // Tras terminar la partida, deja la cámara de celebración y pasa a mirar a los demás.
  vista.orbita = null; vista.mirando = true;
  if (!vista.libre) vistaGeneral();
  seguirSiguiente(sentido);
}
function desplazarCamara(dt) {
  // WASD o flechas mueven el punto que mira la cámara, en la dirección en que está girada.
  let adelante = 0, lado = 0;
  for (const t of pulsadas) { const d = DIRECCIONES[t]; if (d) { adelante -= d[0]; lado += d[1]; } }
  if (!adelante && !lado) return;
  const L = vista.libre, paso = vista.distancia * L.zoom * 0.9 * dt;
  L.seguir = null;      // al mover la cámara a mano se deja de seguir
  L.foco.x += (-Math.sin(L.azimut) * adelante + Math.cos(L.azimut) * lado) * paso;
  L.foco.z += (-Math.cos(L.azimut) * adelante - Math.sin(L.azimut) * lado) * paso;
}

function moverCamara(modo, dt) {
  // La cámara siempre se desliza hacia donde debe estar, nunca salta.
  const destino = new THREE.Vector3(), mira = new THREE.Vector3();
  vista.zoom += (1 - vista.zoom) * (1 - Math.exp(-dt * 3));
  if (modo.esDemo) {
    // Detrás de la portada la cámara pasea despacio alrededor del tablero.
    vista.paseo = (vista.paseo || 0) + dt * 0.12;
    const d = vista.distancia * 0.95;
    // Mirar por encima del tablero lo baja en la pantalla y deja libre la franja del título.
    mira.set(0, d * 0.15, 0);
    destino.set(Math.sin(vista.paseo) * d, d * 0.62, Math.cos(vista.paseo) * d);
  } else if (camaraLibre() && !vista.orbita) {
    // Cámara libre del espectador: gira alrededor de un punto, se acerca y se aleja,
    // y puede quedarse siguiendo a un personaje.
    const L = vista.libre, seguido = vista.personajes.get(L.seguir);
    if (seguido) L.foco.lerp(new THREE.Vector3(seguido.position.x, 0, seguido.position.z), 1 - Math.exp(-dt * 6));
    const d = vista.distancia * L.zoom;
    mira.copy(L.foco);
    destino.set(mira.x + Math.sin(L.azimut) * Math.cos(L.elevacion) * d, Math.sin(L.elevacion) * d, mira.z + Math.cos(L.azimut) * Math.cos(L.elevacion) * d);
  } else if (vista.orbita) {
    const o = vista.orbita;
    o.t += dt; o.angulo += dt * 0.55;
    mira.set(mundoX(o.foco[1]), 0.5, mundoZ(o.foco[0]));
    destino.set(mira.x + Math.sin(o.angulo) * 8.5, 5.6, mira.z + Math.cos(o.angulo) * 8.5);
    // Si ganó el jugador, los fuegos artificiales siguen saliendo mientras gira la cámara.
    if (o.ganado && Math.floor(o.t * 2.5) !== Math.floor((o.t - dt) * 2.5) && o.t < 6) cohete(o.foco, [ROJO, 0xffffff, DORADO], true);
  } else {
    // Vista normal: desde arriba e inclinada, con un leve seguimiento del jugador.
    const jugador = modo.jugador ? modo.jugador.visual() : [modo.filas / 2, modo.columnas / 2];
    // Con la cámara acercada se centra en el jugador; si no, apenas lo acompaña.
    const peso = vista.cerca ? 1 : 0.1;
    mira.set(mundoX(jugador[1]) * peso, 0, mundoZ(jugador[0]) * peso + (vista.cerca ? 0 : DESVIO));
    const d = vista.distancia * vista.zoom * (vista.cerca ? Math.max(0.3, 9 / vista.distancia) : 1);
    destino.set(mira.x, d * 0.86, mira.z + d * 0.52);
  }
  // Justo después del hipersalto la cámara llega muy rápido y luego frena.
  vista.impulso = Math.max(0, (vista.impulso || 0) - dt);
  const k = 1 - Math.exp(-dt * (vista.impulso > 0 ? 7.5 : vista.orbita ? 2.2 : 4));
  vista.pos.lerp(destino, k); vista.mira.lerp(mira, k);
  vista.camara.position.copy(vista.pos); vista.camara.lookAt(vista.mira);
}

// ---------------------------------------------------------------------------
// Interfaz estilo juego de carreras, menú, teclado y ciclo principal
// ---------------------------------------------------------------------------
let modo = null, demo = null, pantalla = 'portada', eligiendo = false;
const $ = id => document.getElementById(id);
const pulsadas = new Set();
const DIRECCIONES = {arrowup: [-1, 0], w: [-1, 0], arrowright: [0, 1], d: [0, 1], arrowdown: [1, 0], s: [1, 0], arrowleft: [0, -1], a: [0, -1]};
const hex = n => '#' + n.toString(16).padStart(6, '0');
const calmado = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lienzos = () => [vista.render.domElement, vista.renderCielo.domElement];
const desenfocar = si => lienzos().forEach(l => l.classList.toggle('borroso', si));
const animar = (pasos, opciones) => lienzos().map(l => l.animate(pasos, opciones));

function poner(elemento, html) {
  // Cambia el contenido solo si es distinto. Devuelve true cuando cambió.
  if (elemento.dataset.html === html) return false;
  elemento.innerHTML = html; elemento.dataset.html = html;
  return true;
}
function saltar(elemento) {
  // Reinicia la animación de entrada: el número nuevo aparece con un salto.
  elemento.classList.remove('salta'); void elemento.offsetWidth; elemento.classList.add('salta');
}
function reloj(segundos) {
  const m = Math.floor(segundos / 60), s = segundos - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

function actualizarInterfaz() {
  const h = modo.hud(), carrera = h.tipo === 'carrera', aprender = h.tipo === 'aprender';
  $('aprender').hidden = !aprender;
  if (aprender) pintarLeccion();
  for (const id of ['posiciones', 'contador', 'tiempo']) $(id).hidden = !carrera;
  $('lugar').hidden = !carrera || !h.lugar;      // sin jugador no hay lugar propio que mostrar
  for (const id of ['marcador', 'rivales']) $(id).hidden = carrera || aprender;
  if (carrera) {
    // Clasificación: las filas se quedan en la página y solo cambia su altura, así se ven adelantarse.
    const lista = $('posiciones');
    h.filas.forEach((fila, i) => {
      let el = lista.querySelector(`[data-id="${fila.id}"]`);
      if (!el) {
        el = document.createElement('div'); el.dataset.id = fila.id;
        el.innerHTML = `<span class="puesto carrera"></span><span class="ficha" style="background:${hex(fila.color)}"></span><span class="nombre carrera">${fila.nombre}</span><span class="avance carrera"></span>`;
        lista.appendChild(el);
      }
      el.className = 'fila' + (fila.yo ? ' yo' : '') + (fila.listo ? ' listo' : '');
      el.style.top = i * 52 + 'px';
      el.children[0].textContent = i + 1;
      if (poner(el.children[3], fila.avance)) saltar(el.children[3]);
    });
    [...lista.children].forEach(el => { if (!h.filas.some(f => String(f.id) === el.dataset.id)) el.remove(); });
    if (h.lugar && poner($('lugar'), `${h.lugar}<sup>º</sup>`)) saltar($('lugar'));
    $('lugar').classList.toggle('primero', h.lugar === 1);
    $('contador').children[0].textContent = h.contador[0];
    if (poner($('contador').children[1], h.contador[1])) saltar($('contador').children[1]);
    $('tiempo').textContent = reloj(h.tiempo);
  } else if (!aprender) {
    const [a, b] = h.lados;
    const lado = l => `<div class="lado" style="background:${hex(l.color)}"><span>${l.nombre}</span><b>${l.puntos}</b></div>`;
    if (poner($('marcador'), lado(a) + `<span class="entre">A ${h.meta}</span>` + lado(b))) { saltar($('marcador').children[0]); saltar($('marcador').children[2]); }
    // Selectores de algoritmo: con un clic, o con las teclas 1 a 6 para el lado derecho.
    poner($('rivales'), h.selectores.map(s => `<div><b class="carrera">${s.titulo}</b>` + h.opciones.map((nombre, i) =>
      `<button data-lado="${s.lado}" data-i="${i}"${nombre === s.elegido ? ' class="elegido"' : ''}>${s.lado === 'rival' ? i + 1 + '  ' : ''}${nombre.toUpperCase()}</button>`).join('') + '</div>').join(''));
  }
  // Aviso central: lo que pasa en la partida y, al mirar, a quién sigue la cámara.
  const seguido = camaraLibre() && modo.escena().personajes.find(x => x.p.id === vista.libre.seguir);
  const aviso = [h.aviso, seguido ? 'SIGUIENDO A ' + seguido.p.nombre.toUpperCase() : ''].filter(Boolean).join('   ');
  if (poner($('aviso'), aviso) && aviso) saltar($('aviso'));
  // Botón de acercar: solo cuando se juega. Flechas: al mirar, o cuando el jugador ya terminó.
  const terminado = modo.estado !== 'jugando';
  $('acercar').hidden = modo.soloVer || terminado;
  $('acercar').classList.toggle('activo', !!vista.cerca);
  $('acercar').textContent = vista.cerca ? 'ALEJAR (C)' : 'ACERCAR (C)';
  $('flechas').hidden = aprender || !(modo.soloVer || (terminado && carrera));
  // El letrero reducido va arriba (bajo el marcador, si lo hay) y el aviso se recorre
  // para quedar debajo de él en lugar de encimarse.
  const chico = !!(modo.soloVer || vista.mirando);
  $('fin').classList.toggle('chico', chico);
  $('fin').style.paddingTop = chico ? (carrera ? '12px' : '104px') : '';
  $('aviso').style.top = chico && terminado ? (carrera ? '152px' : '244px') : '';
  // Cuenta regresiva de salida.
  const cuenta = modo.espera > 0 ? String(Math.ceil(modo.espera)) : modo.tiempo - modo.salida < 0.8 ? '¡YA!' : '';
  if (poner($('cuenta'), cuenta) && cuenta) saltar($('cuenta'));
  // Cartel de final de partida.
  const fin = modo.estado !== 'jugando';
  if (fin && $('fin').hidden) {
    $('finTitulo').textContent = modo.final[0]; $('finDetalle').textContent = modo.final[1];
    $('fin').hidden = false; requestAnimationFrame(() => $('fin').classList.add('ver'));
  } else if (!fin && !$('fin').hidden) { $('fin').hidden = true; $('fin').classList.remove('ver'); }
}

function pintarLeccion() {
  // Paneles del modo aprender: selectores, código con el renglón actual resaltado, la
  // estructura de datos, la explicación del paso y, al final, la comparación entre los
  // cinco algoritmos. Solo se vuelven a escribir cuando algo cambió.
  const sello = modo.version + ':' + modo.cambios;
  if ($('leccion').dataset.sello === sello) return;
  $('leccion').dataset.sello = sello;
  const receta = RECETAS[modo.nombre], paso = modo.pasos[modo.indice];
  const limpio = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const botones = (accion, nombres, elegido, numerados) => nombres.map((n, i) =>
    `<button data-accion="${accion}" data-valor="${i}"${i === elegido ? ' class="elegido"' : ''}>${numerados ? i + 1 + ' ' : ''}${limpio(n)}</button>`).join('');
  const [desde, hasta] = receta.lineas[paso.tipo];
  const codigo = receta.codigo.map((renglon, i) => `<span${i >= desde && i <= hasta ? ' class="ahora"' : ''}>${limpio(renglon)}</span>`).join('');
  // La frontera se dibuja como un contenedor con cajas. La próxima en salir va primero:
  // en la pila es la última que entró, así que la lista se voltea.
  const esPila = receta.saca === 'tope', fila = esPila ? paso.frontera.slice().reverse() : paso.frontera, CABEN = esPila ? 6 : 12;
  const cajas = fila.slice(0, CABEN).map((e, i) => `<span class="dato${i === 0 ? ' sale' : ''}">${nombreDe(e.pos)}${receta.valor(e) ? ' <i>' + receta.valor(e) + '</i>' : ''}</span>`).join('');
  const resto = fila.length > CABEN ? `<small>y ${fila.length - CABEN} más ${esPila ? 'abajo' : 'detrás'}</small>` : fila.length ? '' : '<small>vacía</small>';
  const rotulo = (titulo, texto) => `<span class="rotulo">${titulo} <b>${texto}</b></span>`;
  const estructura = esPila
    ? `<div class="pila"><div class="vaso">${cajas}${resto}</div><div class="rotulos">
        ${rotulo('&#9664; TOPE:', 'por aquí ENTRA cada casilla nueva y de aquí SALE la siguiente. Es el único lado abierto.')}
        ${rotulo('&#9664; FONDO:', 'la primera que entró. Será la última en salir.')}</div></div>`
    : `<div class="extremos">${rotulo('&#9664; SALE', receta.clave ? 'la de menor valor' : 'por el frente')}${rotulo('ENTRA &#9664;', receta.clave ? 'y se acomoda según su valor' : 'por el final')}</div>
       <div class="tubo">${cajas}${resto}</div>`;
  $('leccion').innerHTML = `
    <div><h4>ALGORITMO</h4><div class="grupo">${botones('algoritmo', RIVALES.map(r => r[0]), Aprender.algoritmo, true)}</div></div>
    <div><h4>MAPA</h4><div class="grupo">${botones('mapa', LECCIONES.map(l => l.nombre), Aprender.mapa)}</div></div>
    <div><h4>PASO ${modo.indice + 1} DE ${modo.pasos.length}</h4><p style="min-height:4.1em">${limpio(paso.texto)}</p><small>Casillas exploradas: ${paso.exploradas}</small></div>
    <div class="grupo"><button data-accion="ir" data-valor="0">INICIO</button><button data-accion="paso" data-valor="-1">&#9664; ATRÁS</button><button data-accion="paso" data-valor="1">SIGUIENTE &#9654;</button>
      <button data-accion="ir" data-valor="-1">FINAL</button><button data-accion="auto"${modo.auto ? ' class="elegido"' : ''}>${modo.auto ? 'PAUSA' : 'AUTOMÁTICO'}</button><button data-accion="ritmo">VELOCIDAD ${RITMOS[Aprender.ritmo][0]}</button></div>
    <div><h4>CÓDIGO</h4><pre id="codigo">${codigo}</pre></div>
    <div><h4>FRONTERA: ${receta.estructura}</h4><small>${limpio(receta.regla)} La caja de borde dorado es la próxima en salir. ${paso.frontera.length} en espera.</small>${estructura}</div>
    <p>${limpio(receta.idea)}</p>
    <small>Teclas: flecha derecha o espacio avanza, flecha izquierda regresa, P automático, V velocidad, 1 a 5 algoritmo, M mapa, Fin último paso. Rueda y arrastrar mueven la cámara. Esc regresa al menú.</small>`;
  const muestra = (color, texto) => `<span><span class="muestra" style="background:${hex(color)}"></span>${texto}</span>`;
  poner($('leyenda'), [muestra(PALETA.busqueda.actual[0], 'Se está explorando'), muestra(PALETA.busqueda.nueva[0], 'Acaba de entrar a la frontera'), muestra(PALETA.busqueda.frontera[0], 'Espera en la frontera'),
    muestra(PALETA.busqueda.explorada[0], 'Ya explorada'), muestra(PALETA.busqueda.ruta[1], 'Ruta encontrada'), muestra(PALETA.suelo[0], 'Llano: costo 1'), muestra(PALETA.copa[0], 'Bosque (árbol): costo 3'),
    muestra(PALETA.agua[0], 'Agua (hundida): costo 5'), muestra(PALETA.muro, 'Muro: no se pasa')].join(''));
  // Comparación de los cinco en este mapa: se ve desde el primer paso.
  const conRuta = modo.tabla.filter(x => x.costo !== null);
  const barato = Math.min(...conRuta.map(x => x.costo)), poco = Math.min(...modo.tabla.map(x => x.exploradas));
  const nombres = lista => lista.map(x => x.nombre).join(', ');
  const celda = (valor, mejor) => `<td${mejor ? ' class="mejor"' : ''}>${valor ?? 'sin ruta'}</td>`;
  const filas = modo.tabla.map(x => `<tr${x.nombre === modo.nombre ? ' class="este"' : ''}><td>${limpio(x.nombre)}</td>${celda(x.exploradas, x.exploradas === poco)}${celda(x.pasos, false)}${celda(x.costo, x.costo === barato)}</tr>`).join('');
  const veredicto = conRuta.length ? `Ruta más barata: ${nombres(conRuta.filter(x => x.costo === barato))} (costo ${barato}). ` : 'Ninguno encontró ruta. ';
  $('resultado').innerHTML = `<div><h4>LOS CINCO EN EL MAPA ${limpio(modo.leccion.nombre.toUpperCase())}</h4>
    <table><tr><th>Algoritmo</th><th>Exploradas</th><th>Pasos</th><th>Costo</th></tr>${filas}</table></div>
    <div><h4>POR QUÉ</h4><p><b>${limpio(veredicto)}Menos exploración: ${limpio(nombres(modo.tabla.filter(x => x.exploradas === poco)))} (${poco} casillas).</b></p>
    <p style="margin-top:6px">${limpio(modo.leccion.porque)}</p></div>`;
}

function abrir(indice) {
  modo = new MODOS[indice](); pantalla = 'juego';
  $('portada').hidden = true; $('menu').hidden = true; $('hud').hidden = false; $('ayuda').hidden = false;
  $('ayuda').textContent = MODOS[indice].ayuda;
  $('posiciones').innerHTML = '';
  desenfocar(false);
  // Llegada: la cámara viene de muy lejos a toda velocidad y frena sobre el tablero.
  if (!calmado) animar([{transform: 'scale(1.7)'}, {transform: 'scale(1)'}], {duration: 520, easing: 'cubic-bezier(.1,.9,.2,1)'});
  vista.pos.set(0, 170, 150); vista.impulso = 1.1;
  vistaGeneral(); vista.mirando = false; vista.cerca = false;
  // El panel mide min(470px, 46vw) más sus márgenes; ver la regla de #leccion.
  vista.panel = modo.panelDerecho ? (Math.min(470, innerWidth * 0.46) + 28) / innerWidth : 0;
  ajustarTamano();
}
function mostrarModos() {
  modo = null; pantalla = 'modos'; pulsadas.clear();
  if (vista.panel) { vista.panel = 0; ajustarTamano(); }
  $('hud').hidden = true; $('ayuda').hidden = true; $('fin').hidden = true; $('fin').classList.remove('ver');
  $('menu').hidden = false;
  // Quitar y volver a poner la clase reinicia la animación de entrada de las cajas.
  $('menu').classList.remove('entrando', 'saliendo'); void $('menu').offsetWidth; $('menu').classList.add('entrando');
  desenfocar(true);
}
function dejarPortada() {
  if (pantalla !== 'portada') return;
  $('portada').classList.add('barrida');
  setTimeout(() => $('portada').hidden = true, calmado ? 0 : 750);
  mostrarModos();
}
function reventar(caja) {
  // La caja elegida estalla en triángulos con los colores del juego.
  const r = caja.getBoundingClientRect(), colores = ['#D7282F', '#FFFFFF', '#1B1B1E', '#FFD21E'];
  for (let i = 0; i < (calmado ? 0 : 46); i++) {
    const trozo = document.createElement('div'), lado = 10 + Math.random() * 24;
    const x = r.left + Math.random() * r.width, y = r.top + Math.random() * r.height;
    trozo.className = 'trozo';
    Object.assign(trozo.style, {left: x + 'px', top: y + 'px', width: lado + 'px', height: lado + 'px', background: colores[i % colores.length],
      clipPath: 'polygon(50% 0, 100% 100%, 0 100%)'});
    document.body.appendChild(trozo);
    // Cada trozo sale disparado desde el centro de la caja y cae girando.
    const dx = (x - (r.left + r.width / 2)) * (2.5 + Math.random() * 3), dy = (y - (r.top + r.height / 2)) * (3 + Math.random() * 4) - 120 * Math.random();
    trozo.animate([
      {transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1},
      {transform: `translate(${dx * 0.7}px, ${dy * 0.7}px) rotate(${200 + Math.random() * 300}deg) scale(1)`, opacity: 1, offset: 0.55},
      {transform: `translate(${dx}px, ${dy + 260}px) rotate(${500 + Math.random() * 400}deg) scale(.2)`, opacity: 0},
    ], {duration: 850 + Math.random() * 350, easing: 'cubic-bezier(.15,.7,.4,1)'}).onfinish = () => trozo.remove();
  }
}
function elegir(indice) {
  if (pantalla !== 'modos' || eligiendo) return;
  const caja = $('modos').children[indice];
  eligiendo = true;
  reventar(caja);
  caja.style.visibility = 'hidden';
  $('menu').classList.add('saliendo');
  hipersalto(() => { eligiendo = false; caja.style.visibility = ''; abrir(indice); });
}
function hipersalto(alLlegar) {
  // Salto a toda velocidad: rayas que salen disparadas desde el centro mientras la
  // imagen se abalanza hacia adelante, y un destello blanco al llegar.
  if (calmado) return alLlegar();
  const lienzo = $('salto'), g = lienzo.getContext('2d');
  const ancho = lienzo.width = innerWidth, alto = lienzo.height = innerHeight, cx = ancho / 2, cy = alto / 2;
  const rayas = Array.from({length: 190}, () => ({a: Math.random() * Math.PI * 2, r: 30 + Math.random() * Math.hypot(ancho, alto) * 0.45, grosor: 1 + Math.random() * 2.6, oscura: Math.random() < 0.2}));
  const DURACION = 640, inicio = performance.now();
  const empuje = animar([{transform: 'scale(1)'}, {transform: 'scale(3.6)'}], {duration: DURACION, easing: 'cubic-bezier(.75,0,1,.55)', fill: 'forwards'});
  lienzo.hidden = false; lienzo.style.opacity = 1;
  requestAnimationFrame(function paso(ahora) {
    const p = Math.min(1, (ahora - inicio) / DURACION), fuerza = p * p * p;      // empieza lento y acelera de golpe
    g.clearRect(0, 0, ancho, alto);
    g.lineCap = 'round';
    for (const raya of rayas) {
      const r1 = raya.r * (1 + fuerza * 5), largo = 6 + fuerza * raya.r * 2.6, cos = Math.cos(raya.a), sen = Math.sin(raya.a);
      g.strokeStyle = raya.oscura ? 'rgba(27,27,30,.85)' : `rgba(255,255,255,${0.3 + 0.7 * p})`;
      g.lineWidth = raya.grosor * (1 + fuerza * 2.5);
      g.beginPath(); g.moveTo(cx + cos * r1, cy + sen * r1); g.lineTo(cx + cos * (r1 + largo), cy + sen * (r1 + largo)); g.stroke();
    }
    if (p > 0.78) { g.fillStyle = `rgba(255,255,255,${(p - 0.78) / 0.22})`; g.fillRect(0, 0, ancho, alto); }
    if (p < 1) return requestAnimationFrame(paso);
    empuje.forEach(a => a.cancel());
    alLlegar();
    // El destello se desvanece ya con el tablero en pantalla.
    lienzo.animate([{opacity: 1}, {opacity: 0}], {duration: 420, easing: 'ease-out'}).onfinish = () => { lienzo.hidden = true; };
  });
}

function avanzar(dt) {
  // Un instante de juego: cuenta regresiva, lógica, escena e interfaz.
  // Sin modo elegido corre la partida de demostración, que se reinicia sola al terminar.
  if (!modo && (!demo || demo.estado !== 'jugando')) demo = new Demo();
  const activo = modo || demo;
  if (camaraLibre()) desplazarCamara(dt);
  else if (modo) { const ultima = [...pulsadas].pop(); modo.direccion = ultima ? DIRECCIONES[ultima] : null; }
  activo.tiempo += dt;
  if (activo.espera > 0) {
    // Durante la cuenta regresiva nadie se mueve, así todos salen a la vez.
    activo.espera -= dt;
    if (activo.espera <= 0) activo.salida = activo.tiempo;
  } else if (activo.estado === 'jugando' || activo.sigueTrasFinal) activo.actualizar(dt);      // las carreras siguen tras anunciar el resultado
  sincronizar(activo, dt);
  if (modo) actualizarInterfaz();
}

function iniciar() {
  $('modos').innerHTML = MODOS.map((m, i) => `<button data-i="${i}"><b>${i + 1}. ${m.titulo}</b><span>${m.resumen}</span></button>`).join('');
  $('modos').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) elegir(Number(b.dataset.i)); });
  $('portada').addEventListener('click', dejarPortada);
  $('acercar').addEventListener('click', () => { vista.cerca = !vista.cerca; });
  $('flechas').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && modo) verOtro(Number(b.dataset.sentido)); });
  $('aprender').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && modo && modo.accion) modo.accion(b.dataset.accion, Number(b.dataset.valor)); });
  $('rivales').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && modo) modo.elegir(b.dataset.lado, Number(b.dataset.i)); });
  if (typeof THREE === 'undefined') { $('sinVista').hidden = false; return; }
  try { iniciarVista(); } catch (error) { $('sinVista').hidden = false; console.error(error); return; }
  addEventListener('keydown', ev => {
    const t = ev.key.toLowerCase();
    if (pantalla === 'portada') return dejarPortada();
    if (pantalla === 'modos') { if (t >= '1' && t <= String(MODOS.length)) elegir(Number(t) - 1); return; }
    if (t === 'escape') return mostrarModos();
    // Un modo puede quedarse con sus propias teclas antes que la cámara o el movimiento.
    if (modo.teclaPropia && modo.teclaPropia(t)) return ev.preventDefault();
    if (camaraLibre() && (t === 'tab' || t === '0')) { ev.preventDefault(); return t === 'tab' ? seguirSiguiente() : vistaGeneral(); }
    // Con la partida terminada, las flechas izquierda y derecha pasan a mirar a otro competidor.
    if (modo.estado !== 'jugando' && !modo.soloVer && modo.hud().tipo === 'carrera' && (t === 'arrowleft' || t === 'arrowright')) { ev.preventDefault(); return verOtro(t === 'arrowright' ? 1 : -1); }
    if (t === 'c' && !modo.soloVer) { vista.cerca = !vista.cerca; return; }
    if (t in DIRECCIONES || t === ' ') ev.preventDefault();
    if (t in DIRECCIONES) pulsadas.add(t);
    else if (!ev.repeat) modo.tecla(t);
  });
  addEventListener('keyup', ev => pulsadas.delete(ev.key.toLowerCase()));
  addEventListener('blur', () => pulsadas.clear());
  // Ratón del espectador: la rueda acerca y aleja, y arrastrar gira la cámara.
  let arrastre = null;
  addEventListener('wheel', ev => {
    if (!camaraLibre() || ev.target.closest('#aprender')) return;      // sobre un panel, la rueda lo desplaza
    vista.libre.zoom = Math.min(1.7, Math.max(0.12, vista.libre.zoom * Math.exp(ev.deltaY * 0.0012)));
  }, {passive: true});
  vista.render.domElement.addEventListener('pointerdown', ev => { if (camaraLibre()) arrastre = [ev.clientX, ev.clientY]; });
  addEventListener('pointermove', ev => {
    if (!arrastre || !camaraLibre()) return;
    vista.libre.azimut -= (ev.clientX - arrastre[0]) * 0.006;
    // La inclinación se limita para no pasar por debajo del tablero ni quedar justo encima.
    vista.libre.elevacion = Math.min(1.5, Math.max(0.2, vista.libre.elevacion + (ev.clientY - arrastre[1]) * 0.005));
    arrastre = [ev.clientX, ev.clientY];
  });
  addEventListener('pointerup', () => { arrastre = null; });
  const cronometro = new THREE.Clock();
  (function cuadro() {
    requestAnimationFrame(cuadro);
    // Se limita dt para que una pausa de la pestaña no haga saltar a nadie.
    avanzar(Math.min(cronometro.getDelta(), 0.05));
  })();
}
if (typeof document !== 'undefined') iniciar();
</script>
</body>
</html>

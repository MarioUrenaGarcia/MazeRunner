<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MazeRunner 3D</title>
<style>
:root{
  /* Paleta institucional: cambiar aquí si se tienen los códigos oficiales. */
  --rojo:#D7282F; --rojo-oscuro:#8F1620; --blanco:#FFFFFF; --carbon:#1B1B1E; --oro:#FFD21E;
  --titular:"Arial Black","Segoe UI Black",Impact,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5A0C14 0%,#B01E27 38%,#D7282F 62%,#F47C74 100%);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--carbon)}
canvas{display:block;position:fixed;left:0;top:0;transition:filter .6s ease}
canvas.borroso{filter:blur(9px) brightness(.82)}
/* El cielo va en su propio lienzo, siempre un poco desenfocado, como fondo lejano. */
#cielo{filter:blur(3.5px)}
#cielo.borroso{filter:blur(13px) brightness(.82)}
[hidden]{display:none!important}

/* Letras de carreras: gruesas, inclinadas y con contorno negro. */
.carrera{font-family:var(--titular);font-style:italic;font-weight:900;color:var(--blanco);-webkit-text-stroke:7px var(--carbon);paint-order:stroke fill;letter-spacing:.01em;line-height:1}
#hud{position:fixed;inset:0;pointer-events:none}
#posiciones{position:absolute;left:20px;top:22px;width:300px}
.fila{position:absolute;left:0;height:46px;display:flex;align-items:center;gap:8px;transition:top .35s cubic-bezier(.2,1.3,.4,1);transform:skewX(-9deg)}
.fila .puesto{font-size:34px;width:40px;text-align:center;color:var(--oro)}
.fila .ficha{width:30px;height:30px;border-radius:50%;border:4px solid var(--carbon);box-shadow:0 0 0 3px var(--blanco)}
.fila .nombre{font-size:22px;min-width:92px}
.fila .avance{font-size:19px;color:var(--oro)}
.fila.yo .nombre{color:var(--oro)}
.fila.listo .avance{color:#7CFF8A}
#lugar{position:absolute;left:26px;bottom:74px;font-size:132px;-webkit-text-stroke-width:12px}
#lugar sup{font-size:.42em;vertical-align:top;margin-left:4px}
#lugar.primero{color:var(--oro)}
#contador{position:absolute;right:26px;top:18px;text-align:right}
#contador small{display:block;font-size:22px;color:var(--oro)}
#contador b{display:block;font-size:76px;-webkit-text-stroke-width:10px}
#tiempo{position:absolute;right:26px;top:128px;font-size:30px}
#marcador{position:absolute;left:50%;top:16px;transform:translateX(-50%) skewX(-9deg);display:flex;align-items:center;gap:14px}
#marcador .lado{display:flex;align-items:center;gap:10px;padding:6px 18px;border:5px solid var(--carbon);border-radius:14px;box-shadow:5px 5px 0 var(--carbon)}
#marcador .lado span{font-size:22px}
#marcador .lado b{font-size:56px}
#marcador .entre{font-size:30px;color:var(--oro)}
#aviso{position:absolute;left:50%;top:118px;transform:translateX(-50%) skewX(-9deg);font-size:30px;color:var(--oro);white-space:nowrap}
#cuenta{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:230px;-webkit-text-stroke-width:16px;color:var(--oro)}
.salta{animation:saltar .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes saltar{from{transform:scale(2.1);opacity:0}}
#cuenta.salta{animation:saltarCentro .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes saltarCentro{from{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
#ayuda{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:17px;-webkit-text-stroke-width:5px;pointer-events:none;white-space:pre-wrap}

.capa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#portada{cursor:pointer;justify-content:flex-start;padding-top:3.5vh}
#portada h1{font-size:clamp(30px,5.2vw,70px);margin:0;-webkit-text-stroke-width:10px}
#portada p{font-size:clamp(15px,1.8vw,22px);margin:14px 0 0;color:var(--oro);-webkit-text-stroke-width:6px}
#portada .pulsa{color:var(--blanco);animation:latir 1.3s ease-in-out infinite}
@keyframes latir{50%{transform:scale(1.08)}}
/* El texto de la portada se barre de izquierda a derecha, un renglón tras otro. */
#portada.barrida > *{animation:barrer .55s cubic-bezier(.6,0,.9,.4) forwards}
#portada.barrida > :nth-child(2){animation-delay:.08s}
#portada.barrida > :nth-child(3){animation-delay:.16s}
@keyframes barrer{to{clip-path:inset(0 0 0 100%);transform:translateX(90px);opacity:0}}
#menu h2{font-size:46px;margin:0 0 26px;-webkit-text-stroke-width:9px}
#menu p{margin:26px 0 0;font-size:19px;color:var(--oro);-webkit-text-stroke-width:5px}
#modos{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
#modos button{font:inherit;width:min(380px,86vw);text-align:left;background:var(--blanco);color:var(--carbon);border:6px solid var(--carbon);border-radius:18px;padding:16px 22px;cursor:pointer;box-shadow:8px 8px 0 var(--carbon);transform:skewX(-7deg);transition:transform .12s, box-shadow .12s, opacity .3s}
#modos button:hover,#modos button:focus-visible{transform:skewX(-7deg) translate(-3px,-3px) scale(1.03);box-shadow:12px 12px 0 var(--carbon);outline:none}
#modos b{display:block;font-family:var(--titular);font-style:italic;font-size:30px;color:var(--rojo)}
#modos span{display:block;font-size:16px;font-weight:700;margin-top:4px}
#menu.entrando #modos button{animation:entrar .5s cubic-bezier(.2,1.4,.4,1) backwards}
#menu.entrando #modos button:nth-child(2){animation-delay:.1s}
@keyframes entrar{from{opacity:0;transform:skewX(-7deg) translateY(40px) scale(.8)}}
#menu.saliendo h2,#menu.saliendo p,#menu.saliendo button{opacity:0;transition:opacity .3s}
#fin{pointer-events:none;justify-content:flex-end;padding-bottom:12vh}
#fin h3{margin:0;font-size:clamp(54px,9vw,120px);color:var(--oro);-webkit-text-stroke-width:13px;transform:translateX(-120vw) skewX(-9deg);transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
#fin p{white-space:pre-wrap;margin:10px 0 0;font-size:24px;-webkit-text-stroke-width:6px;opacity:0;transition:opacity .4s .35s}
#fin.ver h3{transform:skewX(-9deg)}
#fin.ver p{opacity:1}
.trozo{position:fixed;pointer-events:none;z-index:20}
#salto{position:fixed;inset:0;pointer-events:none;z-index:15;transition:none}
#sinVista{position:fixed;inset:auto 0 45% 0;text-align:center;font-size:22px}
@media (prefers-reduced-motion: reduce){#portada .pulsa,#menu.entrando #modos button,.salta,#cuenta.salta{animation:none}}
</style>
</head>
<body>
<div id="hud" hidden>
  <div id="posiciones"></div>
  <div id="lugar" class="carrera"></div>
  <div id="contador" class="carrera"><small></small><b></b></div>
  <div id="tiempo" class="carrera"></div>
  <div id="marcador" class="carrera"></div>
  <div id="aviso" class="carrera"></div>
  <div id="cuenta" class="carrera"></div>
</div>
<div id="ayuda" class="carrera" hidden></div>
<div id="fin" class="capa" hidden><h3 id="finTitulo" class="carrera"></h3><p id="finDetalle" class="carrera"></p><p class="carrera">ESPACIO: OTRA VEZ   ESC: MENÚ</p></div>
<div id="portada" class="capa">
  <h1 class="carrera">Proyecto Matemáticas Discretas</h1>
  <p class="carrera">MazeRunner: algoritmos de búsqueda en grafos</p>
  <p class="carrera pulsa">PRESIONA CUALQUIER TECLA</p>
</div>
<div id="menu" class="capa" hidden>
  <h2 class="carrera">ELIGE UN MODO</h2>
  <div id="modos"></div>
  <p class="carrera">CLIC O TECLAS 1 Y 2</p>
</div>
<canvas id="salto" hidden></canvas>
<div id="sinVista" class="carrera" hidden>No se pudo iniciar la vista 3D. Revisa la conexión a internet o que el navegador permita WebGL.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// LOGICA-INICIO
// ---------------------------------------------------------------------------
// Mapa y algoritmos de búsqueda: los mismos de la fase 1
// ---------------------------------------------------------------------------
const COSTOS = {'.': 1, 'b': 3, 'a': 5};

// Colores de los personajes. El jugador lleva el rojo institucional.
const ROJO = 0xD7282F, CARBON = 0x26262A, AMBAR = 0xE98A15, VIOLETA = 0x7A4FB5, DORADO = 0xF2B632, GRIS = 0x9A9A9F;

function leerMapa(texto) {
  // Devuelve la cuadrícula de terreno y un diccionario símbolo -> posiciones.
  const filas = texto.trim().split('\n').map(l => l.trim());
  const ancho = Math.max(...filas.map(f => f.length));
  const cuad = [], puntos = {};
  filas.forEach((fila, f) => {
    let terreno = '';
    [...fila.padEnd(ancho, '#')].forEach((s, c) => {
      if (s in COSTOS || s === '#' || s === '_') terreno += s;      // '_' es vacío: ahí no hay tablero
      else { (puntos[s] = puntos[s] || []).push([f, c]); terreno += '.'; }
    });
    cuad.push(terreno);
  });
  return {cuad, puntos};
}
const K = p => p[0] * 1000 + p[1];
const igual = (a, b) => a[0] === b[0] && a[1] === b[1];
const distancia = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

function vecinos(cuad, p) {
  // Casillas contiguas transitables, con el costo de entrar a cada una.
  const out = [];
  for (const [nf, nc] of [[p[0] - 1, p[1]], [p[0], p[1] + 1], [p[0] + 1, p[1]], [p[0], p[1] - 1]]) {
    if (nf >= 0 && nf < cuad.length && nc >= 0 && nc < cuad[0].length && cuad[nf][nc] in COSTOS) out.push([[nf, nc], COSTOS[cuad[nf][nc]]]);
  }
  return out;
}
function reconstruir(padres, meta) {
  const ruta = [];
  for (let x = meta; x; x = padres.get(K(x))) ruta.push(x);
  return ruta.reverse();
}
const heuristica = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

// Cola de prioridad sencilla: una lista que se mantiene ordenada por su primer valor.
function meter(cola, elemento) {
  let i = cola.length;
  while (i > 0 && (cola[i - 1][0] > elemento[0] || (cola[i - 1][0] === elemento[0] && cola[i - 1][1] > elemento[1]))) i--;
  cola.splice(i, 0, elemento);
}

function bfs(cuad, inicio, meta) {
  // Ruta con menos pasos. No toma en cuenta el costo del terreno.
  const frontera = [inicio], padres = new Map([[K(inicio), null]]);
  for (let i = 0; i < frontera.length; i++) {
    const actual = frontera[i];
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v] of vecinos(cuad, actual)) if (!padres.has(K(v))) { padres.set(K(v), actual); frontera.push(v); }
  }
  return null;
}
function voraz(cuad, inicio, meta) {
  // Avanza siempre hacia la casilla que parece más cercana a la meta.
  const frontera = [[heuristica(inicio, meta), 0, inicio]], padres = new Map([[K(inicio), null]]);
  let n = 0;
  while (frontera.length) {
    const actual = frontera.shift()[2];
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v] of vecinos(cuad, actual)) if (!padres.has(K(v))) { padres.set(K(v), actual); meter(frontera, [heuristica(v, meta), ++n, v]); }
  }
  return null;
}
function aEstrella(cuad, inicio, meta) {
  // Ruta de menor costo: combina el costo acumulado con el estimado restante.
  const h0 = heuristica(inicio, meta);
  const frontera = [[h0, h0, inicio]], costos = new Map([[K(inicio), 0]]), padres = new Map([[K(inicio), null]]), cerrados = new Set();
  while (frontera.length) {
    const actual = frontera.shift()[2];
    if (cerrados.has(K(actual))) continue;
    cerrados.add(K(actual));
    if (igual(actual, meta)) return reconstruir(padres, meta);
    for (const [v, peso] of vecinos(cuad, actual)) {
      const nuevo = costos.get(K(actual)) + peso;
      if (!costos.has(K(v)) || nuevo < costos.get(K(v))) {
        costos.set(K(v), nuevo); padres.set(K(v), actual);
        const h = heuristica(v, meta);
        meter(frontera, [nuevo + h, h, v]);
      }
    }
  }
  return null;
}
function alcanzables(cuad, inicio) {
  // Recorrido en anchura completo: todas las casillas conectadas con el inicio.
  // Sirve para comprobar que mover un muro no deja a nadie encerrado.
  const vistos = new Set([K(inicio)]), frontera = [inicio];
  for (let i = 0; i < frontera.length; i++) {
    for (const [v] of vecinos(cuad, frontera[i])) if (!vistos.has(K(v))) { vistos.add(K(v)); frontera.push(v); }
  }
  return vistos;
}
function conMuros(cuad, posiciones) {
  // Copia de la cuadrícula con muros en las posiciones dadas.
  const filas = cuad.map(fila => [...fila]);
  for (const [f, c] of posiciones) filas[f][c] = '#';
  return filas.map(fila => fila.join(''));
}
function muestra(lista, n) {
  // Elige n elementos al azar sin repetir.
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copia[i], copia[j]] = [copia[j], copia[i]]; }
  return copia.slice(0, n);
}

function terrenoAlAzar(libres, cuantos) {
  // Reparte casillas libres entre muros, bosque y agua: 'cuantos' de cada uno, en
  // manchas de dos casillas contiguas para que no queden como puntos sueltos.
  const usadas = new Set(), lista = [];
  for (const tipo of ['#', 'b', 'a']) {
    let puestos = 0;
    for (const semilla of muestra(libres, libres.length)) {
      if (puestos >= cuantos) break;
      if (usadas.has(K(semilla))) continue;
      const vecina = muestra(libres.filter(x => distancia(x, semilla) === 1 && !usadas.has(K(x))), 1);
      for (const pos of [semilla, ...vecina]) if (puestos < cuantos) { usadas.add(K(pos)); lista.push({tipo, pos}); puestos++; }
    }
  }
  return lista;
}

// Cada tipo de rival: nombre, algoritmo y color.
const RIVALES = [['BFS', bfs, AMBAR], ['Voraz', voraz, VIOLETA], ['A*', aEstrella, CARBON]];

// ---------------------------------------------------------------------------
// Piezas comunes a los dos modos
// ---------------------------------------------------------------------------
const VELOCIDAD_JUGADOR = 5.0, VELOCIDAD_RIVAL = 4.4, CONTACTO = 0.6, CUENTA_ATRAS = 3;
let siguienteId = 1, versionMapa = 0;

class Personaje {
  // Cualquiera que camina por el mapa: el jugador o un rival.
  constructor(posicion, color, nombre, algoritmo, velocidad) {
    Object.assign(this, {id: siguienteId++, posicion, base: posicion, color, nombre, algoritmo, velocidad, camino: [], avance: 0});
  }
  visual() {
    // Posición interpolada mientras camina entre dos casillas.
    const [f, c] = this.posicion;
    if (!this.camino.length) return [f, c];
    return [f + (this.camino[0][0] - f) * this.avance, c + (this.camino[0][1] - c) * this.avance];
  }
  irA(cuad, objetivo) {
    // Si va a medio paso, primero termina de llegar a la casilla siguiente.
    const origen = this.camino.length && this.avance > 0 ? this.camino[0] : this.posicion;
    const ruta = this.algoritmo(cuad, origen, objetivo);
    this.camino = (igual(origen, this.posicion) ? [] : [origen]).concat(ruta ? ruta.slice(1) : []);
  }
  avanzar(dt, cuad) {
    // Devuelve true cuando acaba de llegar a una casilla. El terreno caro se cruza más despacio.
    if (!this.camino.length) return false;
    const [f, c] = this.camino[0];
    this.avance += dt * this.velocidad / COSTOS[cuad[f][c]];
    if (this.avance < 1) return false;
    this.avance = 0;
    this.posicion = this.camino.shift();
    return true;
  }
  regresar() { this.posicion = this.base; this.camino = []; this.avance = 0; }
}

class Modo {
  // Base de los modos: mapa, terreno cambiante, movimiento del jugador y fin de partida.
  constructor() { this.tiempo = 0; this.direccion = null; this.eventos = []; this.cargar(); }
  usarMapa(texto) {
    const m = leerMapa(texto);
    this.cuadBase = m.cuad;          // tablero vacío: solo llano
    this.cuad = m.cuad.slice();      // tablero con los muros, árboles y agua del momento
    this.terreno = []; this.versionTerreno = 0;
    this.puntos = m.puntos;
    this.filas = this.cuad.length; this.columnas = this.cuad[0].length;
    this.estado = 'jugando'; this.final = ['', ''];
    this.espera = CUENTA_ATRAS;      // segundos de cuenta regresiva antes de arrancar
    this.version = ++versionMapa;    // avisa a la vista de que hay que reconstruir la escena
  }
  ponerTerreno(lista) {
    // lista: piezas de terreno como {id, tipo, pos}, con tipo '#', 'b' o 'a'.
    // El id permite a la vista deslizar cada muro hasta su lugar nuevo.
    this.terreno = lista;
    const filas = this.cuadBase.map(fila => [...fila]);
    for (const pieza of lista) filas[pieza.pos[0]][pieza.pos[1]] = pieza.tipo;
    this.cuad = filas.map(fila => fila.join(''));
    this.versionTerreno++;
  }
  vistaTerreno() {
    return {muros: this.terreno.filter(x => x.tipo === '#'), arboles: this.terreno.filter(x => x.tipo === 'b').map(x => x.pos)};
  }
  emitir(tipo, pos, color, extra) { this.eventos.push(Object.assign({tipo, pos, color}, extra)); }
  terminar(ganado, titulo, detalle, foco) {
    this.estado = ganado ? 'ganado' : 'perdido';
    this.final = [titulo, detalle || ''];
    this.emitir('fin', foco, ganado ? ROJO : GRIS, {ganado});
  }
  tecla(t) {
    if (t === 'r' || ((t === ' ' || t === 'enter') && this.estado !== 'jugando')) this.cargar();
  }
  transitable(p) { return p[0] >= 0 && p[0] < this.filas && p[1] >= 0 && p[1] < this.columnas && this.cuad[p[0]][p[1]] in COSTOS; }
  moverJugador(jugador, dt) {
    if (!jugador.camino.length && this.direccion) {
      const casilla = [jugador.posicion[0] + this.direccion[0], jugador.posicion[1] + this.direccion[1]];
      if (this.transitable(casilla)) jugador.camino = [casilla];
    }
    return jugador.avanzar(dt, this.cuad);
  }
}

// ---------------------------------------------------------------------------
// Modo 1: atrapa gemas
// ---------------------------------------------------------------------------
// Tablero de un competidor: empieza vacío. En la partida hay cuatro copias idénticas.
const MAPA_GEMAS = `
I..........
...........
...........
...........
...........
...........
...........
...........
...........`;
const PIEZAS_POR_TIPO = 6;      // muros, árboles y charcos que hay en cada tablero

class AtrapaGemas extends Modo {
  // Cada competidor corre en su propio tablero, igual a los demás, y recoge la misma
  // secuencia de gemas. Cada vez que alguien toma una gema, el terreno de su tablero
  // cambia: los muros se mueven, unos árboles crecen y a otros se los traga la tierra,
  // y el agua aparece y desaparece. Esa secuencia de terrenos también es común, así
  // que todos enfrentan exactamente lo mismo y lo único que cambia es el algoritmo.
  cargar() {
    const base = MAPA_GEMAS.trim().split('\n'), ancho = base[0].length;
    // Cuatro copias en dos filas, separadas por una franja vacía.
    const filas = [];
    for (let bloque = 0; bloque < 2; bloque++) {
      base.forEach(fila => filas.push(fila + '_' + fila));
      if (bloque === 0) filas.push('_'.repeat(2 * ancho + 1));
    }
    this.usarMapa(filas.join('\n'));
    this.total = 8;
    // Todo se sortea una vez, en coordenadas del tablero base, y vale para los cuatro.
    const local = leerMapa(MAPA_GEMAS), inicio = local.puntos.I[0], llano = [];
    local.cuad.forEach((fila, f) => [...fila].forEach((s, c) => { if (s === '.' && !igual([f, c], inicio)) llano.push([f, c]); }));
    this.secuencia = [];
    for (let previo = inicio; this.secuencia.length < this.total;) {
      // Cada gema aparece lejos de la anterior para que haya que recorrer el tablero.
      const lejos = llano.filter(x => distancia(x, previo) >= 5);
      previo = lejos[Math.floor(Math.random() * lejos.length)];
      this.secuencia.push(previo);
    }
    // etapas[k]: cómo está el terreno mientras se busca la gema k.
    this.etapas = this.secuencia.map((gema, k) => {
      const origen = k ? this.secuencia[k - 1] : inicio;
      // Nada puede caer sobre la gema ni junto al competidor, que acaba de tomar la anterior.
      const libres = llano.filter(x => distancia(x, origen) > 1 && !igual(x, gema));
      for (let intento = 0; intento < 60; intento++) {
        const piezas = terrenoAlAzar(libres, PIEZAS_POR_TIPO);
        const muros = piezas.filter(x => x.tipo === '#').map(x => x.pos);
        // Solo vale un terreno cuyos muros dejen camino hasta la gema.
        if (aEstrella(conMuros(local.cuad, muros), origen, gema)) return piezas;
      }
      return [];
    });
    const quienes = [['Tú', aEstrella, ROJO, VELOCIDAD_JUGADOR], ...RIVALES.map(r => [...r, VELOCIDAD_RIVAL])];
    this.todos = this.puntos.I.map((pos, k) => {
      const p = new Personaje(pos, quienes[k][2], quienes[k][0], quienes[k][1], quienes[k][3]);
      // El desvío traslada las coordenadas del tablero base al tablero de este competidor.
      p.desvio = [pos[0] - inicio[0], pos[1] - inicio[1]]; p.puntos = 0; p.tiempoFinal = null;
      return p;

    this.jugador = this.todos[0]; this.rivales = this.todos.slice(1);

    this.rivales.forEach(r => r.irA(this.cuad, this.gemaDe(r)));
  }
  gemaDe(p) {

    const g = this.secuencia[p.puntos];
    return g ? [g[0] + p.desvio[0], g[1] + p.desvio[1]] : null;
  }
  colocarTerreno() {
    // Cada tablero muestra el terreno de la etapa en la que va su competidor.
    const lista = [];
    this.todos.forEach((p, tablero) => {
      this.etapas[Math.min(p.puntos, this.total - 1)].forEach((x, i) => lista.push({id: tablero * 100 + i, tipo: x.tipo, pos: [x.pos[0] + p.desvio[0], x.pos[1] + p.desvio[1]]}));
    });
    this.ponerTerreno(lista);
  }
  actualizar(dt) {
    this.reloj += dt;
    this.moverJugador(this.jugador, dt);
    this.rivales.forEach(r => r.avanzar(dt, this.cuad));
    for (const p of this.todos) {
      const gema = this.gemaDe(p);
      if (!gema || distancia(p.visual(), gema) >= 0.5) continue;
      p.puntos++;

  escena() {
    return {

      personajes: this.todos.map(p => ({p, etiqueta: p.nombre, baila: p.tiempoFinal !== null})),
      gemas: this.todos.map(p => this.gemaDe(p)).filter(Boolean),

  }
  hud() {
    const orden = this.orden();
    return {
      tipo: 'carrera', lugar: orden.indexOf(this.jugador) + 1, tiempo: this.reloj,
      contador: ['GEMAS', `${this.jugador.puntos}/${this.total}`],
      filas: orden.map(p => ({id: p.id, nombre: p.nombre.toUpperCase(), color: p.color, yo: p === this.jugador, listo: p.tiempoFinal !== null,

// Modo 2: captura la bandera
// ---------------------------------------------------------------------------
// I y 3 son las salidas del jugador y de la CPU. El tablero empieza vacío.
const MAPA_BANDERA = `
.................
.................
.................
.................
.................
I...............3
.................
.................
.................
.................
.................`;
const PIEZAS_POR_LADO = 5;      // muros, árboles y charcos en cada mitad del mapa

class Bandera extends Modo {
  // Robar la bandera rival y llevarla a la propia, tres veces. Las banderas cambian de
  // lugar tras cada punto, y el terreno (muros, árboles y agua) cambia cada vez que
  // alguien toma una bandera, anota o choca. Todo se coloca en espejo, así que los dos
  // lados enfrentan lo mismo.
  cargar() {
    this.usarMapa(MAPA_BANDERA);
    this.metaPuntos = 3;
    this.jugador = new Personaje(this.puntos.I[0], ROJO, 'Tú', aEstrella, VELOCIDAD_JUGADOR);
    this.cpu = new Personaje(this.puntos['3'][0], CARBON, 'A*', aEstrella, 4.3);
    for (const p of [this.jugador, this.cpu]) { p.lleva = false; p.puntos = 0; }
    this.mitad = Math.floor(this.columnas / 2);
    // Se sortea una sola secuencia de posiciones, en la mitad del jugador. La bandera
    // de la CPU usa siempre la casilla espejo.
    const candidatas = [];
    for (let f = 0; f < this.filas; f++) for (let c = 0; c < this.mitad - 1; c++) {
      if (this.cuadBase[f][c] === '.' && distancia([f, c], this.jugador.base) >= 3) candidatas.push([f, c]);
    }
    this.secuencia = muestra(candidatas, 2 * this.metaPuntos - 1);
    this.ronda = 0;
    this.colocarBanderas();
    this.cambiarMapa();
  }
  espejo(x) { return [x[0], this.columnas - 1 - x[1]]; }
  colocarBanderas() {
    const p = this.secuencia[this.ronda % this.secuencia.length];
    this.jugador.bandera = p;
    this.cpu.bandera = this.espejo(p);
  }
  cambiarMapa() {
    // Sortea terreno nuevo en la mitad izquierda y lo repite en espejo en la derecha.
    const claves = [this.jugador.base, this.cpu.base, this.jugador.bandera, this.cpu.bandera], cerca = [];
    for (const p of [this.jugador, this.cpu]) { cerca.push(p.posicion); if (p.camino.length) cerca.push(p.camino[0]); }
    // Nada puede caer sobre una base o una bandera, ni encima o al lado de un personaje.
    const prohibida = x => claves.some(k => igual(k, x)) || cerca.some(k => distancia(k, x) <= 1);
    const libres = [];
    for (let f = 0; f < this.filas; f++) for (let c = 0; c < this.mitad; c++) {
      if (!prohibida([f, c]) && !prohibida(this.espejo([f, c]))) libres.push([f, c]);
    }
    for (let intento = 0; intento < 40; intento++) {
      const izquierda = terrenoAlAzar(libres, PIEZAS_POR_LADO);
      const lista = [...izquierda.map((x, i) => ({id: i, tipo: x.tipo, pos: x.pos})), ...izquierda.map((x, i) => ({id: i + 100, tipo: x.tipo, pos: this.espejo(x.pos)}))];
      // Se acepta solo si bases, banderas y personajes siguen conectados entre sí.
      const muros = lista.filter(x => x.tipo === '#').map(x => x.pos);
      const zona = alcanzables(conMuros(this.cuadBase, muros), this.jugador.base);
      if ([...claves, ...cerca].every(k => zona.has(K(k)))) return this.ponerTerreno(lista);
    }
  }
  objetivoCpu() {
    if (this.cpu.lleva) return this.cpu.bandera;            // ya la tiene: a casa
    if (this.jugador.lleva) return this.jugador.posicion;   // le robaron: a perseguir
    return this.jugador.bandera;                            // nada en juego: a robar
  }
  revisar(personaje, rival) {
    const esJugador = personaje === this.jugador;
    if (igual(personaje.posicion, rival.bandera) && !personaje.lleva) {
      personaje.lleva = true;
      this.emitir('robo', rival.bandera, rival.color, {quien: personaje.id, esJugador});
      this.cambiarMapa();
    } else if (igual(personaje.posicion, personaje.bandera) && personaje.lleva) {
      personaje.puntos++;
      this.emitir('punto', personaje.bandera, personaje.color, {quien: personaje.id, esJugador});
      // Tras cada punto las dos banderas saltan a la siguiente posición. Quien cargaba una la pierde.
      personaje.lleva = rival.lleva = false;
      this.ronda++;
      this.colocarBanderas();
      this.cambiarMapa();
    }
  }
  choque() {
    // Al chocar, los dos vuelven a su salida, sueltan lo que cargaban y el mapa cambia.
    for (const p of [this.jugador, this.cpu]) {
      this.emitir('golpe', p.visual(), p.color);
      p.regresar(); p.lleva = false;
    }
    this.cambiarMapa();
  }
  actualizar(dt) {
    const j = this.jugador, cpu = this.cpu;
    this.moverJugador(j, dt);
    cpu.avanzar(dt, this.cuad);
    // La CPU vuelve a planear en cada casilla: el objetivo y los muros cambian.
    if (!cpu.camino.length || cpu.avance === 0) cpu.irA(this.cuad, this.objetivoCpu());
    if (!j.camino.length || j.avance === 0) this.revisar(j, cpu);
    if (!cpu.camino.length || cpu.avance === 0) this.revisar(cpu, j);
    // El choque solo cuenta cuando alguien lleva una bandera: así se defiende la propia.
    if (distancia(j.visual(), cpu.visual()) < CONTACTO && (j.lleva || cpu.lleva)) this.choque();
    if (j.puntos === this.metaPuntos) this.terminar(true, '¡GANASTE!', `${j.puntos} A ${cpu.puntos}`, j.visual());
    else if (cpu.puntos === this.metaPuntos) this.terminar(false, 'GANÓ LA CPU', `${cpu.puntos} A ${j.puntos}`, cpu.visual());
  }
  escena() {
    const banderas = [];
    for (const [dueno, ladron] of [[this.jugador, this.cpu], [this.cpu, this.jugador]]) {
      banderas.push(ladron.lleva ? {pos: ladron.visual(), color: dueno.color, llevada: true} : {pos: dueno.bandera, color: dueno.color, marco: true});
    }
    const rutas = [this.cpu];
    let destino = null;
    if (this.jugador.lleva) {
      // Con la bandera rival en las manos se marca a dónde hay que llevarla y la ruta más corta hasta ahí.
      destino = this.jugador.bandera;
      const guia = aEstrella(this.cuad, this.jugador.camino[0] || this.jugador.posicion, destino);
      if (guia) rutas.push({color: DORADO, camino: guia.slice(1)});
    }
    return {personajes: [{p: this.cpu, etiqueta: 'A*', baila: this.estado === 'perdido'}, {p: this.jugador, etiqueta: 'Tú', baila: this.estado === 'ganado'}], banderas, ...this.vistaTerreno(), rutas, destino, lineaMedia: this.mitad};
  }
  hud() {
    return {
      tipo: 'duelo', meta: this.metaPuntos,
      lados: [{nombre: 'TÚ', color: ROJO, puntos: this.jugador.puntos}, {nombre: 'CPU A*', color: CARBON, puntos: this.cpu.puntos}],
      aviso: this.jugador.lleva && this.cpu.lleva ? '¡LLÉVALA A TU BANDERA ANTES QUE LA CPU!' : this.jugador.lleva ? '¡LLÉVALA A TU BANDERA!' : this.cpu.lleva ? '¡TE ROBARON LA BANDERA!' : '',
    };
  }
}

function pieza(geo, color, x, y, z, grosor = 0.06, contorno = vista.contorno) {

const mundoX = c => c - (vista.columnas - 1) / 2, mundoZ = f => f - (vista.filas - 1) / 2;

function construirMapa(modo) {

  for (const grupo of [vista.mapa, vista.cosas]) while (grupo.children.length) grupo.remove(grupo.children[0]);
  for (const m of [vista.personajes, vista.gemas, vista.muros, vista.losas, vista.arboles]) m.clear();

  // Solo se construye el suelo: muros, árboles y agua se dibujan aparte porque van cambiando.
  for (let f = 0; f < modo.filas; f++) for (let c = 0; c < modo.columnas; c++) {
    if (modo.cuadBase[f][c] === '_') continue;      // vacío: ahí no hay tablero
    const x = mundoX(c), z = mundoZ(f);
    // Bloque negro bajo cada casilla: juntos forman la base del tablero flotante.
    const base = new THREE.Mesh(vista.geo.caja, material(PALETA.borde));
    base.scale.set(1.06, 0.55, 1.06); base.position.set(x, -0.56, z);
    const losa = new THREE.Mesh(vista.geo.caja, material(PALETA.suelo[(f + c) % 2]));
    losa.scale.set(1, 0.3, 1); losa.position.set(x, -0.15, z); losa.receiveShadow = true;
    losa.userData = {f, c, tipo: '.'};

}
function encuadrar() {
  // Aleja la cámara hasta que las cuatro esquinas del tablero caben en pantalla.
  const prueba = vista.camara.clone(), mx = vista.columnas / 2 + 0.4, mz = vista.filas / 2 + 0.4;
  const esquinas = [[-mx, -mz], [mx, -mz], [-mx, mz], [mx, mz]];
  for (vista.distancia = 6; vista.distancia < 90; vista.distancia += 0.5) {
    prueba.position.set(0, vista.distancia * 0.86, vista.distancia * 0.52 + DESVIO);
    prueba.lookAt(0, 0, DESVIO);
    prueba.updateMatrixWorld();
    const caben = esquinas.every(([x, z]) => {
      const v = new THREE.Vector3(x, 0.7, z).project(prueba);
      return Math.abs(v.x) < 0.93 && v.y > -0.84 && v.y < 0.8;
    });
    if (caben) break;
  }
}

function etiqueta(texto, fondo) {
  // Texto en un lienzo, usado como imagen que siempre mira a la cámara.
  const lienzo = document.createElement('canvas'); lienzo.width = 128; lienzo.height = 64;
  const g = lienzo.getContext('2d');
  g.fillStyle = '#' + fondo.toString(16).padStart(6, '0'); g.strokeStyle = '#111'; g.lineWidth = 6;
  g.beginPath(); g.roundRect ? g.roundRect(8, 8, 112, 48, 14) : g.rect(8, 8, 112, 48); g.fill(); g.stroke();
  g.font = 'italic 900 32px Arial Black, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.fillText(texto, 64, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(lienzo), depthTest: false}));
  s.scale.set(0.9, 0.45, 1); s.renderOrder = 10;
  return s;
}

function crearPersonaje(dato) {
  // Muñeco de bloques: cabeza, torso, dos brazos y dos piernas. Brazos y piernas cuelgan de
  // un grupo colocado en el hombro o la cadera, para que giren desde ahí como articulaciones.
  // Cada personaje tiene su propio material de contorno, para poder iluminarlo por separado.
  const contorno = new THREE.MeshBasicMaterial({color: PALETA.contorno, side: THREE.BackSide});
  const bordes = [];
  const bloque = (ancho, alto, fondo, color, x, y, z) => {
    const m = new THREE.Mesh(vista.geo.caja, material(color));
    m.scale.set(ancho, alto, fondo); m.position.set(x, y, z); m.castShadow = true;
    // El contorno debe medir lo mismo en las piezas delgadas que en las gruesas.
    const borde = new THREE.Mesh(vista.geo.caja, contorno), g = [0.05 / ancho, 0.05 / alto, 0.05 / fondo];
    m.add(borde); bordes.push({m: borde, g});
    return m;
  };
  const articulacion = (x, y, pieza) => { const eje = new THREE.Group(); eje.position.set(x, y, 0); eje.add(pieza); return eje; };
  const oscuro = new THREE.Color(dato.p.color).multiplyScalar(0.62).getHex();
  const piernas = [-1, 1].map(lado => articulacion(lado * 0.08, 0.27, bloque(0.12, 0.27, 0.13, oscuro, 0, -0.135, 0)));
  const brazos = [1, -1].map(lado => articulacion(lado * 0.215, 0.56, bloque(0.1, 0.3, 0.11, dato.p.color, 0, -0.13, 0)));
  const cuerpo = new THREE.Group();
  cuerpo.add(bloque(0.32, 0.31, 0.18, dato.p.color, 0, 0.42, 0), bloque(0.27, 0.25, 0.25, PALETA.piel, 0, 0.71, 0),
    bloque(0.2, 0.2, 0.09, 0xffffff, 0, 0.43, -0.13), ...piernas, ...brazos);      // la mochila blanca deja ver hacia dónde mira
  cuerpo.scale.setScalar(1.25);
  const g = new THREE.Group();
  g.add(cuerpo);
  g.userData = {cuerpo, contorno, bordes, piernas, brazos, giro: 0, previo: null, brillo: 0, colorBrillo: new THREE.Color(0xffffff)};
  if (dato.etiqueta) { const e = etiqueta(dato.etiqueta, dato.p.color); e.position.y = 1.5; g.add(e); }
  vista.cosas.add(g);
  return g;
}
function crearArbol(pos) {
  const arbol = new THREE.Group();
  arbol.add(pieza(vista.geo.tronco, PALETA.tronco, 0, 0.15, 0), pieza(vista.geo.cono, PALETA.copa[0], 0, 0.5, 0), pieza(vista.geo.cono, PALETA.copa[1], 0, 0.78, 0));
  arbol.children[2].scale.setScalar(0.7);
  arbol.position.set(mundoX(pos[1]), 0, mundoZ(pos[0])); arbol.rotation.y = pos[0] * 1.7 + pos[1];
  arbol.userData = {fase: pos[0] * 2 + pos[1], crece: 0.01};
  vista.cosas.add(arbol);
  return arbol;
}
function crearBandera() {
  const g = new THREE.Group();
  g.add(pieza(vista.geo.asta, 0x222222, 0, 0.45, 0));
  const tela = new THREE.Mesh(vista.geo.tela, material(0xffffff)); tela.position.set(0.02, 0.74, 0); tela.castShadow = true;
  const marco = new THREE.Mesh(vista.geo.aro, material(0xffffff)); marco.rotation.x = Math.PI / 2; marco.position.y = 0.02; marco.scale.set(1.3, 1.3, 1);
  g.add(tela, marco); g.userData = {tela, marco};
  vista.cosas.add(g);
  return g;
}

function chispas(x, y, z, colores, cuantas, fuerza, esfera) {
  // Partículas low poly: tetraedros que salen disparados, giran y se encogen.
  // En esfera salen en todas direcciones, como un fuego artificial; si no, saltan desde el suelo.
  const libres = vista.particulas.filter(p => p.vida <= 0);
  for (let i = 0; i < cuantas && i < libres.length; i++) {
    const p = libres[i], a = Math.random() * Math.PI * 2, r = (0.4 + Math.random() * 0.6) * fuerza;
    p.m.material = material(colores[i % colores.length]);
    p.m.position.set(x, y, z);
    if (esfera) {
      const b = Math.acos(2 * Math.random() - 1);
      p.v.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r, Math.sin(b) * Math.sin(a) * r);
    } else p.v.set(Math.cos(a) * r, 2.5 + Math.random() * fuerza, Math.sin(a) * r);
    p.gravedad = esfera ? 3.5 : 9;
    p.giro.set(Math.random() * 9, Math.random() * 9, 0);
    p.vida = p.total = (esfera ? 0.9 : 0.7) + Math.random() * 0.5; p.m.visible = true;
  }
}
function cohete(pos, colores, grande, retraso = 0) {
  // Fuego artificial: sube desde una casilla dejando estela y estalla en el aire.
  vista.pendientes.push({t: retraso, hacer: () => vista.cohetes.push({
    x: mundoX(pos[1]) + (Math.random() - 0.5) * (grande ? 3 : 0.4), z: mundoZ(pos[0]) + (Math.random() - 0.5) * (grande ? 3 : 0.4),
    y: 0.9, v: grande ? 11 : 7.5, t: grande ? 0.6 : 0.42, colores, cuantas: grande ? 46 : 16, fuerza: grande ? 5.5 : 3})});
}

function sincronizar(modo, dt) {
  if (vista.version !== modo.version) construirMapa(modo);
  vista.tiempo += dt;
  const t = vista.tiempo, e = modo.escena(), suave = 1 - Math.exp(-dt * 12);
  // El tablero flota: sube y baja muy despacio. Las nubes se deslizan y reaparecen del otro lado.
  vista.mundo.position.y = Math.sin(t * 0.9) * 0.09;
  for (const nube of vista.nubes.children) { nube.position.x += dt * 0.5; if (nube.position.x > 72) nube.position.x -= 144; }

  // Eventos del juego: brillo de contorno, fuegos artificiales y golpes de cámara.
  for (const ev of modo.eventos.splice(0)) {
    const quien = vista.personajes.get(ev.quien), blanco = [0xffffff, 0xFFF3C4], suyo = [ev.color, 0xffffff, DORADO];
    if (quien && ev.tipo !== 'golpe') {
      // El contorno de quien tomó algo se enciende: blanco para el jugador, dorado para los rivales.
      quien.userData.brillo = 1; quien.userData.colorBrillo.set(ev.esJugador ? 0xffffff : 0xFFD21E);
    }
    if (ev.tipo === 'gema' || ev.tipo === 'robo') {
      chispas(mundoX(ev.pos[1]), 0.5, mundoZ(ev.pos[0]), [DORADO, 0xffffff], 10, 2.4, false);
      // Solo el jugador lanza un fuego artificial pequeño y blanco al tomar una gema.
      if (ev.esJugador) { cohete(ev.pos, blanco, false); if (!modo.esDemo) vista.zoom = 0.95; }
    } else if (ev.tipo === 'meta' || ev.tipo === 'punto') {
      // Cuando alguien termina o anota, salen varios fuegos artificiales de su color.
      for (let i = 0; i < 4; i++) cohete(ev.pos, ev.esJugador ? [ROJO, 0xffffff, DORADO] : suyo, true, i * 0.22);
      if (!modo.esDemo) vista.zoom = 0.86;
    } else if (ev.tipo === 'golpe') {
      chispas(mundoX(ev.pos[1]), 0.5, mundoZ(ev.pos[0]), [ev.color, 0xffffff], 16, 2.6, false);
    } else if (ev.tipo === 'fin' && !modo.esDemo) {
      // Evento especial: la cámara se acerca y gira alrededor de quien terminó la partida.
      vista.orbita = {foco: ev.pos, angulo: 0.6, t: 0, ganado: ev.ganado};
    }
  }
  if (modo.estado === 'jugando') vista.orbita = null;
  for (const p of vista.pendientes) { p.t -= dt; if (p.t <= 0) p.hacer(); }
  vista.pendientes = vista.pendientes.filter(p => p.t > 0);

  // Suelo: cuando cambia el terreno, cada losa toma el color de lo que ahora tiene encima.
  if (vista.versionTerreno !== modo.versionTerreno) {
    vista.versionTerreno = modo.versionTerreno;
    for (const losa of vista.losas.values()) {
      const {f, c} = losa.userData, tipo = modo.cuad[f][c], par = (f + c) % 2;
      losa.userData.tipo = tipo;
      losa.material = material(tipo === 'a' ? PALETA.agua[par] : tipo === 'b' ? PALETA.bosque[par] : PALETA.suelo[par]);
    }
  }
  // El agua aparece hundiendo su losa y desaparece cuando la losa vuelve a subir.
  for (const losa of vista.losas.values()) {
    const {f, c, tipo} = losa.userData, destino = tipo === 'a' ? -0.27 + Math.sin(t * 2 + f + c) * 0.035 : -0.15;
    losa.position.y += (destino - losa.position.y) * suave * 0.5;
  }

  // Muros: cada uno se desliza hasta su posición nueva dando un saltito.
  const activos = new Set();
  for (const dato of e.muros || []) {
    activos.add(dato.id);
    let m = vista.muros.get(dato.id);
    const x = mundoX(dato.pos[1]), z = mundoZ(dato.pos[0]);
    if (!m) {
      m = pieza(vista.geo.caja, PALETA.muro, x, 0.1, z, 0.04); m.receiveShadow = true; m.scale.set(1, 0.01, 1);
      vista.cosas.add(m); vista.muros.set(dato.id, m);
    }
    const falta = Math.hypot(x - m.position.x, z - m.position.z);
    m.position.x += (x - m.position.x) * (1 - Math.exp(-dt * 7)); m.position.z += (z - m.position.z) * (1 - Math.exp(-dt * 7));
    m.position.y = 0.1 + Math.min(0.5, falta * 0.25);
    m.scale.y += (0.7 - m.scale.y) * suave * 0.5;      // al aparecer crece desde el suelo
    m.rotation.y = Math.min(0.5, falta * 0.15);
  }
  for (const [id, m] of vista.muros) if (!activos.has(id)) {
    m.scale.y -= dt * 3;                                // al desaparecer se hunde
    if (m.scale.y <= 0.02) { vista.cosas.remove(m); vista.muros.delete(id); }
  }

  // Árboles: los nuevos crecen desde el suelo; a los que sobran se los traga la tierra.
  const plantados = new Set((e.arboles || []).map(pos => pos.join(',')));
  for (const pos of e.arboles || []) if (!vista.arboles.has(pos.join(','))) vista.arboles.set(pos.join(','), crearArbol(pos));
  for (const [clave, arbol] of vista.arboles) {
    const u = arbol.userData, vivo = plantados.has(clave);
    u.crece += ((vivo ? 1 : 0) - u.crece) * (1 - Math.exp(-dt * (vivo ? 5 : 7)));
    arbol.scale.setScalar(1.3 * Math.max(0.01, u.crece));
    arbol.position.y = vivo ? 0 : -(1 - u.crece) * 0.9;            // se hunde mientras se encoge
    arbol.rotation.z = Math.sin(t * 1.6 + u.fase) * 0.035;
    if (!vivo && u.crece < 0.04) { vista.cosas.remove(arbol); vista.arboles.delete(clave); }
  }

  // Personajes: caminan con un saltito y giran hacia donde van.
  const vivos = new Set();
  for (const dato of e.personajes) {
    const p = dato.p; vivos.add(p.id);
    let g = vista.personajes.get(p.id);
    if (!g) { g = crearPersonaje(dato); vista.personajes.set(p.id, g); g.scale.setScalar(0.01); }
    const [f, c] = p.visual(), x = mundoX(c), z = mundoZ(f), u = g.userData;
    const paso = u.previo ? Math.abs(x - u.previo[0]) + Math.abs(z - u.previo[1]) : 0;
    if (paso > 0.0005) u.destinoGiro = Math.atan2(x - u.previo[0], z - u.previo[1]);
    if (paso > 2) g.position.set(x, 0, z);      // regresó de golpe a su salida
    u.previo = [x, z];
    if (u.destinoGiro !== undefined) {
      let d = u.destinoGiro - u.giro; d = Math.atan2(Math.sin(d), Math.cos(d));
      u.giro += d * suave; g.rotation.y = u.giro;
    }
    const caminando = p.camino.length > 0 && !dato.baila;
    g.position.x += (x - g.position.x) * Math.min(1, suave * 2.5); g.position.z += (z - g.position.z) * Math.min(1, suave * 2.5);
    let salto = 0, pierna = 0, brazo = 0, alzados = 0, ladeo = 0;
    if (dato.baila) {
      // Baile de victoria: brazos arriba que se agitan, patadas alternadas, rebote y balanceo.
      const compas = t * 9 + p.id;
      salto = Math.abs(Math.sin(compas)) * 0.22; pierna = Math.sin(compas) * 0.9; brazo = Math.sin(compas * 2) * 0.5;
      alzados = 2.5; ladeo = Math.sin(compas * 0.5) * 0.3;
      u.destinoGiro = Math.sin(compas * 0.25) * 0.9;      // de frente a la cámara, girando a un lado y al otro
    } else if (caminando) {
      // Dos zancadas por casilla, y en cada una un saltito. Los brazos van al revés que las piernas.
      const zancada = p.avance * Math.PI * 2;
      salto = Math.abs(Math.sin(zancada)) * 0.13; pierna = Math.sin(zancada) * 0.85; brazo = -Math.sin(zancada) * 0.7;
    } else brazo = Math.sin(t * 2 + p.id) * 0.08;         // quieto: apenas balancea los brazos
    g.position.y = salto - (modo.cuad[Math.round(f)][Math.round(c)] === 'a' ? 0.14 : 0);
    // Cada articulación gira poco a poco hacia su ángulo, para que el cambio de pose no sea brusco.
    const mezcla = 1 - Math.exp(-dt * 18);
    u.piernas.forEach((eje, i) => { eje.rotation.x += ((i ? -pierna : pierna) - eje.rotation.x) * mezcla; });
    u.brazos.forEach((eje, i) => {
      const lado = i ? -1 : 1;
      eje.rotation.x += ((alzados ? brazo : brazo * lado) - eje.rotation.x) * mezcla;
      eje.rotation.z += (lado * (alzados ? alzados + brazo : 0.12) - eje.rotation.z) * mezcla;
    });
    u.cuerpo.rotation.z += (ladeo - u.cuerpo.rotation.z) * mezcla;
    g.scale.setScalar(g.scale.x + (1 - g.scale.x) * suave * 0.6);       // aparece creciendo
    // Brillo del contorno: pasa del color encendido al negro y se adelgaza mientras se apaga.
    u.brillo = Math.max(0, u.brillo - dt * 1.1);
    u.contorno.color.set(PALETA.contorno).lerp(u.colorBrillo, u.brillo);
    const grueso = 1 + u.brillo * 2.2;
    for (const borde of u.bordes) borde.m.scale.set(1 + borde.g[0] * grueso, 1 + borde.g[1] * grueso, 1 + borde.g[2] * grueso);
  }
  for (const [id, g] of vista.personajes) if (!vivos.has(id)) { vista.cosas.remove(g); vista.personajes.delete(id); }

  // Gemas que giran y flotan.
  const claves = new Set();
  for (const pos of e.gemas || []) {
    const clave = pos.join(','); claves.add(clave);
    let g = vista.gemas.get(clave);
    if (!g) {
      g = pieza(vista.geo.gema, DORADO, mundoX(pos[1]), 0.5, mundoZ(pos[0]), 0.09); g.userData.crece = 0.01;
      vista.cosas.add(g); vista.gemas.set(clave, g);
    }
    g.userData.crece += (1 - g.userData.crece) * suave * 0.5;
    g.scale.set(1.25 * g.userData.crece, 1.7 * g.userData.crece, 1.25 * g.userData.crece);
    g.position.y = 0.5 + Math.sin(t * 3 + pos[0]) * 0.08; g.rotation.y = t * 2;
  }
  for (const [clave, g] of vista.gemas) if (!claves.has(clave)) { vista.cosas.remove(g); vista.gemas.delete(clave); }

  // Banderas que ondean; la robada va sobre quien la carga.
  const banderas = e.banderas || [];
  banderas.forEach((dato, i) => {
    const g = vista.banderas[i] || (vista.banderas[i] = crearBandera());
    g.visible = true;
    g.position.set(mundoX(dato.pos[1]), dato.llevada ? 0.55 : 0, mundoZ(dato.pos[0]));
    g.userData.tela.material = material(dato.color); g.userData.tela.rotation.y = Math.sin(t * 5 + i) * 0.35;
    g.userData.marco.visible = !!dato.marco; g.userData.marco.material = material(dato.color);
  });
  vista.banderas.forEach((g, i) => { if (i >= banderas.length) g.visible = false; });

  // Marcas de las rutas que planean los rivales.
  let n = 0;
  for (const p of e.rutas || []) for (const [f, c] of p.camino) {
    if (n >= vista.marcas.length) break;
    const m = vista.marcas[n++];
    m.visible = true; m.material = material(p.color);
    m.position.set(mundoX(c), 0.12 + Math.sin(t * 4 + f + c) * 0.03, mundoZ(f)); m.rotation.y = t * 2;
  }
  for (; n < vista.marcas.length; n++) vista.marcas[n].visible = false;

  // Faro del destino: solo se ve mientras el jugador lleva la bandera rival.
  vista.faro.visible = !!e.destino;
  if (e.destino) {
    vista.faro.position.set(mundoX(e.destino[1]), 0, mundoZ(e.destino[0]));
    vista.faro.children[0].position.y = 1.9 + Math.abs(Math.sin(t * 4)) * 0.45; vista.faro.children[0].rotation.y = t * 3;
    const latido = 1.5 + Math.sin(t * 6) * 0.35;
    vista.faro.children[1].scale.set(latido, latido, 1);
  }

  // Línea de media cancha.
  vista.linea.visible = e.lineaMedia !== undefined;
  if (vista.linea.visible) { vista.linea.position.set(mundoX(e.lineaMedia), 0.01, 0); vista.linea.scale.set(0.08, 0.03, modo.filas); }

  // Cohetes: suben dejando una estela y al agotarse estallan en esfera.
  for (const c of vista.cohetes) {
    c.y += c.v * dt; c.v -= 5 * dt; c.t -= dt;
    chispas(c.x, c.y, c.z, [0xffffff], 1, 0.4, true);
    if (c.t <= 0) chispas(c.x, c.y, c.z, c.colores, c.cuantas, c.fuerza, true);
  }
  vista.cohetes = vista.cohetes.filter(c => c.t > 0);

  // Partículas.
  for (const p of vista.particulas) {
    if (p.vida <= 0) continue;
    p.vida -= dt; p.v.y -= p.gravedad * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.05) { p.m.position.y = 0.05; p.v.y *= -0.45; p.v.x *= 0.7; p.v.z *= 0.7; }
    p.m.rotation.x += p.giro.x * dt; p.m.rotation.y += p.giro.y * dt;
    p.m.scale.setScalar(Math.max(0.01, p.vida / p.total) * 1.3);
    if (p.vida <= 0) p.m.visible = false;
  }

  moverCamara(modo, dt);
  vista.renderCielo.render(vista.cielo, vista.camara);
  vista.render.render(vista.escena, vista.camara);
}

function moverCamara(modo, dt) {
  // La cámara siempre se desliza hacia donde debe estar, nunca salta.
  const destino = new THREE.Vector3(), mira = new THREE.Vector3();
  vista.zoom += (1 - vista.zoom) * (1 - Math.exp(-dt * 3));
  if (modo.esDemo) {
    // Detrás de la portada la cámara pasea despacio alrededor del tablero.
    vista.paseo = (vista.paseo || 0) + dt * 0.12;
    const d = vista.distancia * 0.95;
    // Mirar por encima del tablero lo baja en la pantalla y deja libre la franja del título.
    mira.set(0, d * 0.15, 0);
    destino.set(Math.sin(vista.paseo) * d, d * 0.62, Math.cos(vista.paseo) * d);
  } else if (vista.orbita) {
    const o = vista.orbita;
    o.t += dt; o.angulo += dt * 0.55;
    mira.set(mundoX(o.foco[1]), 0.5, mundoZ(o.foco[0]));
    destino.set(mira.x + Math.sin(o.angulo) * 8.5, 5.6, mira.z + Math.cos(o.angulo) * 8.5);
    // Si ganó el jugador, los fuegos artificiales siguen saliendo mientras gira la cámara.
    if (o.ganado && Math.floor(o.t * 2.5) !== Math.floor((o.t - dt) * 2.5) && o.t < 6) cohete(o.foco, [ROJO, 0xffffff, DORADO], true);
  } else {
    // Vista normal: desde arriba e inclinada, con un leve seguimiento del jugador.
    const jugador = modo.jugador.visual();
    mira.set(mundoX(jugador[1]) * 0.1, 0, mundoZ(jugador[0]) * 0.1 + DESVIO);
    const d = vista.distancia * vista.zoom;
    destino.set(mira.x, d * 0.86, mira.z + d * 0.52);
  }
  // Justo después del hipersalto la cámara llega muy rápido y luego frena.
  vista.impulso = Math.max(0, (vista.impulso || 0) - dt);
  const k = 1 - Math.exp(-dt * (vista.impulso > 0 ? 7.5 : vista.orbita ? 2.2 : 4));
  vista.pos.lerp(destino, k); vista.mira.lerp(mira, k);
  vista.camara.position.copy(vista.pos); vista.camara.lookAt(vista.mira);
}

// ---------------------------------------------------------------------------
// Interfaz estilo juego de carreras, menú, teclado y ciclo principal
// ---------------------------------------------------------------------------
let modo = null, demo = null, pantalla = 'portada', eligiendo = false;
const $ = id => document.getElementById(id);
const pulsadas = new Set();
const DIRECCIONES = {arrowup: [-1, 0], w: [-1, 0], arrowright: [0, 1], d: [0, 1], arrowdown: [1, 0], s: [1, 0], arrowleft: [0, -1], a: [0, -1]};
const hex = n => '#' + n.toString(16).padStart(6, '0');
const calmado = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lienzos = () => [vista.render.domElement, vista.renderCielo.domElement];
const desenfocar = si => lienzos().forEach(l => l.classList.toggle('borroso', si));
const animar = (pasos, opciones) => lienzos().map(l => l.animate(pasos, opciones));

function poner(elemento, html) {
  // Cambia el contenido solo si es distinto. Devuelve true cuando cambió.
  if (elemento.dataset.html === html) return false;
  elemento.innerHTML = html; elemento.dataset.html = html;
  return true;
}
function saltar(elemento) {
  // Reinicia la animación de entrada: el número nuevo aparece con un salto.
  elemento.classList.remove('salta'); void elemento.offsetWidth; elemento.classList.add('salta');
}
function reloj(segundos) {
  const m = Math.floor(segundos / 60), s = segundos - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

function actualizarInterfaz() {
  const h = modo.hud(), carrera = h.tipo === 'carrera';
  for (const id of ['posiciones', 'lugar', 'contador', 'tiempo']) $(id).hidden = !carrera;
  for (const id of ['marcador', 'aviso']) $(id).hidden = carrera;
  if (carrera) {
    // Clasificación: las filas se quedan en la página y solo cambia su altura, así se ven adelantarse.
    const lista = $('posiciones');
    h.filas.forEach((fila, i) => {
      let el = lista.querySelector(`[data-id="${fila.id}"]`);
      if (!el) {
        el = document.createElement('div'); el.dataset.id = fila.id;
        el.innerHTML = `<span class="puesto carrera"></span><span class="ficha" style="background:${hex(fila.color)}"></span><span class="nombre carrera">${fila.nombre}</span><span class="avance carrera"></span>`;
        lista.appendChild(el);
      }
      el.className = 'fila' + (fila.yo ? ' yo' : '') + (fila.listo ? ' listo' : '');
      el.style.top = i * 52 + 'px';
      el.children[0].textContent = i + 1;
      if (poner(el.children[3], fila.avance)) saltar(el.children[3]);
    });
    [...lista.children].forEach(el => { if (!h.filas.some(f => String(f.id) === el.dataset.id)) el.remove(); });
    if (poner($('lugar'), `${h.lugar}<sup>º</sup>`)) saltar($('lugar'));
    $('lugar').classList.toggle('primero', h.lugar === 1);
    $('contador').children[0].textContent = h.contador[0];
    if (poner($('contador').children[1], h.contador[1])) saltar($('contador').children[1]);
    $('tiempo').textContent = reloj(h.tiempo);
  } else {
    const [a, b] = h.lados;
    const lado = l => `<div class="lado" style="background:${hex(l.color)}"><span>${l.nombre}</span><b>${l.puntos}</b></div>`;
    if (poner($('marcador'), lado(a) + `<span class="entre">A ${h.meta}</span>` + lado(b))) { saltar($('marcador').children[0]); saltar($('marcador').children[2]); }
    if (poner($('aviso'), h.aviso) && h.aviso) saltar($('aviso'));
  }
  // Cuenta regresiva de salida.
  const cuenta = modo.espera > 0 ? String(Math.ceil(modo.espera)) : modo.tiempo - modo.salida < 0.8 ? '¡YA!' : '';
  if (poner($('cuenta'), cuenta) && cuenta) saltar($('cuenta'));
  // Cartel de final de partida.
  const fin = modo.estado !== 'jugando';
  if (fin && $('fin').hidden) {
    $('finTitulo').textContent = modo.final[0]; $('finDetalle').textContent = modo.final[1];
    $('fin').hidden = false; requestAnimationFrame(() => $('fin').classList.add('ver'));
  } else if (!fin && !$('fin').hidden) { $('fin').hidden = true; $('fin').classList.remove('ver'); }
}

function abrir(indice) {
  modo = new MODOS[indice](); pantalla = 'juego';
  $('portada').hidden = true; $('menu').hidden = true; $('hud').hidden = false; $('ayuda').hidden = false;
  $('ayuda').textContent = MODOS[indice].ayuda;
  $('posiciones').innerHTML = '';
  desenfocar(false);
  // Llegada: la cámara viene de muy lejos a toda velocidad y frena sobre el tablero.
  if (!calmado) animar([{transform: 'scale(1.7)'}, {transform: 'scale(1)'}], {duration: 520, easing: 'cubic-bezier(.1,.9,.2,1)'});
  vista.pos.set(0, 170, 150); vista.impulso = 1.1;
}
function mostrarModos() {
  modo = null; pantalla = 'modos'; pulsadas.clear();
  $('hud').hidden = true; $('ayuda').hidden = true; $('fin').hidden = true; $('fin').classList.remove('ver');
  $('menu').hidden = false;
  // Quitar y volver a poner la clase reinicia la animación de entrada de las cajas.
  $('menu').classList.remove('entrando', 'saliendo'); void $('menu').offsetWidth; $('menu').classList.add('entrando');
  desenfocar(true);
}
function dejarPortada() {
  if (pantalla !== 'portada') return;
  $('portada').classList.add('barrida');
  setTimeout(() => $('portada').hidden = true, calmado ? 0 : 750);
  mostrarModos();
}
function reventar(caja) {
  // La caja elegida estalla en triángulos con los colores del juego.
  const r = caja.getBoundingClientRect(), colores = ['#D7282F', '#FFFFFF', '#1B1B1E', '#FFD21E'];
  for (let i = 0; i < (calmado ? 0 : 46); i++) {
    const trozo = document.createElement('div'), lado = 10 + Math.random() * 24;
    const x = r.left + Math.random() * r.width, y = r.top + Math.random() * r.height;
    trozo.className = 'trozo';
    Object.assign(trozo.style, {left: x + 'px', top: y + 'px', width: lado + 'px', height: lado + 'px', background: colores[i % colores.length],
      clipPath: 'polygon(50% 0, 100% 100%, 0 100%)'});
    document.body.appendChild(trozo);
    // Cada trozo sale disparado desde el centro de la caja y cae girando.
    const dx = (x - (r.left + r.width / 2)) * (2.5 + Math.random() * 3), dy = (y - (r.top + r.height / 2)) * (3 + Math.random() * 4) - 120 * Math.random();
    trozo.animate([
      {transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1},
      {transform: `translate(${dx * 0.7}px, ${dy * 0.7}px) rotate(${200 + Math.random() * 300}deg) scale(1)`, opacity: 1, offset: 0.55},
      {transform: `translate(${dx}px, ${dy + 260}px) rotate(${500 + Math.random() * 400}deg) scale(.2)`, opacity: 0},
    ], {duration: 850 + Math.random() * 350, easing: 'cubic-bezier(.15,.7,.4,1)'}).onfinish = () => trozo.remove();
  }
}
function elegir(indice) {
  if (pantalla !== 'modos' || eligiendo) return;
  const caja = $('modos').children[indice];
  eligiendo = true;
  reventar(caja);
  caja.style.visibility = 'hidden';
  $('menu').classList.add('saliendo');
  hipersalto(() => { eligiendo = false; caja.style.visibility = ''; abrir(indice); });
}
function hipersalto(alLlegar) {
  // Salto a toda velocidad: rayas que salen disparadas desde el centro mientras la
  // imagen se abalanza hacia adelante, y un destello blanco al llegar.
  if (calmado) return alLlegar();
  const lienzo = $('salto'), g = lienzo.getContext('2d');
  const ancho = lienzo.width = innerWidth, alto = lienzo.height = innerHeight, cx = ancho / 2, cy = alto / 2;
  const rayas = Array.from({length: 190}, () => ({a: Math.random() * Math.PI * 2, r: 30 + Math.random() * Math.hypot(ancho, alto) * 0.45, grosor: 1 + Math.random() * 2.6, oscura: Math.random() < 0.2}));
  const DURACION = 640, inicio = performance.now();
  const empuje = animar([{transform: 'scale(1)'}, {transform: 'scale(3.6)'}], {duration: DURACION, easing: 'cubic-bezier(.75,0,1,.55)', fill: 'forwards'});
  lienzo.hidden = false; lienzo.style.opacity = 1;
  requestAnimationFrame(function paso(ahora) {
    const p = Math.min(1, (ahora - inicio) / DURACION), fuerza = p * p * p;      // empieza lento y acelera de golpe
    g.clearRect(0, 0, ancho, alto);
    g.lineCap = 'round';
    for (const raya of rayas) {
      const r1 = raya.r * (1 + fuerza * 5), largo = 6 + fuerza * raya.r * 2.6, cos = Math.cos(raya.a), sen = Math.sin(raya.a);
      g.strokeStyle = raya.oscura ? 'rgba(27,27,30,.85)' : `rgba(255,255,255,${0.3 + 0.7 * p})`;
      g.lineWidth = raya.grosor * (1 + fuerza * 2.5);
      g.beginPath(); g.moveTo(cx + cos * r1, cy + sen * r1); g.lineTo(cx + cos * (r1 + largo), cy + sen * (r1 + largo)); g.stroke();
    }
    if (p > 0.78) { g.fillStyle = `rgba(255,255,255,${(p - 0.78) / 0.22})`; g.fillRect(0, 0, ancho, alto); }
    if (p < 1) return requestAnimationFrame(paso);
    empuje.forEach(a => a.cancel());
    alLlegar();
    // El destello se desvanece ya con el tablero en pantalla.
    lienzo.animate([{opacity: 1}, {opacity: 0}], {duration: 420, easing: 'ease-out'}).onfinish = () => { lienzo.hidden = true; };
  });
}

function avanzar(dt) {
  // Un instante de juego: cuenta regresiva, lógica, escena e interfaz.
  // Sin modo elegido corre la partida de demostración, que se reinicia sola al terminar.
  if (!modo && (!demo || demo.estado !== 'jugando')) demo = new Demo();
  const activo = modo || demo;
  if (modo) { const ultima = [...pulsadas].pop(); modo.direccion = ultima ? DIRECCIONES[ultima] : null; }
  activo.tiempo += dt;
  if (activo.espera > 0) {
    // Durante la cuenta regresiva nadie se mueve, así todos salen a la vez.
    activo.espera -= dt;
    if (activo.espera <= 0) activo.salida = activo.tiempo;
  } else if (activo.estado === 'jugando') activo.actualizar(dt);
  sincronizar(activo, dt);
  if (modo) actualizarInterfaz();
}

function iniciar() {
  $('modos').innerHTML = MODOS.map((m, i) => `<button data-i="${i}"><b>${i + 1}. ${m.titulo}</b><span>${m.resumen}</span></button>`).join('');
  $('modos').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) elegir(Number(b.dataset.i)); });
  $('portada').addEventListener('click', dejarPortada);
  if (typeof THREE === 'undefined') { $('sinVista').hidden = false; return; }
  try { iniciarVista(); } catch (error) { $('sinVista').hidden = false; console.error(error); return; }
  addEventListener('keydown', ev => {
    const t = ev.key.toLowerCase();
    if (pantalla === 'portada') return dejarPortada();
    if (pantalla === 'modos') { if (t >= '1' && t <= String(MODOS.length)) elegir(Number(t) - 1); return; }
    if (t === 'escape') return mostrarModos();
    if (t in DIRECCIONES || t === ' ') ev.preventDefault();
    if (t in DIRECCIONES) pulsadas.add(t);
    else if (!ev.repeat) modo.tecla(t);
  });
  addEventListener('keyup', ev => pulsadas.delete(ev.key.toLowerCase()));
  addEventListener('blur', () => pulsadas.clear());
  const cronometro = new THREE.Clock();
  (function cuadro() {
    requestAnimationFrame(cuadro);
    // Se limita dt para que una pausa de la pestaña no haga saltar a nadie.
    avanzar(Math.min(cronometro.getDelta(), 0.05));
  })();
}
if (typeof document !== 'undefined') iniciar();
</script>
</body>
</html>
